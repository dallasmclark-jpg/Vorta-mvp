name: VOR-022 Audit Contract Update

on:
  push:
    branches:
      - refactor/vor-022-semantic-responsive-hooks
    paths:
      - scripts/apply-vor-022-audit-contract-update.mjs
      - .github/workflows/vor-022-audit-contract-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/vor-022-semantic-responsive-hooks
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-vor-022-audit-contract-update.mjs
      - run: node scripts/mobile-portal-audit-contracts.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mobile-portal-audit-contracts.mjs
          git commit -m "VOR-022: align audit coverage with semantic Send behavior"
          git push origin HEAD:refactor/vor-022-semantic-responsive-hooks
