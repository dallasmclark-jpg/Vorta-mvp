name: VOR-040 authenticated 54-question release gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  evaluate:
    if: github.head_ref == 'agent/vor-040-natural-question-audit-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_EVAL_BASE_URL: https://deploy-preview-196--vorta-app.netlify.app
      VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_EVAL_DELAY_MS: 500
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Build combined 54-question fixture
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manager = JSON.parse(fs.readFileSync('tests/evals/vor-033-demo-golden.json', 'utf8'));
          const natural = JSON.parse(fs.readFileSync('tests/evals/vor-040-natural-questions.json', 'utf8'));
          const combined = [...manager, ...natural];
          if (manager.length !== 24 || natural.length < 30 || combined.length < 54) {
            throw new Error(`Unexpected fixture counts: manager=${manager.length}, natural=${natural.length}, combined=${combined.length}`);
          }
          fs.writeFileSync('vor-040-release-54.tmp.json', JSON.stringify(combined, null, 2));
          NODE

      - name: Wait for exact Netlify preview head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: https://deploy-preview-196--vorta-app.netlify.app
        run: |
          for attempt in $(seq 1 96); do
            payload="$(curl --silent --show-error --fail --max-time 15 "$PREVIEW_URL/vorta-build.json" || true)"
            deployed_head="$(printf '%s' "$payload" | node -e 'let value="";process.stdin.on("data",c=>value+=c).on("end",()=>{try{process.stdout.write(JSON.parse(value).commit||"")}catch{}})')"
            if [ "$deployed_head" = "$EXPECTED_HEAD" ]; then
              echo "Exact preview head is ready: $deployed_head"
              exit 0
            fi
            echo "Preview head is ${deployed_head:-unavailable}; waiting for $EXPECTED_HEAD (attempt $attempt/96)."
            sleep 5
          done
          echo "The exact Netlify preview head did not become ready." >&2
          exit 1

      - name: Reset shared-account request window
        run: sleep 315

      - name: Run release questions 1 to 12
        env:
          VORTA_EVAL_OFFSET: 0
          VORTA_EVAL_LIMIT: 12
        run: |
          set -o pipefail
          node scripts/ask-vorta-live-evals.mjs vor-040-release-54.tmp.json 2>&1 | tee vor-040-release-01-12.log

      - name: Reset request window after batch 1
        run: sleep 315

      - name: Run release questions 13 to 24
        env:
          VORTA_EVAL_OFFSET: 12
          VORTA_EVAL_LIMIT: 12
        run: |
          set -o pipefail
          node scripts/ask-vorta-live-evals.mjs vor-040-release-54.tmp.json 2>&1 | tee vor-040-release-13-24.log

      - name: Reset request window after batch 2
        run: sleep 315

      - name: Run release questions 25 to 36
        env:
          VORTA_EVAL_OFFSET: 24
          VORTA_EVAL_LIMIT: 12
        run: |
          set -o pipefail
          node scripts/ask-vorta-live-evals.mjs vor-040-release-54.tmp.json 2>&1 | tee vor-040-release-25-36.log

      - name: Reset request window after batch 3
        run: sleep 315

      - name: Run release questions 37 to 48
        env:
          VORTA_EVAL_OFFSET: 36
          VORTA_EVAL_LIMIT: 12
        run: |
          set -o pipefail
          node scripts/ask-vorta-live-evals.mjs vor-040-release-54.tmp.json 2>&1 | tee vor-040-release-37-48.log

      - name: Reset request window after batch 4
        run: sleep 315

      - name: Run release questions 49 to 54
        env:
          VORTA_EVAL_OFFSET: 48
          VORTA_EVAL_LIMIT: 6
        run: |
          set -o pipefail
          node scripts/ask-vorta-live-evals.mjs vor-040-release-54.tmp.json 2>&1 | tee vor-040-release-49-54.log

      - name: Preserve complete release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vor-040-release-54-${{ github.event.pull_request.head.sha }}
          path: vor-040-release-*.log
          if-no-files-found: error
          retention-days: 30

      - name: Remove completed release workflow
        run: rm .github/workflows/vor-040-release-54.yml

      - name: Commit clean audited branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vorta CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/vor-040-release-54.yml
          git diff --cached --check
          git commit -m "VOR-040: complete authenticated 54-question release gate"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
