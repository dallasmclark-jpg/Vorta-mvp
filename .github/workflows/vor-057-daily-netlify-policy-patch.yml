name: VOR-057 daily Netlify policy patch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vor-056-backlog-action-plan
    paths:
      - .github/workflows/vor-057-daily-netlify-policy-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out active Ask Vorta branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-056-backlog-action-plan
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Apply one-deployment-per-day policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)

          def remove_between(text, start_marker, end_marker):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + text[end:]

          gh = chr(36) + "{{"

          marker = {
              "notBeforeDate": "2026-08-06",
              "releaseDate": None,
              "sourceCommit": None,
              "requestedAtUtc": None,
          }
          write("ops/netlify-release.json", json.dumps(marker, indent=2) + "\n")

          ignore_script = '''import { readFileSync } from "node:fs";
          import { spawnSync } from "node:child_process";

          const markerPath = "ops/netlify-release.json";

          function skipBuild(reason) {
            console.log(`Skipping Netlify build: ${reason}`);
            process.exit(0);
          }

          function continueBuild(reason) {
            console.log(`Proceeding with controlled Netlify build: ${reason}`);
            process.exit(1);
          }

          const context = String(process.env.CONTEXT ?? "").trim();
          const branch = String(process.env.BRANCH ?? "").trim();

          if (context !== "production" || branch !== "main") {
            skipBuild("Deploy Previews and branch deploys are disabled; GitHub CI validates pull requests.");
          }

          let marker;
          try {
            marker = JSON.parse(readFileSync(markerPath, "utf8"));
          } catch {
            skipBuild("the controlled release marker is unavailable or invalid");
          }

          const releaseDate = String(marker.releaseDate ?? "").trim();
          const notBeforeDate = String(marker.notBeforeDate ?? "0000-00-00").trim();
          if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(releaseDate)) {
            skipBuild("no dated production release has been requested");
          }
          if (releaseDate < notBeforeDate) {
            skipBuild(`release date ${releaseDate} is before the permitted date ${notBeforeDate}`);
          }

          const cachedCommit = String(process.env.CACHED_COMMIT_REF ?? "").trim();
          const commit = String(process.env.COMMIT_REF ?? "").trim();
          if (!cachedCommit || !commit || cachedCommit === commit) {
            skipBuild("Netlify did not provide two distinct Git revisions to compare");
          }

          const markerDiff = spawnSync(
            "git",
            ["diff", "--quiet", cachedCommit, commit, "--", markerPath],
            { stdio: "ignore" },
          );
          if (markerDiff.status === 0) {
            skipBuild("the daily release marker did not change");
          }
          if (markerDiff.status !== 1) {
            skipBuild("the daily release marker change could not be verified safely");
          }

          let previousReleaseDate = "";
          const previousMarker = spawnSync(
            "git",
            ["show", `${cachedCommit}:${markerPath}`],
            { encoding: "utf8" },
          );
          if (previousMarker.status === 0) {
            try {
              previousReleaseDate = String(
                JSON.parse(previousMarker.stdout).releaseDate ?? "",
              ).trim();
            } catch {
              skipBuild("the previously deployed release marker is invalid");
            }
          }

          if (previousReleaseDate && releaseDate <= previousReleaseDate) {
            skipBuild(
              `release date ${releaseDate} does not advance the previous deployment date ${previousReleaseDate}`,
            );
          }

          continueBuild(`release marker advanced to ${releaseDate}`);
          '''
          write("scripts/netlify-ignore-build.mjs", ignore_script.replace("          ", ""))

          docs = '''# Daily Netlify release policy

          Vorta uses **one Netlify production deployment per Europe/London calendar day**.

          ## Development

          - Pull requests and branch commits run GitHub TypeScript, contract, smoke, production-build, performance and local browser checks.
          - Deploy Previews and branch deploys are intentionally disabled.
          - Product commits and merges do not deploy unless the controlled release marker advances.

          ## Daily release

          - `.github/workflows/netlify-daily-release.yml` checks `main` once each evening and can also be started manually.
          - The workflow refuses a second release on the same London date.
          - It skips the release when no files other than `ops/netlify-release.json` changed since the previous release source commit.
          - It runs the canonical build and performance gates before changing the marker.
          - Netlify builds only the marker commit, then the reusable production workflow verifies the exact deployed SHA, Ask Vorta decisions and authenticated browser regression.
          - The first controlled release is permitted from 6 August 2026. No additional deployment is requested on 5 August 2026.

          Do not use Netlify build hooks, manual CLI deploys or ad-hoc marker edits for routine development. Emergency deployment requires explicit owner approval and must still respect the daily limit.
          '''
          write("docs/netlify-daily-release.md", docs.replace("          ", ""))

          daily_template = '''name: Daily Netlify production release

          on:
            schedule:
              - cron: "30 20 * * *"
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: daily-netlify-production-release
            cancel-in-progress: false

          jobs:
            release:
              name: Validate and request today's single deployment
              runs-on: ubuntu-latest
              timeout-minutes: 35
              outputs:
                deploy_requested: __GH__ steps.plan.outputs.deploy_requested }}
                release_commit: __GH__ steps.commit.outputs.release_commit }}
                release_date: __GH__ steps.plan.outputs.release_date }}
              steps:
                - name: Check out current main
                  uses: actions/checkout@v4
                  with:
                    ref: main
                    fetch-depth: 0
                    show-progress: false

                - name: Use Node.js 22
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install locked dependencies
                  run: npm ci --silent

                - name: Plan the London-date release
                  id: plan
                  shell: bash
                  run: |
                    release_date="$(TZ=Europe/London date +%F)"
                    not_before_date="$(node -p "JSON.parse(require('node:fs').readFileSync('ops/netlify-release.json','utf8')).notBeforeDate || '0000-00-00'")"
                    previous_release_date="$(node -p "JSON.parse(require('node:fs').readFileSync('ops/netlify-release.json','utf8')).releaseDate || ''")"
                    previous_source_commit="$(node -p "JSON.parse(require('node:fs').readFileSync('ops/netlify-release.json','utf8')).sourceCommit || ''")"
                    source_commit="$(git rev-parse HEAD)"

                    echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
                    echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

                    if [[ "$release_date" < "$not_before_date" ]]; then
                      echo "deploy_requested=false" >> "$GITHUB_OUTPUT"
                      echo "Daily deployment is not permitted before $not_before_date."
                      exit 0
                    fi

                    if [[ "$previous_release_date" == "$release_date" ]]; then
                      echo "deploy_requested=false" >> "$GITHUB_OUTPUT"
                      echo "The single deployment for $release_date was already requested."
                      exit 0
                    fi

                    if [[ -n "$previous_source_commit" ]] && \
                       git cat-file -e "$previous_source_commit^{commit}" 2>/dev/null && \
                       git diff --quiet "$previous_source_commit" HEAD -- . ':(exclude)ops/netlify-release.json'; then
                      echo "deploy_requested=false" >> "$GITHUB_OUTPUT"
                      echo "No unreleased product changes were found."
                      exit 0
                    fi

                    echo "deploy_requested=true" >> "$GITHUB_OUTPUT"

                - name: Run canonical release validation
                  if: steps.plan.outputs.deploy_requested == 'true'
                  run: |
                    npm run build
                    npm run test:performance

                - name: Advance the controlled release marker
                  if: steps.plan.outputs.deploy_requested == 'true'
                  env:
                    RELEASE_DATE: __GH__ steps.plan.outputs.release_date }}
                    SOURCE_COMMIT: __GH__ steps.plan.outputs.source_commit }}
                  run: |
                    node - <<'NODE'
                    const { readFileSync, writeFileSync } = require("node:fs");
                    const marker = JSON.parse(readFileSync("ops/netlify-release.json", "utf8"));
                    marker.releaseDate = process.env.RELEASE_DATE;
                    marker.sourceCommit = process.env.SOURCE_COMMIT;
                    marker.requestedAtUtc = new Date().toISOString();
                    writeFileSync("ops/netlify-release.json", `${JSON.stringify(marker, null, 2)}\n`);
                    NODE

                - name: Commit the single daily release request
                  id: commit
                  if: steps.plan.outputs.deploy_requested == 'true'
                  shell: bash
                  run: |
                    git config user.name "Vorta Daily Release"
                    git config user.email "actions@users.noreply.github.com"
                    git add ops/netlify-release.json
                    git commit -m "chore(release): daily Netlify deployment __GH__ steps.plan.outputs.release_date }}"
                    git push origin HEAD:main
                    echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

                - name: Record skipped release
                  if: steps.plan.outputs.deploy_requested != 'true'
                  run: echo "No Netlify deployment was requested by this run."

            verify-production:
              name: Verify the single daily production deployment
              needs: release
              if: needs.release.outputs.deploy_requested == 'true'
              uses: ./.github/workflows/maintenance-manager-production.yml
              with:
                expected_commit: __GH__ needs.release.outputs.release_commit }}
              secrets: inherit
          '''
          write(
              ".github/workflows/netlify-daily-release.yml",
              daily_template.replace("          ", "").replace("__GH__", gh),
          )

          production_template = '''name: Maintenance Manager production verification

          on:
            workflow_call:
              inputs:
                expected_commit:
                  required: true
                  type: string
              secrets:
                VORTA_E2E_PASSWORD:
                  required: true
            workflow_dispatch:
              inputs:
                expected_commit:
                  description: Exact deployed commit SHA to verify
                  required: true
                  type: string

          permissions:
            contents: read

          concurrency:
            group: maintenance-manager-production-__GH__ inputs.expected_commit }}
            cancel-in-progress: false

          jobs:
            production:
              name: Verify exact production commit
              runs-on: ubuntu-latest
              timeout-minutes: 75
              env:
                EXPECTED_COMMIT: __GH__ inputs.expected_commit }}
                VORTA_PRODUCTION_URL: https://vorta-app.netlify.app
                VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
                VORTA_E2E_EMAIL: demo@vorta.network
                VORTA_E2E_PASSWORD: __GH__ secrets.VORTA_E2E_PASSWORD }}
                VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
                VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
                VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
                VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

              steps:
                - name: Check out deployed commit
                  uses: actions/checkout@v4
                  with:
                    ref: __GH__ inputs.expected_commit }}
                    show-progress: false

                - name: Use Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install application dependencies
                  run: npm ci --silent

                - name: Verify Netlify serves the exact tested commit
                  run: node scripts/verify-production-commit.mjs

                - name: Verify authenticated browser-test secret
                  shell: bash
                  run: |
                    test -n "$VORTA_E2E_PASSWORD" || {
                      echo "VORTA_E2E_PASSWORD is not configured for production verification." >&2
                      exit 1
                    }

                - name: Run VOR-056 backlog production decision
                  id: production_backlog
                  continue-on-error: true
                  shell: bash
                  env:
                    VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
                    VORTA_EVAL_SITE_ID: __GH__ env.VORTA_E2E_SITE_ID }}
                    VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000
                    VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 3
                  run: |
                    set -o pipefail
                    node scripts/ask-vorta-live-evals.mjs tests/evals/vor-056-backlog-action-plan.json 2>&1 | tee ask-vorta-production-backlog.log

                - name: Reset after backlog production decision
                  if: always()
                  run: sleep 310

                - name: Run first 12 Ask Vorta production decisions
                  id: production_window_one
                  if: always()
                  continue-on-error: true
                  shell: bash
                  env:
                    VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
                    VORTA_EVAL_SITE_ID: __GH__ env.VORTA_E2E_SITE_ID }}
                    VORTA_EVAL_OFFSET: 0
                    VORTA_EVAL_LIMIT: 12
                    VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000
                    VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 3
                  run: |
                    set -o pipefail
                    npm run eval:ask-vorta:live 2>&1 | tee ask-vorta-production-window-1.log

                - name: Reset production evaluation rate window
                  if: always()
                  run: sleep 310

                - name: Run final Ask Vorta production decision
                  id: production_window_two
                  if: always()
                  continue-on-error: true
                  shell: bash
                  env:
                    VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
                    VORTA_EVAL_SITE_ID: __GH__ env.VORTA_E2E_SITE_ID }}
                    VORTA_EVAL_OFFSET: 12
                    VORTA_EVAL_LIMIT: 1
                    VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000
                    VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 3
                  run: |
                    set -o pipefail
                    npm run eval:ask-vorta:live 2>&1 | tee ask-vorta-production-window-2.log

                - name: Preserve Ask Vorta production evaluation evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: ask-vorta-production-evidence-__GH__ inputs.expected_commit }}
                    path: |
                      ask-vorta-production-backlog.log
                      ask-vorta-production-window-1.log
                      ask-vorta-production-window-2.log
                    if-no-files-found: error
                    retention-days: 14

                - name: Enforce Ask Vorta production evaluations
                  if: always()
                  shell: bash
                  run: |
                    test "__GH__ steps.production_backlog.outcome }}" = "success" || {
                      echo "The VOR-056 backlog production decision failed." >&2
                      exit 1
                    }
                    test "__GH__ steps.production_window_one.outcome }}" = "success" || {
                      echo "The first 12 Ask Vorta production decisions failed." >&2
                      exit 1
                    }
                    test "__GH__ steps.production_window_two.outcome }}" = "success" || {
                      echo "The final Ask Vorta production decision failed." >&2
                      exit 1
                    }

                - name: Install browser-test runner without changing the lockfile
                  run: npm install --no-save --package-lock=false --silent @playwright/test@1.55.0

                - name: Install Chromium
                  run: npx playwright install --with-deps chromium

                - name: Run authenticated production regression
                  run: npm run test:browser
          '''
          write(
              ".github/workflows/maintenance-manager-production.yml",
              production_template.replace("          ", "").replace("__GH__", gh),
          )

          netlify = read("netlify.toml")
          ignore_line = '  ignore = "node ./scripts/netlify-ignore-build.mjs"\n'
          if ignore_line not in netlify:
              netlify = netlify.replace(
                  '[build]\n',
                  '[build]\n' + ignore_line,
                  1,
              )
          write("netlify.toml", netlify)

          for workflow_path in [
              ".github/workflows/vor-048-validation.yml",
              ".github/workflows/vor-049-validation.yml",
              ".github/workflows/vor-051-validation.yml",
          ]:
              workflow = read(workflow_path)
              workflow = workflow.replace(
                  "      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}\n",
                  "",
              ).replace(
                  "      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--vorta-app.netlify.app\n",
                  "",
              )
              if "Wait for exact Netlify preview commit" in workflow:
                  if workflow_path.endswith("vor-048-validation.yml"):
                      workflow = remove_between(
                          workflow,
                          "      - name: Wait for exact Netlify preview commit\n",
                          "      - name: Preserve failure evidence\n",
                      )
                  elif workflow_path.endswith("vor-049-validation.yml"):
                      workflow = remove_between(
                          workflow,
                          "      - name: Wait for exact Netlify preview commit\n",
                          "      - name: Preserve failure evidence\n",
                      )
                  else:
                      workflow = remove_between(
                          workflow,
                          "      - name: Wait for exact Netlify preview commit\n",
                          "      - name: Install browser-test runner without changing lockfile\n",
                      )
              if workflow_path.endswith("vor-051-validation.yml"):
                  workflow = workflow.replace(
                      "        env:\n          VORTA_E2E_BASE_URL: ${{ env.PREVIEW_URL }}\n",
                      "",
                  ).replace(
                      "name: Exact-preview Maintenance Manager golden journey",
                      "name: Local Maintenance Manager golden journey",
                  )
              write(workflow_path, workflow)

          quality = read(".github/workflows/maintenance-manager-quality.yml")
          quality_additions = (
              '      - "ops/netlify-release.json"\n'
              '      - ".github/workflows/netlify-daily-release.yml"\n'
              '      - ".github/workflows/maintenance-manager-production.yml"\n'
          )
          quality = quality.replace(
              '      - "netlify.toml"\n',
              '      - "netlify.toml"\n' + quality_additions,
          )
          write(".github/workflows/maintenance-manager-quality.yml", quality)

          central = read(".github/workflows/vor-049-validation.yml")
          central_additions = (
              '      - "netlify.toml"\n'
              '      - "ops/netlify-release.json"\n'
              '      - "scripts/netlify-*"\n'
              '      - ".github/workflows/netlify-daily-release.yml"\n'
          )
          central = central.replace(
              '      - "package.json"\n',
              central_additions + '      - "package.json"\n',
          )
          write(".github/workflows/vor-049-validation.yml", central)

          vor49 = read("scripts/vor-049-decision-ready-equipment-contracts.mjs")
          if 'const productionWorkflow = read(".github/workflows/maintenance-manager-production.yml");' not in vor49:
              vor49 = vor49.replace(
                  'const workflow = read(".github/workflows/vor-049-validation.yml");\n',
                  'const workflow = read(".github/workflows/vor-049-validation.yml");\n'
                  'const productionWorkflow = read(".github/workflows/maintenance-manager-production.yml");\n',
                  1,
              )
          old_rate_block_start = 'assert.match(\n  workflow,\n  /Wait for a clean shared evaluation rate window/,'
          rate_block_end = 'assert.match(\n  liveEval,\n'
          if old_rate_block_start in vor49:
              start = vor49.index(old_rate_block_start)
              end = vor49.index(rate_block_end, start)
              new_rate_block = '''assert.match(
            productionWorkflow,
            /Reset production evaluation rate window/,
            "The daily production gate must isolate live decisions from the shared rate window",
          );
          assert.match(productionWorkflow, /run: sleep 310/);
          assert.match(productionWorkflow, /VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000/);
          assert.match(productionWorkflow, /VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 3/);
          assert.doesNotMatch(workflow, /deploy-preview-|Wait for exact Netlify preview commit/);
          '''
              vor49 = vor49[:start] + new_rate_block + vor49[end:]
          write("scripts/vor-049-decision-ready-equipment-contracts.mjs", vor49)

          vor51 = read("scripts/vor-051-manager-demo-rehearsal-contracts.mjs")
          block_start = 'for (const marker of [\n  "Wait for exact Netlify preview commit",'
          block_end = 'assert.doesNotMatch(workflow, /eval:ask-vorta:vor0(?:48|49)/);'
          if block_start in vor51:
              start = vor51.index(block_start)
              end = vor51.index(block_end, start)
              replacement = '''for (const marker of [
            "npm run test:browser:vor051",
            "dist/vorta-build.json",
            "playwright-report",
            "test-results",
            '"src/screens/AiOperations/**"',
          ]) assert.ok(workflow.includes(marker), `Missing VOR-051 workflow marker: ${marker}`);
          assert.doesNotMatch(
            workflow,
            /deploy-preview-|Wait for exact Netlify preview commit|VORTA_E2E_BASE_URL/,
          );
          assert.ok(
            workflow.indexOf("Build production bundle") <
              workflow.indexOf("Run authenticated phone and laptop manager rehearsal"),
          );
          '''
              vor51 = vor51[:start] + replacement + vor51[end:]
          write("scripts/vor-051-manager-demo-rehearsal-contracts.mjs", vor51)

          vor56 = read("scripts/vor-056-backlog-action-plan-contracts.mjs")
          if 'const productionWorkflow = readFileSync(' not in vor56:
              insert = '''const productionWorkflow = readFileSync(
            ".github/workflows/maintenance-manager-production.yml",
            "utf8",
          );
          '''
              marker_text = 'const scenarios = JSON.parse(\n'
              vor56 = vor56.replace(marker_text, insert + marker_text, 1)
          ordering_start = 'const resetIndex = centralWorkflow.indexOf('
          console_marker = 'console.log("VOR-056 actionable backlog decision contracts passed.");'
          if ordering_start in vor56:
              start = vor56.index(ordering_start)
              end = vor56.index(console_marker, start)
              replacement = '''const backlogIndex = productionWorkflow.indexOf(
            "Run VOR-056 backlog production decision",
          );
          const resetIndex = productionWorkflow.indexOf(
            "Reset after backlog production decision",
          );
          const productionWindowIndex = productionWorkflow.indexOf(
            "Run first 12 Ask Vorta production decisions",
          );
          assert.ok(
            backlogIndex >= 0 && resetIndex > backlogIndex && productionWindowIndex > resetIndex,
            "The focused backlog decision must run once after deployment and before the production golden suite",
          );
          assert.ok(
            productionWorkflow.includes(
              "node scripts/ask-vorta-live-evals.mjs tests/evals/vor-056-backlog-action-plan.json",
            ) && productionWorkflow.includes("ask-vorta-production-backlog.log"),
            "The daily production gate must run and preserve VOR-056 live evidence",
          );

          '''
              vor56 = vor56[:start] + replacement + vor56[end:]
          write("scripts/vor-056-backlog-action-plan-contracts.mjs", vor56)

          vor55 = read("scripts/vor-055-production-verification-contracts.mjs")
          if 'const dailyWorkflow = readFileSync(' not in vor55:
              insert = '''const dailyWorkflow = readFileSync(
            ".github/workflows/netlify-daily-release.yml",
            "utf8",
          );
          '''
              vor55 = vor55.replace(
                  'const equipmentEvidence = readFileSync(\n',
                  insert + 'const equipmentEvidence = readFileSync(\n',
                  1,
              )
          before_log = 'console.log("VOR-055 Ask Vorta production verification contracts passed.");'
          daily_assertions = '''assert.ok(
            dailyWorkflow.includes("uses: ./.github/workflows/maintenance-manager-production.yml") &&
              dailyWorkflow.includes("expected_commit:"),
            "The single daily release must call the reusable exact-production verifier",
          );
          assert.ok(
            productionWorkflow.includes("workflow_call:") &&
              productionWorkflow.includes("Run VOR-056 backlog production decision"),
            "Production verification must be reusable and retain the backlog decision gate",
          );

          '''
          if "The single daily release must call" not in vor55:
              vor55 = vor55.replace(before_log, daily_assertions + before_log, 1)
          write("scripts/vor-055-production-verification-contracts.mjs", vor55)

          suite = read("scripts/run-contract-suite.mjs")
          suite_entry = '  ["VOR-057 daily Netlify release", "scripts/netlify-daily-deploy-contracts.mjs"],\n'
          if suite_entry not in suite:
              suite = suite.replace(
                  '  ["VOR-056 actionable backlog decisions", "scripts/vor-056-backlog-action-plan-contracts.mjs"],\n',
                  '  ["VOR-056 actionable backlog decisions", "scripts/vor-056-backlog-action-plan-contracts.mjs"],\n' + suite_entry,
                  1,
              )
          write("scripts/run-contract-suite.mjs", suite)

          daily_contract = '''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const read = (path) => readFileSync(path, "utf8");
          const netlify = read("netlify.toml");
          const ignore = read("scripts/netlify-ignore-build.mjs");
          const daily = read(".github/workflows/netlify-daily-release.yml");
          const production = read(".github/workflows/maintenance-manager-production.yml");
          const docs = read("docs/netlify-daily-release.md");
          const marker = JSON.parse(read("ops/netlify-release.json"));
          const prWorkflows = [
            read(".github/workflows/vor-048-validation.yml"),
            read(".github/workflows/vor-049-validation.yml"),
            read(".github/workflows/vor-051-validation.yml"),
          ].join("\n");
          const suite = read("scripts/run-contract-suite.mjs");

          assert.match(netlify, /ignore = "node \.\/scripts\/netlify-ignore-build\.mjs"/);
          for (const required of [
            'context !== "production" || branch !== "main"',
            "Deploy Previews and branch deploys are disabled",
            '["diff", "--quiet", cachedCommit, commit, "--", markerPath]',
            '["show", `${cachedCommit}:${markerPath}`]',
            "releaseDate <= previousReleaseDate",
            "process.exit(1)",
          ]) assert.ok(ignore.includes(required), `Missing Netlify ignore control: ${required}`);

          assert.equal(marker.notBeforeDate, "2026-08-06");
          assert.equal(marker.releaseDate, null);
          assert.equal(marker.sourceCommit, null);

          for (const required of [
            'cron: "30 20 * * *"',
            "group: daily-netlify-production-release",
            "TZ=Europe/London date +%F",
            "previous_release_date",
            "No unreleased product changes were found",
            "npm run build",
            "npm run test:performance",
            "git add ops/netlify-release.json",
            "git push origin HEAD:main",
            "uses: ./.github/workflows/maintenance-manager-production.yml",
          ]) assert.ok(daily.includes(required), `Missing daily release control: ${required}`);
          assert.doesNotMatch(daily, /netlify deploy|build hook|\/api\/v1\/sites\/.*\/builds/i);

          assert.doesNotMatch(
            prWorkflows,
            /deploy-preview-|Wait for exact Netlify preview commit|PREVIEW_URL/,
          );
          assert.ok(
            prWorkflows.includes("npm run typecheck") &&
              prWorkflows.includes("npm run test:contracts") &&
              prWorkflows.includes("npx vite build"),
            "Pull requests must retain local static and production-build validation",
          );

          for (const required of [
            "workflow_call:",
            "expected_commit:",
            "node scripts/verify-production-commit.mjs",
            "Run VOR-056 backlog production decision",
            "Run first 12 Ask Vorta production decisions",
            "Run final Ask Vorta production decision",
            "Run authenticated production regression",
          ]) assert.ok(production.includes(required), `Missing production verification control: ${required}`);

          assert.ok(docs.includes("one Netlify production deployment per Europe/London calendar day"));
          assert.ok(
            suite.includes(
              '["VOR-057 daily Netlify release", "scripts/netlify-daily-deploy-contracts.mjs"]',
            ),
          );

          console.log("VOR-057 one-deployment-per-day contracts passed.");
          '''
          write("scripts/netlify-daily-deploy-contracts.mjs", daily_contract.replace("          ", ""))
          PY

      - name: Run focused deployment and Ask Vorta contracts
        run: |
          node scripts/netlify-daily-deploy-contracts.mjs
