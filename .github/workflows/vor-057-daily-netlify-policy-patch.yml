name: VOR-057 daily Netlify policy patch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vor-056-backlog-action-plan
    paths:
      - .github/workflows/vor-057-daily-netlify-policy-patch.yml
      - .github/scripts/vor-057-daily-netlify-policy-patch.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out active Ask Vorta branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-056-backlog-action-plan
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Apply one-deployment-per-day policy
        shell: bash
        run: |
          python .github/scripts/vor-057-daily-netlify-policy-patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/netlify-daily-deploy-contracts.mjs")
          content = path.read_text()
          content = content.replace('].join("\n");', '].join("\\n");')
          path.write_text(content)
          PY

      - name: Run focused deployment and Ask Vorta contracts
        run: |
          node scripts/netlify-daily-deploy-contracts.mjs
          node scripts/vor-049-decision-ready-equipment-contracts.mjs
          node scripts/vor-051-manager-demo-rehearsal-contracts.mjs
          node scripts/vor-055-production-verification-contracts.mjs
          node scripts/vor-056-backlog-action-plan-contracts.mjs

      - name: Run complete canonical validation
        run: npm run build

      - name: Enforce unchanged performance budgets
        run: npm run test:performance

      - name: Check final diff
        run: |
          git diff --check
          git status --short

      - name: Commit verified daily deployment policy
        run: |
          git config user.name "Ask Vorta CI"
          git config user.email "actions@users.noreply.github.com"
          git add netlify.toml ops docs scripts .github/workflows
          git reset .github/workflows/vor-057-daily-netlify-policy-patch.yml
          git reset .github/scripts/vor-057-daily-netlify-policy-patch.py
          git diff --cached --quiet && { echo "No policy changes to commit"; exit 1; }
          git commit -m "VOR-057 enforce one daily Netlify deployment [skip netlify]"
          git push origin HEAD:agent/vor-056-backlog-action-plan
