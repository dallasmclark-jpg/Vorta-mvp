name: VOR-040 production question audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vor-040-production-eval.yml"
      - "tests/evals/vor-040-natural-questions.json"
      - "scripts/ask-vorta-live-evals.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-production-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VORTA_SUPABASE_KEY_PREFIX: ${{ vars.VORTA_SUPABASE_KEY_PREFIX }}
      VORTA_SUPABASE_KEY_SUFFIX: ${{ vars.VORTA_SUPABASE_KEY_SUFFIX }}
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
      VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_EVAL_LIMIT: 10
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Run first authenticated production batch
        shell: bash
        run: |
          set -o pipefail
          npm run eval:ask-vorta:vor040 2>&1 | tee vor-040-production-batch-1.log

      - name: Preserve evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vor-040-production-batch-1
          path: vor-040-production-batch-1.log
          if-no-files-found: error
          retention-days: 14
