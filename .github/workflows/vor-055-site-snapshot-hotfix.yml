name: Apply VOR-055 site snapshot compaction

on:
  push:
    branches:
      - agent/vor-055-production-verifier
    paths:
      - ".github/workflows/vor-055-site-snapshot-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vor-055-site-snapshot-hotfix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out VOR-055 branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-055-production-verifier
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded operational snapshot compaction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          evidence_path = Path("netlify/functions/ask-vorta/equipment-evidence.mts")
          source = evidence_path.read_text()

          function_source = r'''export function compactSiteOperationalSnapshotForModel(
            result: ToolResult,
          ): ToolResult | null {
            if (
              result.source !== "Vorta operational decision snapshot" ||
              !result.data ||
              typeof result.data !== "object" ||
              Array.isArray(result.data)
            ) {
              return null;
            }

            const data = result.data as JsonRecord;
            const domains =
              data.domains && typeof data.domains === "object" && !Array.isArray(data.domains)
                ? (data.domains as JsonRecord)
                : {};
            const domainLimits: Array<[string, number]> = [
              ["rankedActions", 14],
              ["siteRisk", 6],
              ["workBacklog", 6],
              ["sparesRisk", 6],
              ["capability", 6],
              ["handover", 6],
            ];
            const compactDomains = Object.fromEntries(
              domainLimits.flatMap(([domainName, limit]) => {
                const domain = domains[domainName];
                if (!domain || typeof domain !== "object" || Array.isArray(domain)) return [];
                const domainRecord = domain as JsonRecord;
                const seen = new Set<string>();
                const decisionFacts = collectDecisionFacts(domainRecord.data)
                  .sort(
                    (first, second) =>
                      second.score - first.score || first.text.localeCompare(second.text),
                  )
                  .filter((fact) => {
                    const key = fact.text.toLowerCase();
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                  })
                  .slice(0, limit)
                  .map((fact) => fact.text.slice(0, 650));
                return [[
                  domainName,
                  {
                    source: domainRecord.source,
                    status: domainRecord.status,
                    message: domainRecord.message,
                    decisionFacts,
                  },
                ]];
              }),
            );

            return {
              source: result.source,
              status: result.status,
              message: result.message,
              data: {
                generatedAt: data.generatedAt,
                domains: compactDomains,
                caveat: data.caveat,
                detailScope:
                  "The model-facing snapshot preserves ranked actions plus bounded risk, work, spares, capability and handover decision facts, including owners, blockers, dependencies and verification evidence.",
              },
            };
          }

          '''
          marker = "export function trimToolResult(result: ToolResult): string {\n"
          if "compactSiteOperationalSnapshotForModel(" not in source:
              assert marker in source, "Missing trimToolResult insertion point"
              source = source.replace(marker, function_source + marker, 1)

          equipment_block = '''  const compactEquipmentPack = compactEquipmentDecisionPackForModel(result);
            if (compactEquipmentPack) {
              const compactSerialised = JSON.stringify(compactEquipmentPack);
              if (compactSerialised.length <= MAX_TOOL_OUTPUT_CHARACTERS) {
                return compactSerialised;
              }
              const data = compactEquipmentPack.data as JsonRecord;
              return JSON.stringify({
                ...compactEquipmentPack,
                data: {
                  ...data,
                  decisionFacts: textValues(data.decisionFacts)
                    .slice(0, 12)
                    .map((fact) => fact.slice(0, 650)),
                },
              });
            }

          '''
          site_block = '''  const compactSiteSnapshot = compactSiteOperationalSnapshotForModel(result);
            if (compactSiteSnapshot) {
              const compactSerialised = JSON.stringify(compactSiteSnapshot);
              if (compactSerialised.length <= MAX_TOOL_OUTPUT_CHARACTERS) {
                return compactSerialised;
              }
              const data = compactSiteSnapshot.data as JsonRecord;
              const domains = data.domains as JsonRecord;
              return JSON.stringify({
                ...compactSiteSnapshot,
                data: {
                  ...data,
                  domains: Object.fromEntries(
                    Object.entries(domains).map(([domainName, domain]) => {
                      const domainRecord = domain as JsonRecord;
                      return [
                        domainName,
                        {
                          ...domainRecord,
                          decisionFacts: textValues(domainRecord.decisionFacts)
                            .slice(0, domainName === "rankedActions" ? 8 : 4)
                            .map((fact) => fact.slice(0, 450)),
                        },
                      ];
                    }),
                  ),
                },
              });
            }

          '''
          if site_block.strip() not in source:
              assert equipment_block in source, "Missing equipment compaction block"
              source = source.replace(equipment_block, equipment_block + site_block, 1)

          source = source.replace(
              "/title|summary|description|action|outcome|status|quantity|stock|lead|risk|validation|calibration|cause|text|note|specialism|evidence/i",
              "/title|summary|description|action|owner|block|depend|verification|priority|outcome|status|quantity|stock|lead|risk|validation|calibration|cause|text|note|specialism|evidence/i",
              1,
          )
          source = source.replace(
              "/title|summary|description|action|outcome|status|quantity|stock|lead|risk|validation|calibration/i",
              "/title|summary|description|action|owner|block|depend|verification|priority|outcome|status|quantity|stock|lead|risk|validation|calibration/i",
              1,
          )
          evidence_path.write_text(source)

          contract_path = Path("scripts/vor-055-production-verification-contracts.mjs")
          contract = contract_path.read_text()
          read_marker = '''const productionWorkflow = readFileSync(
            ".github/workflows/maintenance-manager-production.yml",
            "utf8",
          );
          '''
          evidence_read = '''const equipmentEvidence = readFileSync(
            "netlify/functions/ask-vorta/equipment-evidence.mts",
            "utf8",
          );
          '''
          if "const equipmentEvidence = readFileSync(" not in contract:
              assert read_marker in contract, "Missing VOR-055 contract read insertion point"
              contract = contract.replace(read_marker, read_marker + evidence_read, 1)

          assertion_marker = '''assert.equal(
            scenarios.length,
            13,
            "The production golden suite must retain all 13 cross-domain scenarios",
          );
          '''
          snapshot_assertions = '''assert.ok(
            equipmentEvidence.includes("compactSiteOperationalSnapshotForModel") &&
              equipmentEvidence.includes('result.source !== "Vorta operational decision snapshot"'),
            "The site operational snapshot must have a dedicated model-facing compactor",
          );
          for (const domain of [
            "rankedActions",
            "siteRisk",
            "workBacklog",
            "sparesRisk",
            "capability",
            "handover",
          ]) {
            assert.ok(
              equipmentEvidence.includes(`["${domain}",`),
              `The compact operational snapshot must preserve ${domain} decision facts`,
            );
          }
          const siteCompactorIndex = equipmentEvidence.indexOf(
            "compactSiteOperationalSnapshotForModel(result)",
          );
          const genericOversizeIndex = equipmentEvidence.indexOf(
            "const serialised = JSON.stringify(result)",
          );
          assert.ok(
            siteCompactorIndex >= 0 && genericOversizeIndex > siteCompactorIndex,
            "Site snapshot compaction must run before the generic oversized-result fallback",
          );
          assert.ok(
            equipmentEvidence.includes("collectDecisionFacts(domainRecord.data)") &&
              equipmentEvidence.includes('["rankedActions", 14]') &&
              equipmentEvidence.includes("fact.text.slice(0, 650)"),
            "The site snapshot must use bounded ranked decision facts",
          );
          for (const decisionField of [
            "owner",
            "block",
            "depend",
            "verification",
            "priority",
          ]) {
            assert.ok(
              equipmentEvidence.includes(decisionField),
              `The model-facing fact collector must preserve ${decisionField} evidence`,
            );
          }

          '''
          if "The site operational snapshot must have a dedicated model-facing compactor" not in contract:
              assert assertion_marker in contract, "Missing VOR-055 assertion insertion point"
              contract = contract.replace(
                  assertion_marker,
                  snapshot_assertions + assertion_marker,
                  1,
              )
          contract_path.write_text(contract)
          PY

      - name: Install dependencies
        run: npm ci --silent

      - name: Run focused VOR-055 contracts
        run: node scripts/vor-055-production-verification-contracts.mjs

      - name: Run canonical production build and permanent checks
        run: npm run build

      - name: Commit verified site snapshot fix
        shell: bash
        run: |
          git config user.name "Vorta Engineering Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            netlify/functions/ask-vorta/equipment-evidence.mts \
            scripts/vor-055-production-verification-contracts.mjs
          git commit -m "Compact Ask Vorta site priority evidence"
          git push origin HEAD:agent/vor-055-production-verifier
