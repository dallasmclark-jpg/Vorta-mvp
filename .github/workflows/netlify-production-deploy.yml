name: Deploy Vorta to Netlify

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/deploy-source-trigger"
      - ".github/workflows/netlify-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: vorta-netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'deploy/vor-014-production-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy production site
        env:
          NETLIFY_SITE_ID: 4672c4a4-53eb-475d-ae88-a9de4ecdeae8
          NETLIFY_PROXY_PATH: https://netlify-mcp.netlify.app//proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..OlcN_BUoLAweRbcJ.HrQo7NBtIgFNhoC8NwWDbWAKajNMcY9Z3aJ6jjJtEsYpSyNufyIzyRtE3r4djytCiUJjAbA_G4qLaVrBFOVt5NHu7fzvZoWigFe7VPx8XpwbUb0Y8TeNUBxuCdWMfk5goyloDeHDbjSlDfWgD022A49_3TpOADXZHMKLUfBPpbuAlKrrJkynzZc2tj06qGDubKfNB94Y2gD3DQxhszPhaZGgkHjWwcBOmiOKZmLfa1-DaOERTvKIhB6r5gxaA5S5mfbyqWzvNBzb3vzl9Bsww11_kE-8dRc0WKIVt8Lnqx2z9ll_MYQcdUw6NnS3HKbTKae5BA7JgzqdkMzXIzEW4nEPDQSSVAzuvt0jDD97lJCdENyddAqkhrVn6e22-LBEYZai07sl.ZPzMgrqXKU1aWaSKenXquQ
        run: |
          echo "::add-mask::$NETLIFY_PROXY_PATH"
          npx --yes @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$NETLIFY_PROXY_PATH"
