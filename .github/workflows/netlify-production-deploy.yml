name: Deploy Vorta to Netlify

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/deploy-source-trigger"
      - ".github/workflows/netlify-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: vorta-netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'deploy/vor-014-production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy production site
        env:
          NETLIFY_SITE_ID: 4672c4a4-53eb-475d-ae88-a9de4ecdeae8
          NETLIFY_PROXY_PATH: https://netlify-mcp.netlify.app//proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..01UrRfZps6gpZYdd.Epc-QBSv0QkDW140p4UNO0D4Yir-9r8I4um-J1cWfmzp6mP-bdNXoebgaKhZUbpLdCGgr5hs8hfjV9D5Mh2dUEBt5oGlq8_rmGs1TSaBJ6iI9Upsi2l5ZkPNpNEtWO_KHDAat-6ObGbq5aVmNdFoXtnPPbck5s2_kYQrqkBve1KDbGpfobIcITASQJC_SsPl2L-JL-JsrZVTSs3uOpIWVWfDmv30edepXbCJowhxlS4n2fXN7VdKkXUIeJwVIk_ipVFDizud7O4jVM7gypuJl1VYTY1TInZw906SpNNH3iwliRSF9lOcu6p-cE10WbQ4X3uVVVz3zZQ7CT5u-9zG_T8YpvtdL1etiClXoEbeIsN0F-zQYFiMH6-47wHami1ugAgOq6on.97j5dm-xlpp7rSCPcuLtLA
        run: |
          echo "::add-mask::$NETLIFY_PROXY_PATH"
          npx --yes @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$NETLIFY_PROXY_PATH"
