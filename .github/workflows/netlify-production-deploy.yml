name: Deploy Vorta to Netlify

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/deploy-source-trigger"
      - ".github/workflows/netlify-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: vorta-netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'deploy/vor-014-production-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy production site
        env:
          NETLIFY_SITE_ID: 4672c4a4-53eb-475d-ae88-a9de4ecdeae8
          NETLIFY_PROXY_PATH: https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..78CliHSAernAAQ-X.kC87jxuxDr4PYe4eQdWhc-QCNXzyI8LndQaPTKMRMXp8SCC3D-zzi2gHHobjv2KId5-BSVqrnWTVujLfA4Oh355bLTA60CMCkGnyjotrmVWsr6IizWXBD-STwjgPlkUnyNQs_Azm8SCD16G8I5SeuFiUok_mNylS3GafcVZfzrkfEOe3cbovjt0jm200hsR2O3wGqQ_5fCDMBvQkqqCmqnSr7S5wSFWEmAC6tAgMy8vH3TjuAEMPwLXvyAlK76Okq6dE07G2e0ZgtZn1qb4oGNHJ4MjdXaPfzI6YzHWIiJvep9YfgDvTL3J734s3e7Sk9uOcoC8YdpqyHr28XXkl83QVQtIZkVoSIuff1sL7LS9INlcS0NZ_lOoO92rntGg019XnLFA2.A2I058VgwI3vLQwVCbOBgQ
        run: |
          echo "::add-mask::$NETLIFY_PROXY_PATH"
          npx --yes @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$NETLIFY_PROXY_PATH"
