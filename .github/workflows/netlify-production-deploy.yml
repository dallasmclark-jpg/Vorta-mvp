name: Deploy Vorta to Netlify

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/deploy-source-trigger"
      - ".github/workflows/netlify-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: vorta-netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'deploy/vor-014-production-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy production site
        env:
          NETLIFY_SITE_ID: 4672c4a4-53eb-475d-ae88-a9de4ecdeae8
          NETLIFY_PROXY_PATH: https://netlify-mcp.netlify.app//proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..tgwpqWUBxldxMck3.oQBCEBRYb1WcTJpynYQJyR2DFV_ot-_ptH-mpxu1AnAgKD26-WoggoZw4cEaTeiyMFq5-qNCfssvdJhkWUgZ_yJwpfd3pBrIEi0Qbl_EOIlqOKITs1D9gJ-Te46K2v-_b7XGsEHNnbI8VdWYx6DWOpXDssMNTzL76Wpb-qs61Tlo30LDrS9HXmKIrZ1wGFXOlC94VPmpHPhcUlFUC1DirUmbk-RyhH2HlP1OH52K0C6FVrR7tHi6PXZAcz5gDhb51bWg0NXC2NnJLKTMdLF7goUyyqVgFSPAnW-tYsyYY-uQqA1ENsxn8a48BhWtytfN1Pl2Nv84bi1SV8n_Mfn0OTXv4wQqjICMDqM03-6J37ygBK2PEPNt9b1CHaowP-8EuxF3RYhZ.kI_XFfrt-iyWt9g1D7larw
        run: |
          echo "::add-mask::$NETLIFY_PROXY_PATH"
          npx --yes @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$NETLIFY_PROXY_PATH"
