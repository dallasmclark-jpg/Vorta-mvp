name: Deploy Vorta to Netlify

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/deploy-source-trigger"
      - ".github/workflows/netlify-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: vorta-netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'deploy/vor-014-production-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy production site
        env:
          NETLIFY_SITE_ID: 4672c4a4-53eb-475d-ae88-a9de4ecdeae8
          NETLIFY_PROXY_PATH: https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..RkvclupRLNh4Y5RJ.dJnNq5JxSmsiNEZbrqYOd_WQzcolPst4d4Klr3MAdJcjUedxWsU1Dp7OhCZmo5RsSjKGAPMWjWH8RDMGAE3WoJjzj8DLapRxBWBFf9vRdwQ-VKbdL85LVhvqiDmkSx2gqaNxF7MKXPBWVL42aDbDmgkXpLGQQYnlr7oKe_CiMGb1YBPl6QTD1kAfaayuyF99cwRtDeAejmznBww8V3pJKOaOcT1GnuAUEz3Kx3N9ANVb0xRFadwbtPl7TYL5gxHjwBVNiDzO4m1g567xZavsWCGY-xG6gFXJPJtUyvNWm6Mwl6UkZhsQHVO6pUZ_iSYVJ-XO0GnVw4ZZPLbPLm3lPXN5iMCQtzmpjHXAyZIuxuS-wMKwRouyzNbpA6gF2S-iqa5KwBJq.JuCOEVCYD2smxwBAdrykkg
        run: |
          echo "::add-mask::$NETLIFY_PROXY_PATH"
          npx --yes @netlify/mcp@latest --site-id "$NETLIFY_SITE_ID" --proxy-path "$NETLIFY_PROXY_PATH"
