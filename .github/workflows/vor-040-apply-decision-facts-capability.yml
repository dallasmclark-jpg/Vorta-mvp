name: VOR-040 apply decision facts and capability

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/vor-040-natural-question-audit-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect completed repair
        id: state
        shell: bash
        run: |
          if grep -q 'retainEquipmentDecisionFacts' netlify/functions/ask-vorta.mts && grep -q 'isCapabilityRequest' netlify/edge-functions/ask-vorta-work-backlog.ts; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.skip != 'true'
        run: npm ci

      - name: Apply exact-fact and capability repair
        if: steps.state.outputs.skip != 'true'
        run: python3 scripts/vor-040-retain-facts-capability-patch.py

      - name: Verify backend and edge TypeScript
        if: steps.state.outputs.skip != 'true'
        run: |
          npm run typecheck:functions
          npx tsc --noEmit --strict --skipLibCheck --moduleResolution bundler --module ESNext --target ES2022 --lib ES2022,DOM netlify/edge-functions/ask-vorta-work-backlog.ts

      - name: Verify Ask Vorta contracts
        if: steps.state.outputs.skip != 'true'
        run: |
          node scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs
          node scripts/vor-040-natural-question-contracts.mjs
          node scripts/ask-vorta-agent-contracts.mjs

      - name: Remove disposable repair scaffolding
        if: steps.state.outputs.skip != 'true'
        run: |
          rm scripts/vor-040-retain-facts-capability-patch.py
          rm .github/workflows/vor-040-apply-decision-facts-capability.yml

      - name: Commit verified repair
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/ask-vorta.mts netlify/edge-functions/ask-vorta-work-backlog.ts
          git add -u scripts/vor-040-retain-facts-capability-patch.py .github/workflows/vor-040-apply-decision-facts-capability.yml
          git commit -m 'VOR-040: retain exact equipment facts and accelerate capability answers'
          git push origin HEAD:${{ github.head_ref }}
