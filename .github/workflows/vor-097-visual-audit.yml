name: VOR-097 full visual consistency audit

on:
  push:
    branches:
      - audit/vor-097-visual-consistency-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture every Maintenance Manager page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000001

    steps:
      - name: Check out audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Install Chromium browser only
        run: npx playwright install chromium

      - name: Capture authenticated visual audit
        run: npx playwright test tests/browser/vor-097-full-page-visual-audit.spec.ts --project=desktop-1920 --config=playwright.config.ts

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vor-097-visual-consistency-audit-${{ github.sha }}
          path: |
            visual-audit
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
