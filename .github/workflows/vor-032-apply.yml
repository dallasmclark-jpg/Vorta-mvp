name: Apply VOR-032 critical spares dashboard

on:
  push:
    branches:
      - agent/vor-032-critical-spares

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip vor-032 apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply focused VOR-032 patches
        run: python scripts/vor-032-apply.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused contract
        run: node scripts/vor-032-dashboard-critical-spares-contracts.mjs

      - name: Run production build and full contract suite
        run: npm run build

      - name: Remove one-use patch machinery
        run: |
          rm scripts/vor-032-apply.py
          rm .github/workflows/vor-032-apply.yml

      - name: Commit implementation
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "Vorta automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VOR-032: surface critical spare risks on dashboard [skip vor-032 apply]"
          git push origin "HEAD:${TARGET_BRANCH}"
