name: VOR-067 destination reopen production verification

on:
  pull_request:
    paths:
      - .github/workflows/vor-067-destination-reopen-production-verification.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Verify production Back to chat restores active conversation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: 94c2bf668fc502ea1a06c53d067ec5f92c8d211b
      VORTA_PRODUCTION_URL: https://vorta-app.netlify.app
      VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

    steps:
      - name: Check out exact deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 94c2bf668fc502ea1a06c53d067ec5f92c8d211b
          show-progress: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Verify production serves the exact commit
        run: node scripts/verify-production-commit.mjs

      - name: Verify authenticated browser-test secret
        shell: bash
        run: |
          test -n "$VORTA_E2E_PASSWORD" || {
            echo "VORTA_E2E_PASSWORD is not configured." >&2
            exit 1
          }

      - name: Narrow duplicate page label in verification copy
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "tests/browser/vor-067-production-chat-return.spec.ts";
          let source = fs.readFileSync(path, "utf8");
          const before = 'page.getByText("Page 12 of 20", { exact: true })';
          const after = 'page.getByText("Page 12 of 20", { exact: true }).first()';
          if (!source.includes(before)) {
            throw new Error("Expected VOR-067 page locator was not found in the exact deployed source.");
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify real production Ask Vorta document return journey
        run: npx playwright test tests/browser/vor-067-production-chat-return.spec.ts --project=samsung-tablet-landscape
