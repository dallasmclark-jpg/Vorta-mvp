name: VOR-042 apply response hierarchy

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/vor-042-ask-vorta-response-hierarchy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out response hierarchy branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect completed implementation
        id: state
        shell: bash
        run: |
          if grep -q 'wideCompactPresentation' src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.skip != 'true'
        run: npm ci

      - name: Apply VOR-042 presentation patch
        if: steps.state.outputs.skip != 'true'
        run: node scripts/apply-vor-042-ask-vorta-polish.mjs

      - name: Prove approved mobile styling was not edited
        if: steps.state.outputs.skip != 'true'
        run: git diff --exit-code origin/main -- src/styles/mobilePortalHardening.css

      - name: Verify production build and contracts
        if: steps.state.outputs.skip != 'true'
        run: npm run build

      - name: Commit verified VOR-042 implementation
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/screens/AiOperations/AskVortaWorkspace.tsx \
            src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx \
            tests/browser/vor-041-ask-vorta-workspace.spec.ts \
            scripts/vor-042-ask-vorta-polish-contracts.mjs \
            scripts/run-contract-suite.mjs
          git commit -m 'VOR-042: polish Ask Vorta response hierarchy'
          git push origin HEAD:${{ github.head_ref }}
