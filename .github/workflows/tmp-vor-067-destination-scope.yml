name: tmp-vor-067-destination-scope

on:
  push:
    branches:
      - fix/vor-067-destination-scope

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'VOR-067: scope Back to chat to direct destination'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vor-067-destination-scope
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply destination-scoped return state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/screens/AiOperations/MaintenanceAiWorkOrderExperience.tsx')
          source = path.read_text()

          replacements = [
          ('''interface AskVortaNavigationContext {
            returnPath: string;
          }
          ''', '''interface AskVortaNavigationContext {
            returnPath: string;
            destinationPath: string | null;
          }
          '''),
          ('''function readAskVortaNavigationContext(): AskVortaNavigationContext | null {
            try {
              const stored = window.sessionStorage.getItem(
                ASK_VORTA_NAVIGATION_CONTEXT_KEY,
              );
              if (!stored) return null;

              const parsed = JSON.parse(stored) as Partial<AskVortaNavigationContext>;
              return typeof parsed.returnPath === "string" && parsed.returnPath.startsWith("/")
                ? { returnPath: parsed.returnPath }
                : null;
            } catch {
              return null;
            }
          }

          function markAskVortaNavigationOrigin(): AskVortaNavigationContext {
            const existing = readAskVortaNavigationContext();
            if (existing) return existing;

            const context = { returnPath: currentRoutePath() };
            try {
              window.sessionStorage.setItem(
                ASK_VORTA_NAVIGATION_CONTEXT_KEY,
                JSON.stringify(context),
              );
            } catch {
              // The in-memory React state still keeps the return control available.
            }
            return context;
          }
          ''', '''function readAskVortaNavigationContext(): AskVortaNavigationContext | null {
            try {
              const stored = window.sessionStorage.getItem(
                ASK_VORTA_NAVIGATION_CONTEXT_KEY,
              );
              if (!stored) return null;

              const parsed = JSON.parse(stored) as Partial<AskVortaNavigationContext>;
              const returnPath =
                typeof parsed.returnPath === "string" && parsed.returnPath.startsWith("/")
                  ? parsed.returnPath
                  : null;
              const destinationPath =
                typeof parsed.destinationPath === "string" &&
                parsed.destinationPath.startsWith("/")
                  ? parsed.destinationPath
                  : null;
              return returnPath ? { returnPath, destinationPath } : null;
            } catch {
              return null;
            }
          }

          function writeAskVortaNavigationContext(
            context: AskVortaNavigationContext,
          ): void {
            try {
              window.sessionStorage.setItem(
                ASK_VORTA_NAVIGATION_CONTEXT_KEY,
                JSON.stringify(context),
              );
            } catch {
              // The in-memory React state still keeps the return control available.
            }
          }

          function markAskVortaNavigationOrigin(): AskVortaNavigationContext {
            const context = {
              returnPath: currentRoutePath(),
              destinationPath: null,
            };
            writeAskVortaNavigationContext(context);
            return context;
          }
          '''),
          ('''  const showDesktopAssistantLauncher = !isPhone;
          ''', '''  const showDesktopAssistantLauncher = !isPhone;
            const activeRoutePath = `${location.pathname}${location.search}${location.hash}`;
            const showBackToAskVorta =
              askVortaNavigationContext?.destinationPath === activeRoutePath;
          '''),
          ('''  useEffect(() => {
            setAskVortaNavigationContext(readAskVortaNavigationContext());
          }, [location.pathname, location.search, location.hash]);
          ''', '''  useEffect(() => {
            const context = readAskVortaNavigationContext();
            if (!context) {
              setAskVortaNavigationContext(null);
              return;
            }

            const route = currentRoutePath();
            if (!context.destinationPath) {
              if (route === context.returnPath) {
                clearAskVortaNavigationContext();
                setAskVortaNavigationContext(null);
                return;
              }

              const scopedContext = { ...context, destinationPath: route };
              writeAskVortaNavigationContext(scopedContext);
              setAskVortaNavigationContext(scopedContext);
              return;
            }

            if (context.destinationPath !== route) {
              clearAskVortaNavigationContext();
              setAskVortaNavigationContext(null);
              return;
            }

            setAskVortaNavigationContext(context);
          }, [location.pathname, location.search, location.hash]);
          '''),
          ('''      {askVortaNavigationContext ? (
          ''', '''      {showBackToAskVorta ? (
          '''),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected source block not found:\n{old[:180]}')
              source = source.replace(old, new, 1)

          path.write_text(source)

          contract_path = Path('scripts/vor-067-ask-vorta-navigation-contracts.mjs')
          contract = contract_path.read_text()
          contract = contract.replace(
          '''  "markAskVortaNavigationOrigin()",
            "readAskVortaNavigationContext()",
            "clearAskVortaNavigationContext()",
          ''',
          '''  "markAskVortaNavigationOrigin()",
            "readAskVortaNavigationContext()",
            "writeAskVortaNavigationContext",
            "destinationPath",
            "showBackToAskVorta",
            "clearAskVortaNavigationContext()",
          ''', 1)
          contract = contract.replace(
          '''assert.match(
            source,
            /\\{askVortaNavigationContext \\? \\([\\s\\S]*?data-vorta-back-to-ask-vorta="true"[\\s\\S]*?Back to chat[\\s\\S]*?\\) : null\\}/,
            "The application shell must own one global Back to chat control for the whole Ask Vorta excursion",
          );
          ''',
          '''assert.match(
            source,
            /const showBackToAskVorta =[\\s\\S]*?destinationPath === activeRoutePath/,
            "Back to chat must render only on the exact destination opened from Ask Vorta",
          );
          assert.match(
            source,
            /if \\(context\\.destinationPath !== route\\) \\{[\\s\\S]*?clearAskVortaNavigationContext\\(\\);[\\s\\S]*?setAskVortaNavigationContext\\(null\\)/,
            "Ordinary navigation away from the Ask Vorta destination must clear the return control",
          );
          assert.match(
            source,
            /\\{showBackToAskVorta \\? \\([\\s\\S]*?data-vorta-back-to-ask-vorta="true"[\\s\\S]*?Back to chat[\\s\\S]*?\\) : null\\}/,
            "The application shell must own one destination-scoped Back to chat control",
          );
          ''', 1)
          contract = contract.replace(
          '''  "VOR-067 Ask Vorta navigation contracts passed: native application-shell capture covers every internal chat destination before navigation, Back to chat is destination-type agnostic, independent of query parameters and browser-history guessing, and restores the active conversation.",
          ''',
          '''  "VOR-067 Ask Vorta navigation contracts passed: native capture covers every internal chat destination, Back to chat is destination-type agnostic but scoped to the direct destination, ordinary navigation clears it, and returning restores the active conversation.",
          ''', 1)
          contract_path.write_text(contract)
          PY
      - name: Install dependencies
        run: npm ci --silent
      - name: Validate VOR-067 and typecheck
        run: |
          node scripts/vor-067-ask-vorta-navigation-contracts.mjs
          npm run typecheck
      - name: Commit validated fix
        run: |
          git config user.name "vorta-ci"
          git config user.email "vorta-ci@users.noreply.github.com"
          git add src/screens/AiOperations/MaintenanceAiWorkOrderExperience.tsx scripts/vor-067-ask-vorta-navigation-contracts.mjs
          git commit -m "VOR-067: scope Back to chat to direct destination"
          git push origin HEAD:fix/vor-067-destination-scope
