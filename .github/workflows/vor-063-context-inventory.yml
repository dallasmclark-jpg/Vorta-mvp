name: VOR-063 context inventory

on:
  push:
    branches:
      - agent/vor-063-verified-multi-site-context
    paths:
      - ".github/workflows/vor-063-context-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build site-context inventory
        shell: bash
        run: |
          mkdir -p vor-063-inventory
          rg -n --hidden --glob '!node_modules/**' --glob '!dist/**' 'siteContext|site_id|siteId|organisationId|organisation_id|user_site_access|vorta_get_function_context|vorta_has_site_access|service_role|SUPABASE_SERVICE_ROLE' src supabase netlify tests scripts > vor-063-inventory/site-context.txt || true
          rg -l --hidden --glob '!node_modules/**' --glob '!dist/**' 'useAuth|AuthProvider|PortalShell|invokeEvidenceFunction' src tests > vor-063-inventory/frontend-files.txt || true
          rg -l --hidden --glob '!node_modules/**' --glob '!dist/**' 'createClient|service_role|SUPABASE_SERVICE_ROLE|siteId|site_id|vorta_get_function_context' supabase/functions netlify/functions > vor-063-inventory/privileged-readers.txt || true
          find supabase/functions netlify/functions -maxdepth 3 -type f | sort > vor-063-inventory/function-files.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-063-context-inventory
          path: vor-063-inventory
          if-no-files-found: error
          retention-days: 3
