name: VOR-063 context inventory

on:
  push:
    branches:
      - agent/vor-063-verified-multi-site-context
    paths:
      - ".github/workflows/vor-063-context-inventory.yml"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/vor-063-verified-multi-site-context
      - name: Apply verified multi-site auth context
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/lib/auth.tsx")
          source = path.read_text()

          source = source.replace(
              "export interface ActiveSiteContext {\n  siteId: string;\n  organisationId: string;\n  role: PilotRole;\n  isDefault: boolean;\n}\n",
              "export interface ActiveSiteContext {\n  siteId: string;\n  organisationId: string;\n  role: PilotRole;\n  isDefault: boolean;\n}\n\nexport type SiteAccessGrant = ActiveSiteContext;\n",
          )
          source = source.replace(
              "  siteContext: ActiveSiteContext | null;\n  isDemoAdmin: boolean;",
              "  siteContext: ActiveSiteContext | null;\n  siteAccesses: readonly SiteAccessGrant[];\n  selectSite: (siteId: string) => boolean;\n  isDemoAdmin: boolean;",
          )
          source = source.replace(
              "  siteContext: null,\n  isDemoAdmin: false;",
              "  siteContext: null,\n  siteAccesses: [],\n  selectSite: () => false,\n  isDemoAdmin: false;",
          )
          source = source.replace(
              "const AUTH_INITIALISATION_TIMEOUT_MS =\n  15_000;\n",
              "const AUTH_INITIALISATION_TIMEOUT_MS =\n  15_000;\n\nconst SELECTED_SITE_STORAGE_PREFIX =\n  \"vorta:selected-site\";\n\nfunction selectedSiteStorageKey(userId: string): string {\n  return `${SELECTED_SITE_STORAGE_PREFIX}:${userId}`;\n}\n",
          )
          source = source.replace(
              "  const [siteContext, setSiteContext] =\n    useState<ActiveSiteContext | null>(null);\n",
              "  const [siteContext, setSiteContext] =\n    useState<ActiveSiteContext | null>(null);\n  const [siteAccesses, setSiteAccesses] =\n    useState<readonly SiteAccessGrant[]>([]);\n",
          )
          source = source.replace(
              "      setSiteContext(null);\n      setRoleResolutionFailed(false);",
              "      setSiteContext(null);\n      setSiteAccesses([]);\n      setRoleResolutionFailed(false);",
              1,
          )
          source = source.replace(
              "        setRole(metadataRole);\n        setSiteContext(null);\n",
              "        setRole(metadataRole);\n        setSiteContext(null);\n        setSiteAccesses([]);\n",
          )
          source = source.replace(
              "              .limit(1)\n              .maybeSingle(),",
              "              ,",
          )
          source = source.replace(
              "        const accessData = accessResult.data as unknown as {\n          site_id: string;\n          organisation_id: string;\n          app_role: unknown;\n          is_default: boolean;\n        } | null;",
              "        const accessRows = (accessResult.data ?? []) as unknown as Array<{\n          site_id: string;\n          organisation_id: string;\n          app_role: unknown;\n          is_default: boolean;\n        }>;",
          )
          source = source.replace(
              "        const accessRole = normalisePilotRole(\n          accessData?.app_role,\n        );\n\n        const profileRole = normalisePilotRole(",
              "        const grants = accessRows.flatMap((row): SiteAccessGrant[] => {\n          const grantRole = normalisePilotRole(row.app_role);\n\n          if (!grantRole) {\n            return [];\n          }\n\n          return [{\n            siteId: row.site_id,\n            organisationId: row.organisation_id,\n            role: grantRole,\n            isDefault: row.is_default,\n          }];\n        });\n\n        const storedSiteId = window.localStorage.getItem(\n          selectedSiteStorageKey(nextUserId),\n        );\n\n        const selectedGrant =\n          grants.find((grant) => grant.siteId === storedSiteId) ??\n          grants.find((grant) => grant.isDefault) ??\n          grants[0] ??\n          null;\n\n        const accessRole = selectedGrant?.role ?? null;\n\n        const profileRole = normalisePilotRole(",
          )
          source = source.replace(
              "        if (\n          accessData &&\n          effectiveRole\n        ) {\n          setSiteContext({\n            siteId: accessData.site_id,\n            organisationId:\n              accessData.organisation_id,\n            role: effectiveRole,\n            isDefault:\n              accessData.is_default,\n          });\n        } else {\n          setSiteContext(null);\n        }",
              "        setSiteAccesses(grants);\n\n        if (selectedGrant && effectiveRole) {\n          const nextSiteContext = {\n            ...selectedGrant,\n            role: effectiveRole,\n          };\n\n          setSiteContext(nextSiteContext);\n          window.localStorage.setItem(\n            selectedSiteStorageKey(nextUserId),\n            nextSiteContext.siteId,\n          );\n        } else {\n          setSiteContext(null);\n        }",
          )
          source = source.replace(
              "        setRole(null);\n        setSiteContext(null);\n\n        setRoleResolutionFailed(",
              "        setRole(null);\n        setSiteContext(null);\n        setSiteAccesses([]);\n\n        setRoleResolutionFailed(",
              1,
          )
          source = source.replace(
              "          setRole(null);\n          setSiteContext(null);\n\n          setRoleResolutionFailed(",
              "          setRole(null);\n          setSiteContext(null);\n          setSiteAccesses([]);\n\n          setRoleResolutionFailed(",
          )
          marker = "  const isDemoAdmin =\n    resolveDemoAdmin(session) ||\n    role === \"vorta_admin\";\n"
          source = source.replace(
              marker,
              "  const selectSite = (siteId: string): boolean => {\n    if (!session) {\n      return false;\n    }\n\n    const matchingGrant = siteAccesses.find(\n      (grant) => grant.siteId === siteId,\n    );\n\n    if (!matchingGrant) {\n      return false;\n    }\n\n    setSiteContext(matchingGrant);\n    setRole(matchingGrant.role);\n    window.localStorage.setItem(\n      selectedSiteStorageKey(session.user.id),\n      matchingGrant.siteId,\n    );\n\n    return true;\n  };\n\n" + marker,
          )
          source = source.replace(
              "        siteContext,\n        isDemoAdmin,",
              "        siteContext,\n        siteAccesses,\n        selectSite,\n        isDemoAdmin,",
          )
          source = source.replace("              )\n              ,", "              ),")

          required = [
              "siteAccesses: readonly SiteAccessGrant[]",
              "const accessRows = (accessResult.data ?? [])",
              "grants.find((grant) => grant.siteId === storedSiteId)",
              "const selectSite = (siteId: string): boolean",
          ]
          for contract in required:
              if contract not in source:
                  raise SystemExit(f"VOR-063 patch contract missing: {contract}")

          path.write_text(source)
      - name: Validate auth contracts
        run: |
          test "$(grep -c '\.limit(1)' src/lib/auth.tsx)" -eq 0
          grep -q 'siteAccesses.find' src/lib/auth.tsx
          grep -q 'selectedSiteStorageKey' src/lib/auth.tsx
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/auth.tsx
          git diff --cached --quiet || git commit -m "VOR-063: hydrate and select authorised sites"
          git push origin HEAD:agent/vor-063-verified-multi-site-context
      - name: Build site-context inventory
        shell: bash
        run: |
          mkdir -p vor-063-inventory
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude='*.map' \
            'siteContext|site_id|siteId|organisationId|organisation_id|user_site_access|vorta_get_function_context|vorta_has_site_access|service_role|SUPABASE_SERVICE_ROLE' \
            src supabase netlify tests scripts > vor-063-inventory/site-context.txt
          grep -RIlE --exclude-dir=node_modules --exclude-dir=dist \
            'useAuth|AuthProvider|PortalShell|invokeEvidenceFunction' src tests \
            | sort > vor-063-inventory/frontend-files.txt
          grep -RIlE --exclude-dir=node_modules --exclude-dir=dist \
            'createClient|service_role|SUPABASE_SERVICE_ROLE|siteId|site_id|vorta_get_function_context' \
            supabase/functions netlify/functions \
            | sort > vor-063-inventory/privileged-readers.txt
          find supabase/functions netlify/functions -maxdepth 3 -type f | sort > vor-063-inventory/function-files.txt
          test -s vor-063-inventory/site-context.txt
          test -s vor-063-inventory/frontend-files.txt
          test -s vor-063-inventory/privileged-readers.txt
      - name: Pack reviewed source snapshot
        run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/vor-063-source.tgz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-063-context-inventory
          path: vor-063-inventory
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-063-source
          path: /tmp/vor-063-source.tgz
          if-no-files-found: error
          retention-days: 1