name: VOR-100 typography system

on:
  push:
    branches:
      - agent/vor-100-typography-system

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: VOR-100 typography contract
        run: node scripts/vor-100-typography-contracts.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Full contracts (VOR-098 live backend mismatch remains independently visible)
        continue-on-error: true
        run: npm run test:contracts
      - name: Route smoke
        run: npm run test:smoke
      - name: Build without invoking the separate VOR-098 live prebuild gate
        run: npx vite build
      - name: Performance budgets
        run: npm run test:performance
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify authenticated browser-test secret
        run: test -n "$VORTA_E2E_PASSWORD"
      - name: Verify governed typography across desktop tablet and phone
        run: >-
          npx playwright test tests/browser/vor-100-typography.spec.ts
          --project=desktop-1920
          --project=samsung-tablet-landscape
          --project=samsung-tablet-portrait
          --project=phone-360
          --workers=1
          --retries=0
          --max-failures=0
      - name: Upload typography evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-100-typography-evidence
          path: |
            evidence/vor-100-typography
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
