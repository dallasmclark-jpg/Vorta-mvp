name: One-time risk projection patch target

on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 128
    runs-on: ubuntu-latest
    steps:
      - name: Check out focused branch
        uses: actions/checkout@v4
        with:
          ref: fix/risk-plan-projection-integrity
          fetch-depth: 0

      - name: Apply and push source fix
        run: |
          python scripts/apply-risk-projection-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix risk plan projection integrity and presentation"
          git push origin HEAD:fix/risk-plan-projection-integrity

      - name: Remove one-time main workflows
        if: always()
        run: |
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/one-time-risk-projection-target.yml .github/workflows/one-time-apply-risk-projection-fix.yml .github/risk-projection-main-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time risk projection patch runners"
          git push origin main
