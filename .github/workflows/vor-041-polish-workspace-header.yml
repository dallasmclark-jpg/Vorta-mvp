name: VOR-041 polish workspace header

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: vor-041-polish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  polish:
    if: github.event.pull_request.head.ref == 'agent/vor-041-ask-vorta-workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-041-ask-vorta-workspace
          fetch-depth: 0

      - name: Stop when portrait header is already polished
        id: state
        shell: bash
        run: |
          if grep -q 'hidden min-w-0 items-center gap-2 text-xs text-slate-500 xl:flex' src/screens/AiOperations/AskVortaWorkspace.tsx; then
            echo "polished=true" >> "$GITHUB_OUTPUT"
          else
            echo "polished=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.state.outputs.polished == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.polished == 'false'
        run: npm ci --silent

      - name: Apply portrait header polish
        if: steps.state.outputs.polished == 'false'
        run: python scripts/vor-041-polish-workspace-header.py

      - name: Prove mobile presentation was not edited
        if: steps.state.outputs.polished == 'false'
        run: git diff --exit-code origin/main -- src/screens/AiOperations/mobilePortalHardening.css

      - name: Verify workspace contracts and production build
        if: steps.state.outputs.polished == 'false'
        run: |
          npm run typecheck -- --pretty false
          node scripts/vor-037-unified-ask-vorta-contracts.mjs
          node scripts/vor-041-ask-vorta-workspace-contracts.mjs
          node scripts/tablet-presentation-contracts.mjs
          npm run build

      - name: Remove disposable polish scaffolding
        if: steps.state.outputs.polished == 'false'
        run: |
          rm scripts/vor-041-polish-workspace-header.py
          rm .github/workflows/vor-041-polish-workspace-header.yml

      - name: Commit verified portrait workspace polish
        if: steps.state.outputs.polished == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/AiOperations/AskVortaWorkspace.tsx \
                  scripts/vor-041-ask-vorta-workspace-contracts.mjs \
                  tests/browser/vor-041-ask-vorta-workspace.spec.ts \
                  scripts/vor-041-polish-workspace-header.py \
                  .github/workflows/vor-041-polish-workspace-header.yml
          git commit -m "VOR-041: keep portrait workspace controls visible"
          git push origin HEAD:agent/vor-041-ask-vorta-workspace
