name: VOR-040 apply deterministic operational answers

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/vor-040-natural-question-audit-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect completed operational repair
        id: state
        shell: bash
        run: |
          if grep -q 'deterministicOperationalAnswer' netlify/functions/ask-vorta.mts && grep -q 'site_missing_evidence' netlify/functions/ask-vorta.mts; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.skip != 'true'
        run: npm ci

      - name: Apply deterministic operational-answer repair
        if: steps.state.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/vor-040-deterministic-operational-answers-patch.py')
          source = path.read_text()
          old = '''def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"VOR-040 anchor {label} count {count}")
              return source.replace(old, new, 1)
          '''
          new = '''def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if label == "deterministic follow-up limit" and count == 2:
                  start = source.index("function enforceDeterministicResponseShape(")
                  end = source.index("function enforcePlannedResponseShape(", start)
                  scoped = source[start:end]
                  if scoped.count(old) != 1:
                      raise SystemExit(
                          f"VOR-040 scoped anchor {label} count {scoped.count(old)}"
                      )
                  return source[:start] + scoped.replace(old, new, 1) + source[end:]
              if count != 1:
                  raise SystemExit(f"VOR-040 anchor {label} count {count}")
              return source.replace(old, new, 1)
          '''
          if old not in source:
              raise SystemExit('VOR-040 replace_once helper anchor missing')
          path.write_text(source.replace(old, new, 1))
          PY
          python3 scripts/vor-040-deterministic-operational-answers-patch.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/vor-040-natural-question-contracts.mjs')
          source = path.read_text()
          anchor = '  "maintenancePlanOnly",\n'
          features = '''  "maintenancePlanOnly",
          "deterministicOperationalAnswer",
          "maintenance_plan_cover_feasibility",
          "site_evidence_freshness",
          "site_missing_evidence",
          "morning_maintenance_briefing",
          "verified_risk_reduction_ranking",
          "completeDeterministicAnswer",
          "verifiedFallback",
          "followUpLimit",
          '''
          if source.count(anchor) != 1:
              raise SystemExit(
                  f'VOR-040 operational contract anchor count {source.count(anchor)}'
              )
          path.write_text(source.replace(anchor, features, 1))
          PY

      - name: Verify backend TypeScript
        if: steps.state.outputs.skip != 'true'
        run: npm run typecheck:functions

      - name: Verify Ask Vorta contracts
        if: steps.state.outputs.skip != 'true'
        run: |
          node scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs
          node scripts/vor-040-natural-question-contracts.mjs
          node scripts/ask-vorta-agent-contracts.mjs

      - name: Remove disposable repair scaffolding
        if: steps.state.outputs.skip != 'true'
        run: |
          rm scripts/vor-040-deterministic-operational-answers-patch.py
          rm .github/workflows/vor-040-apply-operational-answers.yml

      - name: Commit verified operational repair
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/ask-vorta.mts scripts/vor-040-natural-question-contracts.mjs
          git add -u scripts/vor-040-deterministic-operational-answers-patch.py .github/workflows/vor-040-apply-operational-answers.yml
          git commit -m 'VOR-040: return verified operational answers without model failure'
          git push origin HEAD:${{ github.head_ref }}
