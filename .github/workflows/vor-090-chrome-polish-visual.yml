name: VOR-090 Chrome visual audit

on:
  pull_request:
    paths:
      - "src/components/MaintenancePortalHardening.tsx"
      - "src/screens/AiOperations/MobileAiPolishStyles.tsx"
      - "src/screens/Equipment/EquipmentTabNavigation.tsx"
      - "tests/browser/vor-090-chrome-polish-visual.spec.ts"
      - ".github/workflows/vor-090-chrome-polish-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vor-090-chrome-visual-${{ github.sha }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture VOR-090 Chrome screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000001

    steps:
      - name: Check out audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Verify authenticated browser-test secret
        shell: bash
        run: test -n "$VORTA_E2E_PASSWORD"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture visual audit
        run: |
          npx playwright test tests/browser/vor-090-chrome-polish-visual.spec.ts \
            --project=desktop-1920 \
            --project=samsung-tablet-landscape \
            --project=phone-360 \
            --config=playwright.config.ts

      - name: Upload VOR-090 visual audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vor-090-chrome-visual-${{ github.sha }}
          path: visual-audit/vor-090
          if-no-files-found: warn
          retention-days: 7
