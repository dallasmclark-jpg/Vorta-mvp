name: One-time apply VOR-004 dashboard deep links

on:
  push:
    branches:
      - fix/vor-004-dashboard-deep-links

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out focused branch
        uses: actions/checkout@v4
