                  : "spares";
            const view = target === "pm" ? "pm-backlog" : target === "spares" ? "out-of-stock" : "backlog";
            const params = new URLSearchParams({ from: "dashboard", view });

            return `/equipment/${encodedEquipmentId}/${destination}?${params.toString()}`;
          }
