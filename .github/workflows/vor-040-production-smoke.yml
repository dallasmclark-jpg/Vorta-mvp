name: VOR-040 authenticated production smoke

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  smoke:
    if: github.head_ref == 'agent/vor-040-natural-question-audit-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
      VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_EVAL_LIMIT: 4
      VORTA_EVAL_DELAY_MS: 500
      EXPECTED_PRODUCTION_COMMIT: f767a8e058dc804f18fbaf4e4fd18dd8c0c97de2
    steps:
      - name: Check out smoke branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Build representative production fixture
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manager = JSON.parse(fs.readFileSync('tests/evals/vor-033-demo-golden.json', 'utf8'));
          const natural = JSON.parse(fs.readFileSync('tests/evals/vor-040-natural-questions.json', 'utf8'));
          const ids = [
            'vor040-site-priority-colloquial',
            'vor040-vf02-follow-up-spare',
            'vor040-rabs-follow-up-pronoun',
            'vor033-ahu01-skills',
          ];
          const combined = [...manager, ...natural];
          const selected = ids.map((id) => combined.find((item) => item.id === id));
          if (selected.some((item) => !item)) throw new Error('A production smoke fixture is missing.');
          fs.writeFileSync('vor-040-production-smoke.tmp.json', JSON.stringify(selected, null, 2));
          NODE

      - name: Verify exact production commit
        shell: bash
        run: |
          for attempt in $(seq 1 48); do
            payload="$(curl --silent --show-error --fail --max-time 15 'https://vorta-app.netlify.app/vorta-build.json' || true)"
            deployed_head="$(printf '%s' "$payload" | node -e 'let value="";process.stdin.on("data",c=>value+=c).on("end",()=>{try{process.stdout.write(JSON.parse(value).commit||"")}catch{}})')"
            if [ "$deployed_head" = "$EXPECTED_PRODUCTION_COMMIT" ]; then
              echo "Exact production commit is live: $deployed_head"
              exit 0
            fi
            echo "Production is ${deployed_head:-unavailable}; waiting for $EXPECTED_PRODUCTION_COMMIT (attempt $attempt/48)."
            sleep 5
          done
          echo "Production did not publish the expected merge commit." >&2
          exit 1

      - name: Reset shared-account request window
        run: sleep 315

      - name: Run authenticated production smoke
        run: |
          set -o pipefail
          node scripts/ask-vorta-live-evals.mjs vor-040-production-smoke.tmp.json 2>&1 | tee vor-040-production-smoke.log

      - name: Preserve production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vor-040-production-smoke-${{ github.event.pull_request.head.sha }}
          path: vor-040-production-smoke.log
          if-no-files-found: error
          retention-days: 30

      - name: Remove completed smoke workflow
        run: rm .github/workflows/vor-040-production-smoke.yml

      - name: Commit clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vorta CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/vor-040-production-smoke.yml
          git diff --cached --check
          git commit -m "VOR-040: complete production smoke verification"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
