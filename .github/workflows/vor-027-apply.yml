name: Apply VOR-027 source changes

on:
  push:
    branches:
      - vor-027-simplify-shift-handover-scope

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vor-027-simplify-shift-handover-scope
          fetch-depth: 0

      - name: Apply focused source and test updates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          page_path = Path("src/screens/ShiftHandover/ShiftHandoverSection.tsx")
          page = page_path.read_text()

          page = replace_once(page, "  HardHat,\n", "", "remove Contractor icon import")
          page = replace_once(page, 'type ScopeMode = "site" | "building" | "area";\n', "", "remove scope mode type")
          page = re.sub(
              r'\nfunction formatSummaryDowntime\(minutes: number\): string \{\n  if \(minutes <= 0\) return "0 hrs";\n  const hours = minutes / 60;\n  return `\$\{Number\(hours\.toFixed\(1\)\)\} hrs`;\n\}\n',
              "\n",
              page,
              count=1,
          )

          page = replace_once(
              page,
              "      aria-pressed={active}\n      className={`min-h-11 shrink-0 whitespace-nowrap rounded-lg border px-4 text-sm font-semibold transition-colors ${\n        active\n          ? \"border-blue-500/50 bg-blue-500/15 text-blue-200\"",
              "      role=\"tab\"\n      aria-selected={active}\n      aria-pressed={active}\n      className={`min-h-11 shrink-0 whitespace-nowrap rounded-lg border px-4 text-sm font-semibold transition-colors ${\n        active\n          ? \"border-blue-500/60 bg-[#10151d] text-blue-200\"",
              "use semantic outlined tabs",
          )

          page = replace_once(
              page,
              '  const [scopeMode, setScopeMode] = useState<ScopeMode>("site");\n  const [scopeValue, setScopeValue] = useState("all");\n  const [discipline, setDiscipline] = useState<"all" | ShiftHandoverDiscipline>("all");\n',
              '  const [scopeValue, setScopeValue] = useState("all");\n',
              "remove scope hierarchy and discipline state",
          )
          page = replace_once(
              page,
              '  useEffect(() => {\n    setScopeValue("all");\n  }, [scopeMode]);\n\n',
              "",
              "remove scope mode reset",
          )
          page = replace_once(
              page,
              '        if (scopeMode === "building" && scopeValue !== "all" && item.building !== scopeValue) return false;\n        if (scopeMode === "area" && scopeValue !== "all" && item.area !== scopeValue) return false;\n        if (discipline !== "all" && item.discipline !== discipline) return false;\n',
              '        if (scopeValue !== "all" && item.area !== scopeValue) return false;\n',
              "filter directly by selected area",
          )
          page = replace_once(
              page,
              '  }, [criticality, discipline, query, reviewHours, scopeMode, scopeValue, snapshot?.items, sortMode, status]);',
              '  }, [criticality, query, reviewHours, scopeValue, snapshot?.items, sortMode, status]);',
              "update filtered item dependencies",
          )
          page = replace_once(
              page,
              '  const scopeOptions = scopeMode === "building"\n    ? snapshot?.scopeOptions.buildings ?? []\n    : scopeMode === "area"\n      ? snapshot?.scopeOptions.areas ?? []\n      : [];\n',
              '''  const scopeAreas = useMemo(() => {
    const areas = new Set<string>();
    for (const item of snapshot?.items ?? []) {
      const area = item.area.trim();
      if (area) areas.add(area);
    }
    return [...areas].sort((left, right) => left.localeCompare(
      right,
      "en-GB",
      { sensitivity: "base", numeric: true },
    ));
  }, [snapshot?.items]);
''',
              "derive relevant handover areas",
          )
          page = replace_once(
              page,
              '  const activeAdvancedFilterCount = Number(criticality !== "all")\n    + Number(status !== "all");\n\n  useEffect(() => {\n',
              '''  const activeAdvancedFilterCount = Number(criticality !== "all")
    + Number(status !== "all");

  useEffect(() => {
    if (scopeValue !== "all" && !scopeAreas.includes(scopeValue)) {
      setScopeValue("all");
    }
  }, [scopeAreas, scopeValue]);

  useEffect(() => {
''',
              "reset an unavailable area safely",
          )
          page = replace_once(
              page,
              '  }, [scopeMode, scopeOptions.length, scopeValue, updateScopeOptionsOverflow]);',
              '  }, [scopeAreas.length, scopeValue, updateScopeOptionsOverflow]);',
              "update scope rail overflow dependencies",
          )

          summary_pattern = re.compile(
              r'          <div className="grid grid-cols-2 gap-2\.5 sm:gap-3 lg:grid-cols-4 xl:grid-cols-6">.*?\n</div>\n\n          <section data-vorta-group-frame="true"',
              re.S,
          )
          summary_replacement = '''          <div className="grid grid-cols-2 gap-2.5 sm:gap-3 lg:grid-cols-4">
            <MetricCard label="Handover items" value={String(filteredSummary.total)} detail="In selected review period" icon={Wrench} />
            <MetricCard label="Ongoing" value={String(filteredSummary.ongoing)} detail="Needs incoming action" icon={Timer} tone="text-blue-300" />
            <MetricCard label="Completed" value={String(filteredSummary.completed)} detail="Returned or closed" icon={CheckCircle2} tone="text-emerald-300" />
            <MetricCard label="Waiting parts" value={String(filteredSummary.waitingOnParts)} detail="Open material need" icon={Boxes} tone="text-amber-300" />
          </div>

          <section data-vorta-group-frame="true"'''
          page, count = summary_pattern.subn(summary_replacement, page, count=1)
          if count != 1:
              raise SystemExit(f"replace summary cards: expected one match, found {count}")

          scope_start = page.index('          <section data-vorta-group-frame="true" className="rounded-2xl border border-gray-800 bg-[#10151d] p-4 sm:p-5">')
          search_marker = '  <div className="mt-4 grid gap-3 border-t border-gray-800 pt-4 lg:grid-cols-[minmax(220px,1fr)_repeat(3,minmax(150px,0.45fr))]">'
          search_start = page.index(search_marker, scope_start)
          scope_prefix = '''          <section data-vorta-group-frame="true" className="rounded-2xl border border-gray-800 bg-[#10151d] p-4 sm:p-5">
  <div>
    <h2 className="text-sm font-semibold text-slate-100">Handover scope</h2>
    <p className="mt-1 text-xs text-slate-500">Site and areas with activity in the selected review period.</p>
  </div>

  <div className="relative mt-4">
    <div
      ref={scopeOptionsRef}
      onScroll={updateScopeOptionsOverflow}
      role="tablist"
      aria-label="Handover scope"
      className="flex gap-2 overflow-x-auto pb-1 pr-10"
      data-vorta-shift-handover-scope-tabs="true"
    >
      <SelectorTab active={scopeValue === "all"} onClick={() => setScopeValue("all")}>Site</SelectorTab>
      {scopeAreas.map((area) => (
        <SelectorTab key={area} active={scopeValue === area} onClick={() => setScopeValue(area)}>
          {area}
        </SelectorTab>
      ))}
    </div>
    {scopeOptionsCanScrollRight ? (
      <span
        aria-hidden="true"
        className="pointer-events-none absolute inset-y-0 right-0 w-10 bg-gradient-to-l from-[#10151d] to-transparent"
        data-vorta-shift-handover-scope-fade="true"
      />
    ) : null}
  </div>

  <div
    data-vorta-shift-handover-review-period="true"
    className="mt-4 border-t border-gray-800 pt-4"
  >
    <label className="grid w-full gap-1 text-xs font-medium text-slate-500 sm:max-w-xs">
      Review period
      <select
        value={reviewHours}
        onChange={(event) => changeReviewPeriod(event.target.value)}
        disabled={loading}
        className="min-h-11 w-full rounded-xl border border-gray-700 bg-[#0d1117] px-3 text-sm font-semibold text-slate-200 outline-none focus:border-blue-500/60 disabled:opacity-60"
      >
        {REVIEW_PERIOD_OPTIONS.map((option) => (
          <option key={option.value} value={option.value}>
            {option.label}
          </option>
        ))}
      </select>
    </label>
    {loading ? (
      <span role="status" className="mt-2 inline-flex items-center gap-2 text-xs text-blue-300">
        <RefreshCw className="h-3.5 w-3.5 animate-spin" aria-hidden="true" />
        {reviewPeriodLoadingState(reviewHours)}
      </span>
    ) : null}
  </div>

'''
          page = page[:scope_start] + scope_prefix + page[search_start:]
          page = replace_once(
              page,
              '        : "Return to the site scope or remove a discipline, status or criticality filter."}',
              '        : "Return to Site or clear the search, status or criticality filters."}',
              "update empty state guidance",
          )

          forbidden = ["scopeMode", "setScopeMode", "setDiscipline", 'aria-label="Maintenance discipline"', '<MetricCard label="Contractor"', 'label="Breakdown"']
          for token in forbidden:
              if token in page:
                  raise SystemExit(f"Unexpected retired Shift Handover token remains: {token}")
          required = ["data-vorta-shift-handover-scope-tabs", "scopeAreas.map", 'role="tablist"', '<MetricCard label="Waiting parts"']
          for token in required:
              if token not in page:
                  raise SystemExit(f"Required VOR-027 token missing: {token}")
          page_path.write_text(page)

          contract_path = Path("scripts/shift-handover-contracts.mjs")
          contract = contract_path.read_text()
          contract = replace_once(
              contract,
              '  [page.includes("Site") && page.includes("Building") && page.includes("Area"), "Site, building and area scope controls are required."],\n  [page.includes("Mechanical") && page.includes("Electrical") && page.includes("Controls") && page.includes("Facilities"), "Discipline selectors are required."],\n',
              '''  [page.includes('data-vorta-shift-handover-scope-tabs="true"') && page.includes("scopeAreas.map") && page.includes("snapshot?.items"), "Scope must be one Site-plus-relevant-areas rail derived from the selected review-period jobs."],
  [!page.includes("type ScopeMode") && !page.includes("setScopeMode") && !page.includes('aria-label="Maintenance discipline"') && !page.includes("setDiscipline"), "Building hierarchy and Discipline list filtering must be removed."],
''',
              "update scope and discipline contracts",
          )
          contract = replace_once(
              contract,
              '  [page.includes("scopeOptionsRef") && page.includes("scopeOptionsCanScrollRight") && page.includes(\'data-vorta-shift-handover-scope-fade="true"\'), "Long scope names need selected-item scrolling and an overflow cue."],\n  [page.includes("formatSummaryDowntime") && page.includes(\'return "0 hrs"\') && page.includes(\'totalBreakdownMinutes > 0 ? "text-orange-300" : "text-slate-50"\'), "Zero downtime must render neutrally as 0 hrs while positive downtime retains warning emphasis."],\n',
              '''  [page.includes("scopeOptionsRef") && page.includes("scopeOptionsCanScrollRight") && page.includes('data-vorta-shift-handover-scope-fade="true"'), "The shared area rail needs selected-item scrolling and an overflow cue."],
  [(page.match(/<MetricCard/g) ?? []).length === 4 && !page.includes('<MetricCard label="Contractor"') && !page.includes('label="Breakdown"'), "Only the four approved operational summary cards may render."],
''',
              "update rail and summary contracts",
          )
          contract = replace_once(
              contract,
              '  [browser.includes("Filters · 2") && browser.includes(\'data-vorta-shift-handover-scope-options="true"\') && browser.includes(\'breakdownText === "0 hrs"\'), "Responsive browser coverage must verify mobile filter count, scope overflow and neutral zero downtime."],\n',
              '''  [browser.includes("Filters · 2") && browser.includes('data-vorta-shift-handover-scope-tabs="true"') && browser.includes('data-vorta-shift-handover-metric="contractor"'), "Responsive browser coverage must verify mobile filter count, the area rail and retired summary cards."],
''',
              "update browser contract assertion",
          )
          contract = replace_once(
              contract,
              'console.log("✓ Shift Handover review periods, compact mobile filters, neutral downtime and responsive state verified.");',
              'console.log("✓ Shift Handover review periods, four-card summary, relevant-area rail and responsive state verified.");',
              "update contract message",
          )
          contract_path.write_text(contract)

          browser_path = Path("tests/browser/maintenance-manager-shift-handover.spec.ts")
          browser = browser_path.read_text()
          browser = replace_once(
              browser,
              '''  await expect(page.getByRole("button", { name: "Site", exact: true })).toBeVisible();
  await expect(page.getByRole("button", { name: "Building", exact: true })).toBeVisible();
  await expect(page.getByRole("button", { name: "Area", exact: true })).toBeVisible();
  await expect(page.getByRole("button", { name: "Mechanical", exact: true })).toBeVisible();
  await expect(page.getByRole("button", { name: "Electrical", exact: true })).toBeVisible();
  await expect(page.getByRole("button", { name: "Controls", exact: true })).toBeVisible();
  await expect(page.getByRole("button", { name: "Facilities", exact: true })).toBeVisible();
  await expect(searchInput).toBeVisible();
''',
              '''  const scopeTabs = page.locator('[data-vorta-shift-handover-scope-tabs="true"]');
  await expect(scopeTabs).toBeVisible();
  await expect(scopeTabs.getByRole("tab", { name: "Site", exact: true })).toBeVisible();
  await expect(page.getByRole("button", { name: "Building", exact: true })).toHaveCount(0);
  await expect(page.getByRole("button", { name: "Area", exact: true })).toHaveCount(0);
  await expect(page.getByRole("button", { name: "Mechanical", exact: true })).toHaveCount(0);
  await expect(page.getByRole("button", { name: "Electrical", exact: true })).toHaveCount(0);
  await expect(page.getByRole("button", { name: "Controls", exact: true })).toHaveCount(0);
  await expect(page.getByRole("button", { name: "Facilities", exact: true })).toHaveCount(0);
  await expect(page.locator('[data-vorta-shift-handover-metric="contractor"]')).toHaveCount(0);
  await expect(page.locator('[data-vorta-shift-handover-metric="breakdown"]')).toHaveCount(0);
  await expect(searchInput).toBeVisible();
''',
              "update responsive control assertions",
          )
          browser = replace_once(
              browser,
              '''    const reviewBox = await reviewPeriod.boundingBox();
    const disciplineBox = await page.getByText("Discipline", { exact: true }).boundingBox();
    const searchBox = await searchInput.boundingBox();
    const filtersBox = await filtersButton.boundingBox();
    expect(reviewBox?.y ?? 0).toBeLessThan(disciplineBox?.y ?? Number.MAX_SAFE_INTEGER);
    expect(disciplineBox?.y ?? 0).toBeLessThan(searchBox?.y ?? Number.MAX_SAFE_INTEGER);
    expect(searchBox?.y ?? 0).toBeLessThan(filtersBox?.y ?? Number.MAX_SAFE_INTEGER);
''',
              '''    const reviewBox = await reviewPeriod.boundingBox();
    const searchBox = await searchInput.boundingBox();
    const filtersBox = await filtersButton.boundingBox();
    expect(reviewBox?.y ?? 0).toBeLessThan(searchBox?.y ?? Number.MAX_SAFE_INTEGER);
    expect(searchBox?.y ?? 0).toBeLessThan(filtersBox?.y ?? Number.MAX_SAFE_INTEGER);
''',
              "remove Discipline ordering check",
          )

          scope_test_start = browser.index('  if (viewportWidth < 1024) {\n    await scrollContainer.evaluate((element) => { element.scrollTop = 280; });')
          scope_test_end = browser.index('\n\n  await scrollContainer.evaluate((element) => { element.scrollTop = 320; });', scope_test_start)
          new_scope_test = '''  if (viewportWidth < 1024) {
    await scrollContainer.evaluate((element) => { element.scrollTop = 280; });
    const scopeScrollBefore = await scrollContainer.evaluate((element) => element.scrollTop);
    const optionTabs = scopeTabs.getByRole("tab");
    const optionCount = await optionTabs.count();
    expect(optionCount).toBeGreaterThan(0);
    if (optionCount > 1) {
      const selectedOption = optionTabs.last();
      const selectedArea = (await selectedOption.textContent())?.trim() ?? "";
      expect(selectedArea).not.toBe("");
      await selectedOption.click();
      await expect(selectedOption).toHaveAttribute("aria-selected", "true");
      await expect.poll(async () => {
        const containerBox = await scopeTabs.boundingBox();
        const selectedBox = await selectedOption.boundingBox();
        if (!containerBox || !selectedBox) return false;
        return selectedBox.x >= containerBox.x - 1
          && selectedBox.x + selectedBox.width <= containerBox.x + containerBox.width + 1;
      }).toBe(true);
      for (const cardText of await cards.allTextContents()) {
        expect(cardText).toContain(selectedArea);
      }
    }
    await scopeTabs.getByRole("tab", { name: "Site", exact: true }).click();
    const scopeScrollAfter = await scrollContainer.evaluate((element) => element.scrollTop);
    expect(scopeScrollAfter).toBeGreaterThanOrEqual(Math.max(0, scopeScrollBefore - 80));
  }'''
          browser = browser[:scope_test_start] + new_scope_test + browser[scope_test_end:]

          breakdown_start = browser.index('  const breakdownMetric = page.locator(\'[data-vorta-shift-handover-metric="breakdown"]\');')
          breakdown_end = browser.index('\n\n  if (viewportWidth < 1024) {', breakdown_start)
          browser = browser[:breakdown_start] + browser[breakdown_end + 2:]
          browser_path.write_text(browser)

          Path(".github/workflows/vor-027-apply.yml").unlink()
          PY

          git diff --check
          git status --short

      - name: Commit focused implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "VOR-027: simplify Shift Handover scope and summary"
          git push origin HEAD:vor-027-simplify-shift-handover-scope
