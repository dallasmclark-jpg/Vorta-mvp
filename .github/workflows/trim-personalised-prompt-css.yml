name: Trim personalised prompt CSS

on:
  push:
    branches:
      - agent/ask-vorta-personalised-suggestions-v2

permissions:
  contents: write

jobs:
  trim:
    if: ${{ !contains(github.event.head_commit.message, '[prompt-css-trimmed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ask-vorta-personalised-suggestions-v2
          fetch-depth: 0
      - name: Remove redundant responsive utilities
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx')
          text = path.read_text()
          old = ' max-md:w-full max-md:rounded-xl max-md:px-4 max-md:py-3 max-md:text-left max-md:whitespace-normal'
          if old not in text:
              raise SystemExit('personalised prompt utility block not found')
          path.write_text(text.replace(old, '', 1))
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/trim-personalised-prompt-css.yml
          git config user.name "Vorta implementation bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx .github/workflows/trim-personalised-prompt-css.yml
          git commit -m "VOR-041: trim personalised prompt CSS [prompt-css-trimmed]"
          git push origin HEAD:agent/ask-vorta-personalised-suggestions-v2
