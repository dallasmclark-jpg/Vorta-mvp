name: Maintenance Manager production verification

on:
  workflow_call:
    inputs:
      expected_commit:
        required: true
        type: string
    secrets:
      VORTA_E2E_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact deployed commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maintenance-manager-production-${{ inputs.expected_commit }}
  cancel-in-progress: false

jobs:
  production:
    name: Verify exact production commit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      VORTA_PRODUCTION_URL: https://vorta-app.netlify.app
      VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          show-progress: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Verify Netlify serves the exact tested commit
        run: node scripts/verify-production-commit.mjs

      - name: Verify authenticated browser-test secret
        shell: bash
        run: |
          test -n "$VORTA_E2E_PASSWORD" || {
            echo "VORTA_E2E_PASSWORD is not configured for production verification." >&2
            exit 1
          }

      - name: Run VOR-056 backlog production decision
        id: production_backlog
        continue-on-error: true
        shell: bash
        env:
          VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
          VORTA_EVAL_SITE_ID: ${{ env.VORTA_E2E_SITE_ID }}
          VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000
          VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 3
        run: |
          set -o pipefail
          node scripts/ask-vorta-live-evals.mjs tests/evals/vor-056-backlog-action-plan.json 2>&1 | tee ask-vorta-production-backlog.log

      - name: Reset after backlog production decision
        if: always()
        run: sleep 310

      - name: Run first 12 Ask Vorta production decisions
        id: production_window_one
        if: always()
        continue-on-error: true
        shell: bash
        env:
          VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
          VORTA_EVAL_SITE_ID: ${{ env.VORTA_E2E_SITE_ID }}
          VORTA_EVAL_OFFSET: 0
          VORTA_EVAL_LIMIT: 12
          VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000
          VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 3
        run: |
          set -o pipefail
          npm run eval:ask-vorta:live 2>&1 | tee ask-vorta-production-window-1.log

      - name: Reset production evaluation rate window
        if: always()
        run: sleep 310

      - name: Run final Ask Vorta production decision
        id: production_window_two
        if: always()
        continue-on-error: true
        shell: bash
        env:
          VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
          VORTA_EVAL_SITE_ID: ${{ env.VORTA_E2E_SITE_ID }}
          VORTA_EVAL_OFFSET: 12
          VORTA_EVAL_LIMIT: 1
          VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000
          VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 3
        run: |
          set -o pipefail
          npm run eval:ask-vorta:live 2>&1 | tee ask-vorta-production-window-2.log

      - name: Preserve Ask Vorta production evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ask-vorta-production-evidence-${{ inputs.expected_commit }}
          path: |
            ask-vorta-production-backlog.log
            ask-vorta-production-window-1.log
            ask-vorta-production-window-2.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Ask Vorta production evaluations
        if: always()
        shell: bash
        run: |
          test "${{ steps.production_backlog.outcome }}" = "success" || {
            echo "The VOR-056 backlog production decision failed." >&2
            exit 1
          }
          test "${{ steps.production_window_one.outcome }}" = "success" || {
            echo "The first 12 Ask Vorta production decisions failed." >&2
            exit 1
          }
          test "${{ steps.production_window_two.outcome }}" = "success" || {
            echo "The final Ask Vorta production decision failed." >&2
            exit 1
          }

      - name: Install browser-test runner without changing the lockfile
        run: npm install --no-save --package-lock=false --silent @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated production regression
        run: npm run test:browser
