name: VOR-093 cereal production acceptance

on:
  push:
    branches:
      - agent/vor-093-cereal-media-render-gate
    paths:
      - tests/browser/vor-093-cereal-production-acceptance.spec.ts
      - .github/workflows/vor-093-cereal-production-acceptance.yml
      - src/screens/Equipment/**
      - src/lib/**
  pull_request:
    paths:
      - tests/browser/vor-093-cereal-production-acceptance.spec.ts
      - .github/workflows/vor-093-cereal-production-acceptance.yml
      - src/screens/Equipment/**
      - src/lib/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vor-093-cereal-production-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cereal-production:
    name: Cereal real/loading/empty/error/recovery on phone tablet laptop
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: cereal@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000004
      VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000002

    steps:
      - name: Check out exact acceptance source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: TypeScript check
        run: npm run typecheck -- --pretty false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Clear inherited browser auth state
        run: rm -f playwright/.auth/maintenance-manager.json

      - name: Run cereal production acceptance
        id: acceptance
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test \
            tests/browser/vor-093-cereal-production-acceptance.spec.ts \
            --project=phone-360 \
            --project=samsung-tablet-portrait \
            --project=laptop-1366 \
            --config=playwright.config.ts \
            2>&1 | tee vor-093-cereal-production-acceptance.log

      - name: Preserve production acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-093-cereal-production-acceptance-${{ github.sha }}
          path: |
            vor-093-cereal-production-acceptance.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce acceptance result
        if: steps.acceptance.outcome == 'failure'
        run: exit 1
