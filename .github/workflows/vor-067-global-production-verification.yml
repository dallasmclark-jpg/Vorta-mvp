name: VOR-067 global Back to chat production verification

on:
  pull_request:
    paths:
      - .github/workflows/vor-067-global-production-verification.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Verify global production Back to chat journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: c7036931169c9e2e09d9b2494043f76bc62ef416
      VORTA_PRODUCTION_URL: https://vorta-app.netlify.app
      VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

    steps:
      - name: Check out exact deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c7036931169c9e2e09d9b2494043f76bc62ef416
          show-progress: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Verify production serves the exact commit
        run: node scripts/verify-production-commit.mjs

      - name: Verify authenticated browser-test secret
        shell: bash
        run: |
          test -n "$VORTA_E2E_PASSWORD" || {
            echo "VORTA_E2E_PASSWORD is not configured." >&2
            exit 1
          }

      - name: Install focused global-navigation production test
        shell: bash
        run: |
          cat > tests/browser/vor-067-global-production-diagnostic.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";
          import { signInMaintenanceManager } from "./maintenance-manager-test-helpers";

          const question = "Vial filling sensor fault";
          const navigationKey = "vorta:ask-vorta:navigation-context:v1";

          test("VOR-067 global production Back to chat survives real navigation and reload", async ({ page }) => {
            test.setTimeout(180_000);
            await signInMaintenanceManager(page);
            await page.goto("/dashboard");
            await page.locator('[data-vorta-dashboard-root="true"]').waitFor();

            await page.evaluate((prompt) => {
              window.dispatchEvent(new CustomEvent("vorta-global-ai-prompt", {
                detail: { question: prompt, submit: true, role: "maintenance-manager" },
              }));
            }, question);

            const assistant = page
              .locator('[data-vorta-global-ai-panel="true"]:visible, [data-vorta-ai-workspace="true"]:visible')
              .first();
            await expect(assistant).toBeVisible({ timeout: 30_000 });
            await expect(assistant.locator(".justify-end p").filter({ hasText: question }).first())
              .toBeVisible({ timeout: 30_000 });

            const anyInternalEvidenceLink = assistant
              .locator('[data-vorta-ai-evidence-links="true"] button')
              .first();
            await expect(anyInternalEvidenceLink).toBeVisible({ timeout: 90_000 });
            await anyInternalEvidenceLink.click();
            await page.waitForURL((url) => url.pathname !== "/dashboard", { timeout: 30_000 });

            const backToChat = page.getByRole("button", {
              name: "Back to Ask Vorta chat",
              exact: true,
            });
            await expect(backToChat).toBeVisible({ timeout: 15_000 });

            console.log("VOR067 BEFORE RELOAD", await page.evaluate((key) => ({
              url: window.location.href,
              session: window.sessionStorage.getItem(key),
              historyState: window.history.state,
            }), navigationKey));

            await page.evaluate(() => {
              window.history.replaceState(window.history.state, "", window.location.pathname);
            });
            await page.reload();

            console.log("VOR067 AFTER RELOAD", await page.evaluate((key) => ({
              url: window.location.href,
              session: window.sessionStorage.getItem(key),
              historyState: window.history.state,
            }), navigationKey));

            await expect(backToChat).toBeVisible({ timeout: 30_000 });

            for (const path of ["/engineers", "/skills-matrix"]) {
              await page.goto(path);
              await expect(backToChat).toBeVisible({ timeout: 15_000 });
            }

            await backToChat.click();
            await page.waitForURL(/\/dashboard(?:\?.*)?$/, { timeout: 30_000 });
            const restoredAssistant = page
              .locator('[data-vorta-global-ai-panel="true"]:visible, [data-vorta-ai-workspace="true"]:visible')
              .first();
            await expect(restoredAssistant).toBeVisible({ timeout: 30_000 });
            await expect(restoredAssistant.locator(".justify-end p").filter({ hasText: question }).first())
              .toBeVisible({ timeout: 30_000 });
          });
          EOF

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify real production global Ask Vorta return journey
        run: npx playwright test tests/browser/vor-067-global-production-diagnostic.spec.ts --project=samsung-tablet-landscape
