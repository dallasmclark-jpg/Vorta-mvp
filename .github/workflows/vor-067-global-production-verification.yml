name: VOR-067 native Back to chat capture diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/vor-067-global-production-verification.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Diagnose native Ask Vorta capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VORTA_E2E_BASE_URL: https://deploy-preview-272--vorta-app.netlify.app
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

    steps:
      - name: Check out exact preview commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 25b8c3226480fe412a0a45659cd51318347e05f3
          show-progress: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Verify authenticated browser-test secret
        shell: bash
        run: |
          test -n "$VORTA_E2E_PASSWORD" || {
            echo "VORTA_E2E_PASSWORD is not configured." >&2
            exit 1
          }

      - name: Install focused capture diagnostic
        shell: bash
        run: |
          cat > tests/browser/vor-067-native-capture-diagnostic.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";
          import { signInMaintenanceManager } from "./maintenance-manager-test-helpers";

          const question = "Vial filling sensor fault";
          const navigationKey = "vorta:ask-vorta:navigation-context:v1";
          const destination = "/equipment/40000000-0000-0000-0000-000000000007/work-orders";

          test("diagnose native capture before navigation", async ({ page }) => {
            test.setTimeout(120_000);
            await signInMaintenanceManager(page);
            await page.goto("/dashboard");
            await page.locator('[data-vorta-dashboard-root="true"]').waitFor();

            await page.evaluate((prompt) => {
              window.dispatchEvent(new CustomEvent("vorta-global-ai-prompt", {
                detail: { question: prompt, submit: true, role: "maintenance-manager" },
              }));
            }, question);

            const assistant = page
              .locator('[data-vorta-global-ai-panel="true"]:visible, [data-vorta-ai-workspace="true"]:visible')
              .first();
            await expect(assistant).toBeVisible({ timeout: 30_000 });
            await expect(assistant.locator(".justify-end p").filter({ hasText: question }).first())
              .toBeVisible({ timeout: 30_000 });

            const diagnostic = await page.evaluate(({ path, key }) => {
              const surfaces = Array.from(document.querySelectorAll<HTMLElement>(
                '[data-vorta-global-ai-panel="true"], [data-vorta-ai-workspace="true"]',
              ));
              const surface = surfaces.find((element) => {
                const rect = element.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0;
              });
              if (!surface) throw new Error("Visible Ask Vorta surface was not found.");

              const link = document.createElement("a");
              link.href = path;
              link.textContent = "VOR-067 capture diagnostic";
              surface.appendChild(link);

              let bubbleObserved = false;
              link.addEventListener("click", (event) => {
                bubbleObserved = true;
                event.preventDefault();
              });

              const closestSurface = Boolean(link.closest(
                '[data-vorta-global-ai-panel="true"], [data-vorta-ai-workspace="true"]',
              ));
              const before = window.sessionStorage.getItem(key);
              link.click();
              const after = window.sessionStorage.getItem(key);

              return {
                before,
                after,
                bubbleObserved,
                closestSurface,
                linkHref: link.href,
                location: window.location.href,
              };
            }, { path: destination, key: navigationKey });

            console.log("VOR067 CAPTURE DIAGNOSTIC", JSON.stringify(diagnostic));
            expect(diagnostic.closestSurface).toBe(true);
            expect(diagnostic.bubbleObserved).toBe(true);
            expect(diagnostic.after).toContain('"returnPath":"/dashboard"');

            await page.goto(destination);
            await expect(page.getByRole("button", {
              name: "Back to Ask Vorta chat",
              exact: true,
            })).toBeVisible({ timeout: 30_000 });
          });
          EOF

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run capture diagnostic
        run: npx playwright test tests/browser/vor-067-native-capture-diagnostic.spec.ts --project=samsung-tablet-landscape
