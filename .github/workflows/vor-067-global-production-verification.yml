name: VOR-067 deep-route context diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/vor-067-global-production-verification.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Inspect deep-route Back to chat context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VORTA_E2E_BASE_URL: https://deploy-preview-272--vorta-app.netlify.app
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

    steps:
      - name: Check out exact preview commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 25b8c3226480fe412a0a45659cd51318347e05f3
          show-progress: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Verify authenticated browser-test secret
        shell: bash
        run: |
          test -n "$VORTA_E2E_PASSWORD" || exit 1

      - name: Install route-context diagnostic
        shell: bash
        run: |
          cat > tests/browser/vor-067-route-context-diagnostic.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";
          import { signInMaintenanceManager } from "./maintenance-manager-test-helpers";

          const key = "vorta:ask-vorta:navigation-context:v1";
          const destination = "/equipment/40000000-0000-0000-0000-000000000007/work-orders";

          test("inspect deep route context hydration", async ({ page }) => {
            test.setTimeout(90_000);
            await signInMaintenanceManager(page);
            await page.goto("/dashboard");
            await page.locator('[data-vorta-dashboard-root="true"]').waitFor();

            await page.evaluate((storageKey) => {
              window.sessionStorage.setItem(storageKey, JSON.stringify({ returnPath: "/dashboard" }));
            }, key);

            const before = await page.evaluate((storageKey) => ({
              url: window.location.href,
              value: window.sessionStorage.getItem(storageKey),
            }), key);
            console.log("VOR067 BEFORE GOTO", JSON.stringify(before));

            await page.goto(destination, { waitUntil: "domcontentloaded" });
            await page.waitForTimeout(3000);

            const after = await page.evaluate((storageKey) => ({
              url: window.location.href,
              value: window.sessionStorage.getItem(storageKey),
              shellCount: document.querySelectorAll('[data-vorta-maintenance-portal="true"]').length,
              buttonCount: document.querySelectorAll('[data-vorta-back-to-ask-vorta="true"]').length,
              body: document.body.innerText.slice(0, 500),
            }), key);
            console.log("VOR067 AFTER GOTO", JSON.stringify(after));

            expect(after.value).toContain('"returnPath":"/dashboard"');
            expect(after.shellCount).toBeGreaterThan(0);
            expect(after.buttonCount).toBeGreaterThan(0);
          });
          EOF

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run route-context diagnostic
        run: npx playwright test tests/browser/vor-067-route-context-diagnostic.spec.ts --project=samsung-tablet-landscape
