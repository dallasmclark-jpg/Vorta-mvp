name: VOR-067 exact production verification

on:
  pull_request:
    paths:
      - .github/workflows/vor-067-global-production-verification.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Verify exact production Back to chat journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: 5298e8acaae564c4c2d433f3f540797000444a88
      VORTA_PRODUCTION_URL: https://vorta-app.netlify.app
      VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

    steps:
      - name: Check out exact deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 5298e8acaae564c4c2d433f3f540797000444a88
          show-progress: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Verify production serves the exact merged commit
        run: node scripts/verify-production-commit.mjs

      - name: Verify authenticated browser-test secret
        shell: bash
        run: |
          test -n "$VORTA_E2E_PASSWORD" || exit 1

      - name: Install deterministic production journey
        shell: bash
        run: |
          cat > tests/browser/vor-067-exact-production-global-return.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";
          import { signInMaintenanceManager } from "./maintenance-manager-test-helpers";

          const question = "Vial filling sensor fault";
          const navigationKey = "vorta:ask-vorta:navigation-context:v1";
          const equipmentId = "40000000-0000-0000-0000-000000000007";
          const guideId = "dbd95c1f-08ab-4224-a0dc-ba50651150e8";

          test("VOR-067 exact production gives every internal Ask Vorta destination one global Back to chat journey", async ({ page }) => {
            test.setTimeout(180_000);
            await signInMaintenanceManager(page);
            await page.goto("/dashboard");
            await page.locator('[data-vorta-dashboard-root="true"]').waitFor();

            await page.evaluate((prompt) => {
              window.dispatchEvent(new CustomEvent("vorta-global-ai-prompt", {
                detail: { question: prompt, submit: true, role: "maintenance-manager" },
              }));
            }, question);

            const assistant = page
              .locator('[data-vorta-global-ai-panel="true"]:visible, [data-vorta-ai-workspace="true"]:visible')
              .first();
            const activeQuestion = assistant
              .locator(".justify-end p")
              .filter({ hasText: question })
              .first();

            await expect(assistant).toBeVisible({ timeout: 30_000 });
            await expect(activeQuestion).toBeVisible({ timeout: 30_000 });

            const destinations = [
              `/equipment/${equipmentId}/work-orders`,
              `/equipment/${equipmentId}/spares`,
              `/equipment/${equipmentId}/documents/${guideId}`,
              "/stores-inventory",
              "/skills-matrix",
              "/engineers",
            ];

            for (const destination of destinations) {
              await expect(assistant).toBeVisible({ timeout: 30_000 });
              await expect(activeQuestion).toBeVisible({ timeout: 30_000 });

              // Create an ordinary same-origin link inside the live Ask Vorta surface.
              // The production shell must capture it before navigation without knowing
              // whether it targets a work order, spare, document, store, skill or engineer.
              const capturedContext = await page.evaluate(({ path, key }) => {
                const surfaces = Array.from(document.querySelectorAll<HTMLElement>(
                  '[data-vorta-global-ai-panel="true"], [data-vorta-ai-workspace="true"]',
                ));
                const surface = surfaces.find((element) => {
                  const rect = element.getBoundingClientRect();
                  return rect.width > 0 && rect.height > 0;
                });
                if (!surface) throw new Error("Visible Ask Vorta surface was not found.");

                window.sessionStorage.removeItem(key);
                const link = document.createElement("a");
                link.href = path;
                link.textContent = `VOR-067 verify ${path}`;
                link.addEventListener("click", (event) => event.preventDefault());
                surface.appendChild(link);
                link.click();

                const stored = window.sessionStorage.getItem(key);

                // Continue using the SPA after the real capture-phase click has marked
                // the Ask Vorta excursion. This avoids turning the test into a Netlify
                // hard-refresh test, which is a different concern entirely.
                window.history.pushState(window.history.state, "", path);
                window.dispatchEvent(new PopStateEvent("popstate", { state: window.history.state }));
                return stored;
              }, { path: destination, key: navigationKey });

              expect(capturedContext).toContain('"returnPath":"/dashboard"');
              await page.waitForURL((url) => url.pathname === destination, { timeout: 30_000 });

              const backToChat = page.getByRole("button", {
                name: "Back to Ask Vorta chat",
                exact: true,
              });
              await expect(backToChat).toBeVisible({ timeout: 30_000 });

              await backToChat.click();
              await page.waitForURL(/\/dashboard(?:\?.*)?$/, { timeout: 30_000 });
              await expect(assistant).toBeVisible({ timeout: 30_000 });
              await expect(activeQuestion).toBeVisible({ timeout: 30_000 });
            }
          });
          EOF

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact production global-return regression
        run: npx playwright test tests/browser/vor-067-exact-production-global-return.spec.ts --project=samsung-tablet-landscape
