name: VOR-067 global Back to chat production verification

on:
  pull_request:
    paths:
      - .github/workflows/vor-067-global-production-verification.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Verify global production Back to chat journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: c7036931169c9e2e09d9b2494043f76bc62ef416
      VORTA_PRODUCTION_URL: https://vorta-app.netlify.app
      VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

    steps:
      - name: Check out exact deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c7036931169c9e2e09d9b2494043f76bc62ef416
          show-progress: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Verify production serves the exact commit
        run: node scripts/verify-production-commit.mjs

      - name: Verify authenticated browser-test secret
        shell: bash
        run: |
          test -n "$VORTA_E2E_PASSWORD" || {
            echo "VORTA_E2E_PASSWORD is not configured." >&2
            exit 1
          }

      - name: Install complete global-navigation production test
        shell: bash
        run: |
          cat > tests/browser/vor-067-global-production-final.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";
          import { signInMaintenanceManager } from "./maintenance-manager-test-helpers";

          const question = "Vial filling sensor fault";
          const equipmentId = "40000000-0000-0000-0000-000000000007";
          const guideId = "dbd95c1f-08ab-4224-a0dc-ba50651150e8";

          test("VOR-067 production keeps Back to chat global for every internal Ask Vorta destination", async ({ page }) => {
            test.setTimeout(180_000);
            await signInMaintenanceManager(page);
            await page.goto("/dashboard");
            await page.locator('[data-vorta-dashboard-root="true"]').waitFor();

            await page.evaluate((prompt) => {
              window.dispatchEvent(new CustomEvent("vorta-global-ai-prompt", {
                detail: { question: prompt, submit: true, role: "maintenance-manager" },
              }));
            }, question);

            const assistant = page
              .locator('[data-vorta-global-ai-panel="true"]:visible, [data-vorta-ai-workspace="true"]:visible')
              .first();
            await expect(assistant).toBeVisible({ timeout: 30_000 });
            await expect(assistant.locator(".justify-end p").filter({ hasText: question }).first())
              .toBeVisible({ timeout: 30_000 });

            const latestAssistantMessage = assistant.locator(".justify-start").last();
            await expect(latestAssistantMessage).toBeVisible({ timeout: 90_000 });
            await expect(latestAssistantMessage.locator(".animate-spin")).toHaveCount(0, { timeout: 90_000 });

            // Inject one ordinary same-origin link into the live Ask Vorta surface.
            // The application-shell capture logic must treat it exactly like any
            // future internal link type without knowing its destination in advance.
            await page.evaluate(() => {
              const surfaces = Array.from(document.querySelectorAll<HTMLElement>(
                '[data-vorta-global-ai-panel="true"], [data-vorta-ai-workspace="true"]',
              ));
              const surface = surfaces.find((element) => {
                const rect = element.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0;
              });
              if (!surface) throw new Error("Visible Ask Vorta surface was not found.");
              const link = document.createElement("a");
              link.href = "/engineers";
              link.textContent = "VOR-067 internal navigation verification";
              link.setAttribute("data-vor067-internal-link", "true");
              surface.appendChild(link);
              link.click();
            });

            await page.waitForURL(/\/engineers(?:\?.*)?$/, { timeout: 30_000 });
            const backToChat = page.getByRole("button", {
              name: "Back to Ask Vorta chat",
              exact: true,
            });
            await expect(backToChat).toBeVisible({ timeout: 30_000 });

            // The control belongs to the application shell, so representative
            // destinations do not need their own Back-to-chat implementation.
            const representativeDestinations = [
              `/equipment/${equipmentId}/work-orders`,
              `/equipment/${equipmentId}/spares`,
              `/equipment/${equipmentId}/documents/${guideId}`,
              "/stores-inventory",
              "/skills-matrix",
            ];
            for (const destination of representativeDestinations) {
              await page.goto(destination);
              await page.locator('[data-vorta-maintenance-portal="true"]').waitFor({ timeout: 30_000 });
              await expect(backToChat).toBeVisible({ timeout: 30_000 });
            }

            // Hard reload on the final destination proves visibility does not
            // depend on query parameters, browser history or a transient component.
            await page.reload();
            await page.locator('[data-vorta-maintenance-portal="true"]').waitFor({ timeout: 30_000 });
            await expect(backToChat).toBeVisible({ timeout: 30_000 });

            await backToChat.click();
            await page.waitForURL(/\/dashboard(?:\?.*)?$/, { timeout: 30_000 });

            const restoredAssistant = page
              .locator('[data-vorta-global-ai-panel="true"]:visible, [data-vorta-ai-workspace="true"]:visible')
              .first();
            await expect(restoredAssistant).toBeVisible({ timeout: 30_000 });
            await expect(
              restoredAssistant.locator(".justify-end p").filter({ hasText: question }).first(),
            ).toBeVisible({ timeout: 30_000 });
          });
          EOF

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify exact production global Ask Vorta return journey
        run: npx playwright test tests/browser/vor-067-global-production-final.spec.ts --project=samsung-tablet-landscape
