name: VOR-039 response shape patch v3

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/vor-039-response-shape-patch-v3.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vor-039-ask-vorta-confidence-latency
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic response-shape enforcement
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          agent_path = Path("netlify/functions/ask-vorta.mts")
          agent = agent_path.read_text()

          shape_helper = '''function enforceDeterministicResponseShape(
            answer: JsonRecord,
            questionPlan: JsonRecord | null,
          ): void {
            if (questionPlan?.routingMode !== "deterministic") return;

            const scope =
              typeof questionPlan.scope === "string" ? questionPlan.scope : "";

            if (scope === "handover") {
              answer.decisionSummary = records(answer.decisionSummary).slice(0, 3);
              answer.followUpQuestions = textValues(answer.followUpQuestions).slice(0, 1);
            }

            if (scope !== "site_priorities" || records(answer.actionPlan).length > 0) {
              return;
            }

            const summaryAction = records(answer.decisionSummary).find((item) =>
              /first action|next action|action/i.test(String(item.label ?? "")),
            );
            const action =
              textValues(answer.recommendedActions)[0] ??
              (typeof summaryAction?.value === "string"
                ? summaryAction.value.trim()
                : "");

            if (!action) return;

            answer.actionPlan = [
              {
                priority: "now",
                action,
                owner: "Maintenance Manager",
                expectedImpact:
                  "Starts the highest-priority executable maintenance intervention identified by the current Vorta evidence.",
                verification:
                  "Open the linked Vorta evidence and confirm the named action has an owner and status before the next shift handover.",
              },
            ];
          }

          '''
          agent = replace_once(
              agent,
              "function enforceAnswerEvidence(\n",
              shape_helper + "function enforceAnswerEvidence(\n",
              "insert deterministic response-shape helper",
          )

          calibration_marker = "        const calibratedConfidence = evidenceAwareConfidence(\n"
          agent = replace_once(
              agent,
              calibration_marker,
              "        enforceDeterministicResponseShape(answer, questionPlan);\n" + calibration_marker,
              "apply deterministic response-shape helper",
          )

          agent = replace_once(
              agent,
              "Summarise what the previous shift completed, left ongoing or waiting, and the next action.",
              "Summarise what the previous shift completed, left ongoing or waiting, and the next action using no more than three decision summary items.",
              "handover concise focus",
          )
          agent = replace_once(
              agent,
              "Rank the main current maintenance threats and state the first executable action.",
              "Rank the main current maintenance threats, state the first executable action and return one actionPlan item for it.",
              "site priority action focus",
          )
          agent_path.write_text(agent)

          contract_path = Path("scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs")
          contract = contract_path.read_text()
          contract = replace_once(
              contract,
              '''  [source.includes("deterministicQuestionPlan") && source.includes('routingMode: "deterministic"'), "clear maintenance intents bypass the model planner"],''',
              '''  [source.includes("deterministicQuestionPlan") && source.includes('routingMode: "deterministic"'), "clear maintenance intents bypass the model planner"],
              [source.includes("enforceDeterministicResponseShape") && source.includes('scope === "handover"') && source.includes('scope !== "site_priorities"'), "fast routes enforce concise summaries and requested action structure"],''',
              "response-shape contract",
          )
          contract_path.write_text(contract)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify focused implementation
        run: |
          npm run typecheck:functions
          node scripts/vor-038-ask-vorta-intelligence-contracts.mjs
          node scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs
          node scripts/ask-vorta-agent-contracts.mjs

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/vor-039-response-shape-patch.yml
          rm .github/workflows/vor-039-response-shape-patch-v2.yml
          rm .github/workflows/vor-039-response-shape-patch-v3.yml
          git config user.name "Vorta Agent"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/ask-vorta.mts \
            scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs \
            .github/workflows/vor-039-response-shape-patch.yml \
            .github/workflows/vor-039-response-shape-patch-v2.yml \
            .github/workflows/vor-039-response-shape-patch-v3.yml
          git commit -m "VOR-039: enforce fast-route response shape [vor-039 response shape]"
          git push origin HEAD:agent/vor-039-ask-vorta-confidence-latency
