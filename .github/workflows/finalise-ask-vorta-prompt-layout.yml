name: Finalise Ask Vorta prompt layout

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/finalise-ask-vorta-prompt-layout.mjs"
      - ".github/workflows/finalise-ask-vorta-prompt-layout.yml"

permissions:
  contents: write

concurrency:
  group: finalise-ask-vorta-prompt-layout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Apply final prompt layout trim
        run: node scripts/finalise-ask-vorta-prompt-layout.mjs

      - name: Remove temporary scaffolding
        run: |
          rm scripts/finalise-ask-vorta-prompt-layout.mjs
          rm .github/workflows/finalise-ask-vorta-prompt-layout.yml

      - name: Verify diff formatting
        run: git diff --check

      - name: Commit final prompt layout trim
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx \
            src/screens/AiOperations/mobilePortalHardening.css \
            scripts/vor-041-ask-vorta-workspace-contracts.mjs \
            scripts/finalise-ask-vorta-prompt-layout.mjs \
            .github/workflows/finalise-ask-vorta-prompt-layout.yml
          git commit -m "Finalise Ask Vorta prompt layout"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
