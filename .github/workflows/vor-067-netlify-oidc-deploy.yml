name: VOR-067 Netlify OIDC deploy

on:
  push:
    branches:
      - ops/vor-067-netlify-oidc
    paths:
      - .github/workflows/vor-067-netlify-oidc-deploy.yml

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_SITE_ID: 4672c4a4-53eb-475d-ae88-a9de4ecdeae8
    steps:
      - name: Check out exact current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Obtain repository OIDC deployment handoff
        id: handoff
        shell: bash
        run: |
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vorta-netlify-deploy")"
          oidc_token="$(node -e 'const value=JSON.parse(process.argv[1]).value; if (!value) process.exit(1); process.stdout.write(value)' "${oidc_response}")"

          handoff_response="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            "https://ndhqxetvkaeyiwvnvjjy.supabase.co/functions/v1/vorta-netlify-handoff")"
          proxy_url="$(node -e 'const value=JSON.parse(process.argv[1]).proxyUrl; if (!value) process.exit(1); process.stdout.write(value)' "${handoff_response}")"
          echo "::add-mask::${proxy_url}"
          echo "proxy_url=${proxy_url}" >> "$GITHUB_OUTPUT"

      - name: Deploy exact current main to Netlify production
        shell: bash
        run: |
          npx -y @netlify/mcp@1.15.1 \
            --site-id "${NETLIFY_SITE_ID}" \
            --proxy-path "${{ steps.handoff.outputs.proxy_url }}"
