name: VOR-034 production bundle

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/vor-034-production-bundle.yml"
      - "src/screens/Equipment/**"
      - "supabase/migrations/2026080121*.sql"
      - "supabase/migrations/2026080122*.sql"
      - "scripts/vor-034-verified-images-contract.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vor-034-production-bundle.yml"
      - "src/screens/Equipment/**"
      - "supabase/migrations/2026080121*.sql"
      - "supabase/migrations/2026080122*.sql"
      - "scripts/vor-034-verified-images-contract.mjs"
      - "package.json"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Record source commit
        run: echo "${GITHUB_SHA}" > dist/vorta-source-commit.txt

      - name: Package portable Netlify deployment runtime
        run: |
          mkdir -p release/netlify-runtime
          npm install --prefix release/netlify-runtime --omit=dev @netlify/mcp@1.15.1
          tar --exclude=.git --exclude=node_modules --exclude=release -czf release/vorta-source.tar.gz .
          tar -C release/netlify-runtime -czf release/netlify-mcp-runtime.tar.gz .
          cp -R dist release/dist

      - name: Upload portable production release
        uses: actions/upload-artifact@v4
        with:
          name: vor-034-portable-release
          path: release
          if-no-files-found: error
          retention-days: 3

      - name: Deploy verified build to Netlify production
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          NETLIFY_SITE_ID: 4672c4a4-53eb-475d-ae88-a9de4ecdeae8
        run: |
          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vorta-netlify-deploy")"
          oidc_token="$(node -e 'const value=JSON.parse(process.argv[1]).value; if (!value) process.exit(1); process.stdout.write(value)' "${oidc_response}")"

          handoff_response="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            "https://ndhqxetvkaeyiwvnvjjy.supabase.co/functions/v1/vorta-netlify-handoff")"
          proxy_url="$(node -e 'const value=JSON.parse(process.argv[1]).proxyUrl; if (!value) process.exit(1); process.stdout.write(value)' "${handoff_response}")"
          echo "::add-mask::${proxy_url}"

          npx -y @netlify/mcp@1.15.1 \
            --site-id "${NETLIFY_SITE_ID}" \
            --proxy-path "${proxy_url}"
