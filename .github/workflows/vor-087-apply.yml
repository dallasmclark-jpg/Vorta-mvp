name: VOR-087 apply universal Ask Vorta disclosure

on:
  push:
    branches:
      - agent/vor-087-universal-ask-vorta-disclosure

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[vor-087-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/vor-087-universal-ask-vorta-disclosure
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded renderer change
        run: node scripts/vor-087-apply.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Verify permanent contracts
        run: npm run test:contracts

      - name: Check diff integrity
        run: git diff --check

      - name: Commit verified renderer source
        run: |
          git config user.name "dallasmclark-jpg"
          git config user.email "dallasmclark@gmail.com"
          git add \
            src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx \
            src/screens/AiOperations/AskVortaWorkspaceBase.tsx \
            scripts/vor-084-live-evidence-activity-contracts.mjs \
            scripts/ask-vorta-agent-contracts.mjs \
            scripts/vor-087-universal-disclosure-contracts.mjs \
            scripts/run-contract-suite.mjs
          git diff --cached --quiet && exit 0
          git commit -m "VOR-087 apply universal Ask Vorta disclosure [vor-087-applied]"
          git push origin HEAD:agent/vor-087-universal-ask-vorta-disclosure
