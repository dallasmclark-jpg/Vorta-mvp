name: VOR-034 apply compact mobile image patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/vor-034-compact-mobile-patch.yml"
      - ".github/workflows/vor-034-compact-mobile-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Extract and apply the focused patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/vor-034-compact-mobile-patch.yml").read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Verify focused contract"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit("Could not locate the embedded VOR-034 patch script")
          embedded = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          Path("/tmp/vor034-compact-mobile-patch.py").write_text(script + "\n")
          PY
          python /tmp/vor034-compact-mobile-patch.py
          node scripts/vor-034-verified-images-contract.mjs

      - name: Commit the product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/Equipment/VerifiedEquipmentImage.tsx \
            src/screens/Equipment/MobileEquipmentSection.tsx \
            scripts/vor-034-verified-images-contract.mjs
          git diff --cached --quiet && exit 0
          git commit -m "VOR-034: compact equipment imagery on mobile"
          git push origin HEAD:${{ github.head_ref }}
