name: VOR-034 apply compact mobile image patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/vor-034-compact-mobile-patch.yml"
      - ".github/workflows/vor-034-compact-mobile-apply.yml"
      - "src/screens/Equipment/**"
      - "scripts/vor-034-verified-images-contract.mjs"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply focused phone-only image refinement
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          verified = Path("src/screens/Equipment/VerifiedEquipmentImage.tsx")
          verified.write_text(dedent('''\
          import { useEffect, useState } from "react";
          import { ImageOff, ShieldCheck } from "lucide-react";
          import { resolveEquipmentImage } from "./equipmentImages";

          interface VerifiedEquipmentImageProps {
            src: string | null | undefined;
            equipmentName: string;
            equipmentType?: string | null;
            equipmentCode?: string | null;
            className?: string;
            imageClassName?: string;
            compact?: boolean;
          }

          export function VerifiedEquipmentImage({
            src,
            equipmentName,
            equipmentType,
            equipmentCode,
            className = "",
            imageClassName = "",
            compact = false,
          }: VerifiedEquipmentImageProps): JSX.Element {
            const [failed, setFailed] = useState(false);

            useEffect(() => {
              setFailed(false);
            }, [src]);

            const hasVerifiedImage = Boolean(src) && !failed;
            const fallback = resolveEquipmentImage(
              equipmentName,
              equipmentType,
              equipmentCode,
            );

            if (compact) {
              return (
                <div
                  className={`relative overflow-hidden rounded-xl border border-gray-800 bg-[#0d1117] ${className}`}
                  data-vorta-equipment-image-state={hasVerifiedImage ? "verified" : "unavailable"}
                  data-vorta-equipment-image-layout="compact"
                  role={hasVerifiedImage ? undefined : "img"}
                  aria-label={
                    hasVerifiedImage ? undefined : `Verified image unavailable for ${equipmentName}`
                  }
                >
                  {hasVerifiedImage ? (
                    <img
                      src={src ?? fallback}
                      alt={`Verified product image for ${equipmentName}`}
                      loading="lazy"
                      decoding="async"
                      className={`h-full w-full object-contain ${imageClassName}`}
                      onError={() => setFailed(true)}
                    />
                  ) : (
                    <div className="flex h-full w-full flex-col items-center justify-center gap-1 bg-slate-900/70 px-2 text-center text-slate-500">
                      <ImageOff className="h-5 w-5" aria-hidden="true" />
                      <span className="text-[9px] font-semibold leading-tight">No verified image</span>
                    </div>
                  )}

                  {hasVerifiedImage ? (
                    <span className="absolute bottom-1 right-1 inline-flex h-5 w-5 items-center justify-center rounded-md border border-emerald-500/30 bg-emerald-950/90 text-emerald-200 backdrop-blur">
                      <ShieldCheck className="h-3 w-3" aria-hidden="true" />
                      <span className="sr-only">Verified image</span>
                    </span>
                  ) : null}
                </div>
              );
            }

            return (
              <div
                className={`relative overflow-hidden rounded-xl border border-gray-800 bg-[#0d1117] ${className}`}
                data-vorta-equipment-image-state={hasVerifiedImage ? "verified" : "unavailable"}
                data-vorta-equipment-image-layout="full"
              >
                <img
                  src={hasVerifiedImage ? src ?? fallback : fallback}
                  alt={
                    hasVerifiedImage
                      ? `Verified product image for ${equipmentName}`
                      : `Verified image unavailable for ${equipmentName}`
                  }
                  loading="lazy"
                  decoding="async"
                  className={`h-full w-full ${hasVerifiedImage ? "object-contain" : "object-cover"} ${imageClassName}`}
                  onError={() => setFailed(true)}
                />

                <span
                  className={`absolute bottom-1.5 left-1.5 inline-flex items-center gap-1 rounded-md border px-1.5 py-1 text-[10px] font-semibold backdrop-blur ${
                    hasVerifiedImage
                      ? "border-emerald-500/30 bg-emerald-950/85 text-emerald-200"
                      : "border-slate-600/50 bg-slate-950/85 text-slate-300"
                  }`}
                >
                  {hasVerifiedImage ? (
                    <ShieldCheck className="h-3 w-3" aria-hidden="true" />
                  ) : (
                    <ImageOff className="h-3 w-3" aria-hidden="true" />
                  )}
                  {hasVerifiedImage ? "Verified image" : "Awaiting verified image"}
                </span>
              </div>
            );
          }
          '''))

          mobile = Path("src/screens/Equipment/MobileEquipmentSection.tsx")
          text = mobile.read_text()
          text = text.replace(
              'className="h-64 animate-pulse rounded-xl border border-gray-800 bg-[#141820]"',
              'className="h-56 animate-pulse rounded-xl border border-gray-800 bg-[#141820]"',
          )

          if 'data-vorta-mobile-equipment-media="compact"' not in text:
              search_from = text.index("filtered.map")
              image_start = text.index("<VerifiedEquipmentImage", search_from)
              block_start = text.rfind("\n", 0, image_start) + 1
              metrics_start = text.index(
                  '<div className="mt-3 grid grid-cols-3 gap-2">',
                  image_start,
              )
              block_end = text.rfind("\n", 0, metrics_start) + 1
              compact_block = dedent('''\
                                <div
                                  className="grid grid-cols-[5.5rem_minmax(0,1fr)] items-start gap-3"
                                  data-vorta-mobile-equipment-media="compact"
                                >
                                  <VerifiedEquipmentImage
                                    src={record?.imageUrl}
                                    equipmentName={item.name}
                                    equipmentType={item.type}
                                    equipmentCode={item.assetNumber}
                                    className="h-[88px] w-[88px]"
                                    compact
                                  />

                                  <button
                                    type="button"
                                    onClick={() => navigate(equipmentRoute(item.id, "overview"))}
                                    aria-label={`Open overview for ${item.name}, ${item.assetNumber}`}
                                    className="flex min-h-[88px] w-full items-start justify-between gap-2 rounded-lg py-0.5 text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500/60"
                                  >
                                    <div className="min-w-0 flex-1">
                                      <p className="line-clamp-2 text-base font-semibold leading-5 text-slate-100">{item.name}</p>
                                      <p className="mt-1 truncate text-xs text-slate-500">{item.assetNumber} · {item.area}</p>
                                      <div className="mt-2">
                                        <EvidenceBadge
                                          mode={dataMode}
                                          coverage={coverage.get(item.id)}
                                          unavailable={Boolean(coverageError)}
                                        />
                                      </div>
                                    </div>
                                    <div className="shrink-0 text-right">
                                      <p className={`text-xl font-semibold tabular-nums ${tone.split(" ").at(-1)}`}>{item.riskScore.toFixed(1)}</p>
                                      <span className={`mt-1 inline-flex rounded-md border px-2 py-0.5 text-[10px] font-semibold ${tone}`}>
                                        {item.riskLevel}
                                      </span>
                                    </div>
                                  </button>
                                </div>
              ''')
              indent = text[block_start:image_start]
              compact_block = "\n".join(
                  indent + line if line else ""
                  for line in compact_block.rstrip().splitlines()
              ) + "\n\n"
              text = text[:block_start] + compact_block + text[block_end:]
          mobile.write_text(text)

          contract = Path("scripts/vor-034-verified-images-contract.mjs")
          contract_text = contract.read_text()
          read_anchor = 'const equipmentImages = read("src/screens/Equipment/equipmentImages.ts");\n'
          if "const verifiedEquipmentImage" not in contract_text:
              contract_text = contract_text.replace(
                  read_anchor,
                  read_anchor + '''const verifiedEquipmentImage = read(
            "src/screens/Equipment/VerifiedEquipmentImage.tsx",
          );
          const mobileEquipment = read(
            "src/screens/Equipment/MobileEquipmentSection.tsx",
          );
          ''',
              )

          if "phone equipment imagery uses a compact fixed thumbnail" not in contract_text:
              check_anchor = "\n];\n\nconst failures"
              new_checks = '''
            {
              label: "phone equipment imagery uses a compact fixed thumbnail",
              pass:
                mobileEquipment.includes('data-vorta-mobile-equipment-media="compact"') &&
                mobileEquipment.includes('className="h-[88px] w-[88px]"') &&
                mobileEquipment.includes("compact") &&
                !mobileEquipment.includes('className="h-40 w-full"'),
            },
            {
              label: "compact unavailable imagery avoids the full fallback panel",
              pass:
                verifiedEquipmentImage.includes('data-vorta-equipment-image-layout="compact"') &&
                verifiedEquipmentImage.includes("No verified image") &&
                verifiedEquipmentImage.includes('role={hasVerifiedImage ? undefined : "img"}') &&
                verifiedEquipmentImage.includes('data-vorta-equipment-image-layout="full"'),
            },
          ];

          const failures'''
              if check_anchor not in contract_text:
                  raise SystemExit("Expected VOR-034 contract terminator was not found")
              contract_text = contract_text.replace(check_anchor, new_checks, 1)
          contract.write_text(contract_text)
          PY

          node scripts/vor-034-verified-images-contract.mjs

      - name: Commit the product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/Equipment/VerifiedEquipmentImage.tsx \
            src/screens/Equipment/MobileEquipmentSection.tsx \
            scripts/vor-034-verified-images-contract.mjs
          git diff --cached --quiet && exit 0
          git commit -m "VOR-034: compact equipment imagery on mobile"
          git push origin HEAD:${{ github.head_ref }}
