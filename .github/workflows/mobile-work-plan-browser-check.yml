name: Mobile work plan browser check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000001
      VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
      VORTA_E2E_DENIED_EQUIPMENT_ID: 40000000-0000-0000-0000-000000000013

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Compose public Supabase client key
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Install browser-test runner
        run: npm install --no-save --package-lock=false --silent @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run phone dashboard regression
        id: phone-regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/browser/maintenance-manager-core.spec.ts --config=playwright.config.ts --project=phone-360 --grep "Mobile work plan scrolls" 2>&1 | tee mobile-work-plan-browser.log

      - name: Preserve phone regression evidence
        if: steps.phone-regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-work-plan-browser-evidence
          path: |
            mobile-work-plan-browser.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce phone regression result
        if: steps.phone-regression.outcome == 'failure'
        run: exit 1
