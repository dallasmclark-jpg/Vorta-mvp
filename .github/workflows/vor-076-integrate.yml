name: VOR-076 focused integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate-and-check:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/vor-076-visual-spare-stock-match'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused VOR-076 UI integration
        run: |
          node scripts/vor-076-ui-codemod.mjs
          node scripts/vor-076-answer-codemod.mjs
          node scripts/vor-076-contract-suite-codemod.mjs
      - name: Commit integration result
        run: |
          if git diff --quiet; then
            echo "VOR-076 codemods already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/screens/AiOperations/AskVortaWorkspace.tsx src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx scripts/run-contract-suite.mjs
            git commit -m "VOR-076 integrate concise visual spare matching UI"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run VOR-076 contract
        run: node scripts/vor-076-spare-photo-contracts.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
