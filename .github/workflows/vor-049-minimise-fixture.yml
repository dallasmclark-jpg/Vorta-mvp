name: VOR-049 minimise golden fixture diff

on:
  push:
    branches:
      - agent/vor-049-diagnostic-contrast-repair
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vor-049-minimise-fixture
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      EXPECTED_MAIN: 5a9c496fd1e2056d651cbff1a5a0da72818a2393
      WORKFLOW_FILE: .github/workflows/vor-049-minimise-fixture.yml
      PATCH_FILE: scripts/tmp-vor049-minimise-fixture.py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Restore exact main formatting and apply only AHU assertion fields
        shell: bash
        run: |
          git show "$EXPECTED_MAIN:tests/evals/vor-033-demo-golden.json" > tests/evals/vor-033-demo-golden.json
          python "$PATCH_FILE"
          rm "$WORKFLOW_FILE" "$PATCH_FILE"
      - name: Verify four-file candidate scope and focused contract
        shell: bash
        run: |
          git diff --name-only "$EXPECTED_MAIN" | sort > /tmp/files.txt
          printf '%s\n' \
            netlify/functions/ask-vorta/equipment-evidence.mts \
            scripts/ask-vorta-live-evals.mjs \
            scripts/vor-049-decision-ready-equipment-contracts.mjs \
            tests/evals/vor-033-demo-golden.json | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          node scripts/vor-049-decision-ready-equipment-contracts.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "Vorta Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VOR-049: minimise golden fixture diff"
          git push origin HEAD:${GITHUB_REF_NAME}
