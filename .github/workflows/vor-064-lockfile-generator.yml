name: VOR-064 lockfile generator

on:
  push:
    branches:
      - agent/vor-064-locked-browser-runtime
    paths:
      - ".github/workflows/vor-064-lockfile-generator.yml"

permissions:
  contents: write

concurrency:
  group: vor-064-lockfile-generator
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and verify locked browser runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out VOR-064 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/vor-064-locked-browser-runtime
          fetch-depth: 0
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Generate permanent files
        run: node scripts/vor-064-prepare-locked-browser-runtime.mjs

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --silent

      - name: Verify clean locked install
        run: |
          npm ci --ignore-scripts --silent
          node -e "const version=require('./node_modules/@playwright/test/package.json').version; if(version!=='1.55.0') throw new Error('Unexpected Playwright '+version);"
          git diff --exit-code package.json

      - name: Commit generated repository files
        run: |
          git config user.name "Vorta CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json docs/locked-ci-dependencies.md scripts/run-contract-suite.mjs scripts/vor-064-locked-browser-runtime-contracts.mjs scripts/vor-064-prepare-locked-browser-runtime.mjs
          git commit -m "VOR-064: generate locked browser runtime [skip netlify]"
          git push origin HEAD:agent/vor-064-locked-browser-runtime
