name: VOR-064 workflow transformer

on:
  push:
    branches:
      - agent/vor-064-locked-browser-runtime
    paths:
      - ".github/workflows/vor-064-lockfile-generator.yml"

permissions:
  contents: read

concurrency:
  group: vor-064-workflow-transformer
  cancel-in-progress: false

jobs:
  transform:
    name: Prepare and verify protected workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out VOR-064 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/vor-064-locked-browser-runtime
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --silent

      - name: Generate workflow replacements
        run: node scripts/vor-064-transform-workflows.mjs

      - name: Verify transformed workflow policy
        run: |
          for file in vor-064-workflow-output/*.yml vor-064-workflow-output/*.yaml; do
            test -f "$file" || continue
            cp "$file" ".github/workflows/$(basename "$file")"
          done
          node scripts/vor-064-locked-browser-runtime-contracts.mjs

      - name: Preserve exact workflow replacements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-064-workflow-replacements
          path: vor-064-workflow-output
          if-no-files-found: error
          retention-days: 7
