name: VOR-063 current-main refresh

on:
  push:
    branches:
      - agent/vor-063-current-main-refresh

permissions:
  contents: write

concurrency:
  group: vor-063-current-main-refresh
  cancel-in-progress: false

jobs:
  refresh-and-validate:
    name: Port VOR-063 onto exact current main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact refresh branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Verify refresh base
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "5a9c496fd1e2056d651cbff1a5a0da72818a2393" || {
            echo "Refresh workflow must start directly from protected current main." >&2
            exit 1
          }

      - name: Port only the reviewed VOR-063 files
        shell: bash
        run: |
          git fetch --no-tags origin agent/vor-063-verified-multi-site-context:refs/remotes/origin/agent/vor-063-verified-multi-site-context
          git show origin/agent/vor-063-verified-multi-site-context:src/lib/auth.tsx > src/lib/auth.tsx
          git show origin/agent/vor-063-verified-multi-site-context:src/lib/siteAccessContext.ts > src/lib/siteAccessContext.ts
          git show origin/agent/vor-063-verified-multi-site-context:scripts/vor-063-multi-site-context-tests.mjs > scripts/vor-063-multi-site-context-tests.mjs
          git show origin/agent/vor-063-verified-multi-site-context:scripts/vor-063-multi-site-context-contracts.mjs > scripts/vor-063-multi-site-context-contracts.mjs

      - name: Correct the single-row regression and strengthen its contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('src/lib/auth.tsx')
          auth = auth_path.read_text()
          old = '''              .order(
                          "created_at",
                          {
                            ascending:
                              true,
                          },
                        )
                        .limit(1)
                        .maybeSingle(),'''
          # The source uses 14-space indentation inside the fluent chain. Use a
          # whitespace-tolerant replacement rather than relying on that formatting.
          import re
          updated, count = re.subn(
              r'(\.order\(\s*"created_at",\s*\{\s*ascending:\s*true,?\s*\},\s*\))\s*\.limit\(1\)\s*\.maybeSingle\(\)',
              r'\1',
              auth,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected to remove exactly one VOR-063 site-access limiter, removed {count}.')
          auth_path.write_text(updated)

          contract_path = Path('scripts/vor-063-multi-site-context-contracts.mjs')
          contract_path.write_text('''import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport { spawnSync } from "node:child_process";\n\nconst auth = readFileSync("src/lib/auth.tsx", "utf8");\nconst helper = readFileSync("src/lib/siteAccessContext.ts", "utf8");\n\nfor (const required of [\n  'siteAccesses: readonly SiteAccessGrant<PilotRole>[]',\n  'selectSite: (siteId: string) => boolean',\n  'const accessRows = (accessResult.data ?? [])',\n  'chooseAuthorisedSiteGrant(',\n  'findAuthorisedSiteGrant(',\n  'selectedSiteStorageKey(nextUserId)',\n  'selectedSiteStorageKey(session.user.id)',\n  'setSiteAccesses([])',\n]) assert.ok(auth.includes(required), `VOR-063 missing auth contract: ${required}`);\n\nconst accessQueryStart = auth.indexOf('"user_site_access"');\nconst accessQueryEnd = auth.indexOf('const profileError = profileResult.error;', accessQueryStart);\nassert.ok(accessQueryStart >= 0 && accessQueryEnd > accessQueryStart, "VOR-063 site-access query could not be isolated");\nconst accessQuery = auth.slice(accessQueryStart, accessQueryEnd);\nassert.ok(!accessQuery.includes('.limit('), "VOR-063 must fetch every RLS-visible active site grant, not a limited subset");\nassert.ok(!accessQuery.includes('.maybeSingle()'), "VOR-063 user_site_access query must return an array of grants");\nassert.ok(!/service_role|SUPABASE_SERVICE_ROLE/.test(auth), "VOR-063 browser auth must not use privileged credentials");\nassert.ok(helper.includes("storedSiteId"));\nassert.ok(helper.includes("grant.isDefault"));\nassert.ok(helper.includes("grants[0]"));\n\nconst focused = spawnSync(process.execPath, ["scripts/vor-063-multi-site-context-tests.mjs"], { stdio: "inherit" });\nassert.equal(focused.status, 0, "VOR-063 focused selection tests failed");\n\nconsole.log("VOR-063 permanent contracts passed: complete RLS-visible grants, bounded selection and fail-closed clearing are retained.");\n''')

          suite_path = Path('scripts/run-contract-suite.mjs')
          suite = suite_path.read_text()
          registration = '  ["VOR-063 verified multi-site context", "scripts/vor-063-multi-site-context-contracts.mjs"],\n'
          if registration not in suite:
              anchor = '  ["VOR-062 site risk movement", "scripts/vor-062-site-risk-movement-contracts.mjs"],\n'
              if anchor not in suite:
                  raise SystemExit('Could not locate VOR-062 contract registration anchor.')
              suite = suite.replace(anchor, anchor + registration, 1)
              suite_path.write_text(suite)
          PY

      - name: Remove refresh workflow from the candidate tree
        run: rm .github/workflows/vor-063-refresh-current-main.yml

      - name: Verify exact five-file scope before tests
        shell: bash
        run: |
          expected=$(printf '%s\n' \
            scripts/run-contract-suite.mjs \
            scripts/vor-063-multi-site-context-contracts.mjs \
            scripts/vor-063-multi-site-context-tests.mjs \
            src/lib/auth.tsx \
            src/lib/siteAccessContext.ts | sort)
          actual=$(git diff --name-only | sort)
          printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Run focused VOR-063 contract
        run: node scripts/vor-063-multi-site-context-contracts.mjs

      - name: Run TypeScript
        run: npm run typecheck -- --pretty false

      - name: Run complete permanent contract suite
        run: npm run test:contracts

      - name: Run route smoke tests
        run: npm run test:smoke

      - name: Build production bundle without deployment
        run: |
          npm run build:metadata
          npx vite build
          node scripts/check-performance-budgets.mjs

      - name: Commit only after every gate passes
        shell: bash
        run: |
          git status --short
          git config user.name "Vorta Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/run-contract-suite.mjs \
            scripts/vor-063-multi-site-context-contracts.mjs \
            scripts/vor-063-multi-site-context-tests.mjs \
            src/lib/auth.tsx \
            src/lib/siteAccessContext.ts \
            .github/workflows/vor-063-refresh-current-main.yml
          git commit -m "VOR-063: refresh verified multi-site context on current main"
          git push origin HEAD:agent/vor-063-current-main-refresh
