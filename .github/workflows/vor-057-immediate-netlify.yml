name: VOR-057 immediate Netlify release

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vor-057-immediate-netlify-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 255 && contains(github.event.comment.body, '/deploy-vor-057'))
    name: Validate, push and verify current main
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VORTA_PRODUCTION_URL: https://vorta-app.netlify.app
      VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
      VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Run focused release regressions
        run: |
          node scripts/vor-049-equipment-fallback-regression-contracts.mjs
          node scripts/vor-066-active-conversation-viewport-contracts.mjs

      - name: Build exact production source
        run: npm run build

      - name: Check performance budgets
        run: npm run test:performance

      - name: Require authenticated verification secret
        shell: bash
        run: |
          test -n "$VORTA_E2E_PASSWORD" || {
            echo "VORTA_E2E_PASSWORD is not configured." >&2
            exit 1
          }

      - name: Push a real validated main commit for Netlify
        id: release
        shell: bash
        run: |
          git rm .github/workflows/vor-057-immediate-netlify.yml
          git config user.name "Vorta Immediate Release"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "VOR-057: deploy validated Ask Vorta production repair"
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact production commit
        env:
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            deployed_commit="$(curl --fail --silent --show-error \
              --header "Cache-Control: no-cache" \
              "${VORTA_PRODUCTION_URL}/vorta-build.json?vor057=${GITHUB_RUN_ID}-${attempt}" \
              | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { try { console.log(JSON.parse(input).commit || ""); } catch { console.log(""); } });' \
              || true)"
            echo "Production commit: ${deployed_commit:-unavailable}; expected: ${EXPECTED_COMMIT}"
            if [[ "$deployed_commit" == "$EXPECTED_COMMIT" ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "Production did not reach the exact validated main commit." >&2
          exit 1

      - name: Run exact vial-fill sensor production regression
        env:
          VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000
          VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 2
        shell: bash
        run: |
          set -o pipefail
          node scripts/ask-vorta-live-evals.mjs \
            tests/evals/vor-049-vial-fill-sensor-regression.json \
            2>&1 | tee vor-049-vial-fill-production.log

      - name: Run authenticated production browser regression
        env:
          VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
          VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
          VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-057-immediate-netlify-${{ steps.release.outputs.commit }}
          path: vor-049-vial-fill-production.log
          if-no-files-found: warn
          retention-days: 14
