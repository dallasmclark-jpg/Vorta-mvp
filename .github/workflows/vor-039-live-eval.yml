name: VOR-039 live preview evaluation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VORTA_EVAL_BASE_URL: https://deploy-preview-189--vorta-app.netlify.app
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vor-039-ask-vorta-confidence-latency

      - name: Check whether this is the deliberate final evaluation
        id: gate
        shell: bash
        run: |
          message="$(git log -1 --pretty=%B)"
          if [[ "$message" == *"[vor039-final-eval]"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping live evaluation for a non-evaluation commit."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Warm the Netlify preview function
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          curl --silent --show-error --max-time 20 \
            --request POST \
            --header 'content-type: application/json' \
            --data '{}' \
            "$VORTA_EVAL_BASE_URL/api/ask-vorta" >/dev/null || true
          sleep 5

      - name: Run VOR-039 live evaluation against Netlify preview
        if: steps.gate.outputs.run == 'true'
        run: npm run eval:ask-vorta:vor039
