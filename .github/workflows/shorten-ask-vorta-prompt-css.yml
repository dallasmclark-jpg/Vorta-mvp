name: Shorten Ask Vorta prompt CSS

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/shorten-ask-vorta-prompt-css.mjs"
      - ".github/workflows/shorten-ask-vorta-prompt-css.yml"

permissions:
  contents: write

concurrency:
  group: shorten-ask-vorta-prompt-css-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Apply semantic prompt hook
        run: node scripts/shorten-ask-vorta-prompt-css.mjs

      - name: Remove temporary scaffolding
        run: |
          rm scripts/shorten-ask-vorta-prompt-css.mjs
          rm .github/workflows/shorten-ask-vorta-prompt-css.yml

      - name: Verify diff formatting
        run: git diff --check

      - name: Commit semantic prompt hook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx \
            src/screens/AiOperations/mobilePortalHardening.css \
            scripts/shorten-ask-vorta-prompt-css.mjs \
            .github/workflows/shorten-ask-vorta-prompt-css.yml
          git commit -m "Shorten Ask Vorta prompt CSS"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
