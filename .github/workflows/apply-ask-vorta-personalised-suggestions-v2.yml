name: Apply Ask Vorta personalised suggestions v2

on:
  push:
    branches:
      - agent/ask-vorta-personalised-suggestions-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[personalised-prompts-v2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ask-vorta-personalised-suggestions-v2
          fetch-depth: 0
      - name: Apply focused product and test changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing pattern: {label}')
              return text.replace(old, new, 1)

          assistant_path = Path('src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx')
          assistant = assistant_path.read_text()
          import_block = '''import {
            AskVortaWorkspace,
            type AskVortaWorkspaceAnswer,
            type AskVortaWorkspaceMessage,
          } from "./AskVortaWorkspace";'''
          assistant = replace_once(
              assistant,
              import_block,
              import_block + '''
          import {
            buildPersonalisedAskVortaSuggestions,
            loadAskVortaInteractionHistory,
          } from "./askVortaPersonalSuggestions";''',
              'personal suggestion import',
          )
          assistant = replace_once(
              assistant,
              '  const { siteContext } = useAuth();\n  const agentContextReady = Boolean(siteContext?.siteId);',
              '''  const { session, siteContext } = useAuth();
            const agentContextReady = Boolean(siteContext?.siteId);
            const [suggestedQuestions, setSuggestedQuestions] = useState<string[]>(
              roleProfile.quickQuestions,
            );
            const suggestionHistoryRef = useRef<{
              key: string;
              history: Awaited<ReturnType<typeof loadAskVortaInteractionHistory>>;
            } | null>(null);''',
              'auth and suggestion state',
          )
          context_anchor = '''  }, [open, contextReloadKey]);

            const retryContextLoad ='''
          context_effect = '''  }, [open, contextReloadKey]);

            useEffect(() => {
              if (roleProfile.role !== "maintenance-manager") {
                setSuggestedQuestions(roleProfile.quickQuestions);
                return;
              }

              const userId = session?.user.id;
              const siteId = siteContext?.siteId;
              if (!open || !userId || !siteId) {
                if (!open) suggestionHistoryRef.current = null;
                setSuggestedQuestions(roleProfile.quickQuestions);
                return;
              }

              let cancelled = false;
              const loadSuggestions = async (): Promise<void> => {
                try {
                  const roleKey = agentRole(roleProfile.role);
                  const historyKey = `${userId}:${siteId}:${roleKey}`;
                  let history =
                    suggestionHistoryRef.current?.key === historyKey
                      ? suggestionHistoryRef.current.history
                      : null;
                  if (!history) {
                    history = await loadAskVortaInteractionHistory({
                      userId,
                      siteId,
                      role: roleKey,
                    });
                    suggestionHistoryRef.current = { key: historyKey, history };
                  }

                  const topEquipmentRiskScore = equipment.reduce<number | null>(
                    (highest, item) =>
                      highest === null ? item.riskScore : Math.max(highest, item.riskScore),
                    null,
                  );
                  const criticalShiftSkillGaps =
                    shiftSkillsContext?.gaps.filter((gap) => gap.riskLevel === "critical").length ?? 0;
                  const highShiftSkillGaps =
                    shiftSkillsContext?.gaps.filter((gap) => gap.riskLevel === "high").length ?? 0;
                  const ranked = buildPersonalisedAskVortaSuggestions({
                    history,
                    liveContext: {
                      siteRiskScore: siteRisk?.riskScore ?? null,
                      topEquipmentRiskScore,
                      criticalShiftSkillGaps,
                      highShiftSkillGaps,
                    },
                    fallbackQuestions: roleProfile.quickQuestions,
                  });
                  if (!cancelled) {
                    setSuggestedQuestions(ranked.map((item) => item.question));
                  }
                } catch (error) {
                  console.warn(
                    "Ask Vorta personalised suggestions unavailable; using role defaults.",
                    error,
                  );
                  if (!cancelled) setSuggestedQuestions(roleProfile.quickQuestions);
                }
              };

              void loadSuggestions();
              return () => {
                cancelled = true;
              };
            }, [
              open,
              session?.user.id,
              siteContext?.siteId,
              roleProfile,
              contextReady,
              siteRisk?.riskScore,
              equipment,
              shiftSkillsContext,
            ]);

            const retryContextLoad ='''
          assistant = replace_once(
              assistant,
              context_anchor,
              context_effect,
              'personal suggestion effect',
          )
          intro = '        recommendedActions: [roleProfile.defaultAction],'
          if assistant.count(intro) != 2:
              raise SystemExit('expected exactly two intro action defaults')
          assistant = assistant.replace(intro, '        recommendedActions: [],')
          assistant = replace_once(
              assistant,
              '        suggestedPrompts={roleProfile.quickQuestions}',
              '        suggestedPrompts={suggestedQuestions}',
              'workspace prompts',
          )
          assistant = replace_once(
              assistant,
              '{roleProfile.quickQuestions.map((question, questionIndex) => (',
              '{suggestedQuestions.map((question, questionIndex) => (',
              'compact prompts',
          )
          assistant = replace_once(
              assistant,
              'max-md:mb-0 max-md:flex-nowrap max-md:overflow-x-auto',
              'max-md:mb-0 max-md:flex-col max-md:gap-2',
              'vertical mobile prompts',
          )
          assistant = replace_once(
              assistant,
              'key={question}\n                  type="button"\n                  disabled={',
              'key={question}\n                  type="button"\n                  data-vorta-global-ai-prompt-button="true"\n                  disabled={',
              'prompt hook',
          )
          assistant = replace_once(
              assistant,
              'max-md:shrink-0 max-md:whitespace-nowrap',
              'max-md:w-full max-md:rounded-xl max-md:px-4 max-md:py-3 max-md:text-left max-md:whitespace-normal',
              'full-width mobile prompts',
          )
          assistant = replace_once(
              assistant,
              'questionIndex >= 3 ? "max-md:hidden" : ""',
              'questionIndex >= 2 ? "max-md:hidden" : ""',
              'two mobile prompts',
          )
          assistant_path.write_text(assistant)

          contracts_path = Path('scripts/vor-041-ask-vorta-workspace-contracts.mjs')
          contracts = contracts_path.read_text()
          contracts = replace_once(
              contracts,
              '''const mobileCss = readFileSync(
            "src/screens/AiOperations/mobilePortalHardening.css",
            "utf8",
          );''',
              '''const mobileCss = readFileSync(
            "src/screens/AiOperations/mobilePortalHardening.css",
            "utf8",
          );
          const personalisedSuggestions = readFileSync(
            "src/screens/AiOperations/askVortaPersonalSuggestions.ts",
            "utf8",
          );''',
              'personalised contract source',
          )
          contracts = replace_once(
              contracts,
              '''assert.match(
            assistant,
            /quickQuestions\\.map\\(\\(question, questionIndex\\)[\\s\\S]*questionIndex >= 3 \\? "max-md:hidden"/,
            "Phone Ask Vorta must show the first three suggested prompts only.",
          );''',
              '''assert.match(
            assistant,
            /suggestedQuestions\\.map\\(\\(question, questionIndex\\)[\\s\\S]*questionIndex >= 2 \\? "max-md:hidden"/,
            "Phone Ask Vorta must show exactly the first two ranked suggestions.",
          );
          assert.ok(
            assistant.includes("max-md:flex-col max-md:gap-2") &&
              assistant.includes('data-vorta-global-ai-prompt-button="true"'),
            "Phone suggestions must be vertically stacked full-width controls.",
          );
          assert.equal(
            (assistant.match(/recommendedActions: \\[\\],/g) ?? []).length >= 2,
            true,
            "The empty state must not show a synthetic Risk-reduction plan.",
          );
          assert.ok(
            personalisedSuggestions.includes('.from("ask_vorta_interactions")') &&
              personalisedSuggestions.includes('.eq("user_id", userId)') &&
              personalisedSuggestions.includes('.eq("site_id", siteId)') &&
              personalisedSuggestions.includes('.eq("role", role)') &&
              personalisedSuggestions.includes('.eq("status", "completed")'),
            "Personalised suggestions must reuse governed user/site interaction history.",
          );
          assert.ok(
            personalisedSuggestions.includes("MIN_PERSONALISATION_INTERACTIONS = 5") &&
              personalisedSuggestions.includes('source: "frequently-asked"') &&
              personalisedSuggestions.includes('source: "relevant-now"'),
            "Ranking must combine personal history and live-context relevance.",
          );''',
              'phone prompt contract',
          )
          contracts_path.write_text(contracts)

          spec_path = Path('tests/browser/vor-041-ask-vorta-workspace.spec.ts')
          spec = spec_path.read_text()
          spec = replace_once(
              spec,
              'workspace.getByRole("button", { name: "What are my highest site risks?", exact: true })',
              "workspace.locator('button').filter({ hasText: /risk|equipment|shift|work|spares/i }).first()",
              'desktop dynamic prompt check',
          )
          phone_start = spec.find('    for (const prompt of [')
          phone_after = spec.find('\n\n    const box = await panel.boundingBox();', phone_start)
          if phone_start < 0 or phone_after < 0:
              raise SystemExit('phone prompt browser markers missing')
          phone_new = '''    const visiblePrompts = panel.locator(
              '[data-vorta-global-ai-prompt-button="true"]:visible',
            );
            await expect(visiblePrompts).toHaveCount(2);
            const firstPromptBox = await visiblePrompts.nth(0).boundingBox();
            const secondPromptBox = await visiblePrompts.nth(1).boundingBox();
            expect(firstPromptBox).not.toBeNull();
            expect(secondPromptBox).not.toBeNull();
            expect(secondPromptBox?.y ?? 0).toBeGreaterThan(
              (firstPromptBox?.y ?? 0) + (firstPromptBox?.height ?? 0) - 1,
            );
            const promptRegion = page.locator('[data-vorta-global-ai-prompts="true"]');
            expect(
              await promptRegion.evaluate((element) => element.scrollWidth - element.clientWidth),
            ).toBeLessThanOrEqual(1);
            await expect(panel.getByText("Risk-reduction plan", { exact: true })).toHaveCount(0);'''
          spec = spec[:phone_start] + phone_new + spec[phone_after:]
          spec_path.write_text(spec)
          PY
      - name: Remove apply workflow and commit product changes
        run: |
          rm .github/workflows/apply-ask-vorta-personalised-suggestions-v2.yml
          git config user.name "Vorta implementation bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx src/screens/AiOperations/askVortaPersonalSuggestions.ts scripts/vor-041-ask-vorta-workspace-contracts.mjs tests/browser/vor-041-ask-vorta-workspace.spec.ts .github/workflows/apply-ask-vorta-personalised-suggestions-v2.yml
          git commit -m "VOR-041: personalise Ask Vorta suggestions [personalised-prompts-v2-applied]"
          git push origin HEAD:agent/ask-vorta-personalised-suggestions-v2
