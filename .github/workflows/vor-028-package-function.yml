name: Package VOR-028 function source

on:
  pull_request:
    paths:
      - .github/workflows/vor-028-package-function.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle and minify Shift Handover function
        run: |
          mkdir function-source
          npx esbuild supabase/functions/shift-handover-data/index.ts \
            --bundle \
            --minify \
            --format=esm \
            --platform=neutral \
            --external:jsr:* \
            --outfile=function-source/index.ts
      - uses: actions/upload-artifact@v4
        with:
          name: vor-028-shift-handover-function-minified
          path: function-source/index.ts
          if-no-files-found: error
