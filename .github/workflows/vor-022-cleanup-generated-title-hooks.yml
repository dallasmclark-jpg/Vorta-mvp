name: VOR-022 Cleanup Generated Title Hooks

on:
  push:
    branches:
      - refactor/vor-022-semantic-responsive-hooks
    paths:
      - scripts/cleanup-vor-022-unrelated-title-hooks.mjs
      - .github/workflows/vor-022-cleanup-generated-title-hooks.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'run unrelated title-hook cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/vor-022-semantic-responsive-hooks
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove unrelated generated hooks
        run: node scripts/cleanup-vor-022-unrelated-title-hooks.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "VOR-022: remove unrelated portal title hooks"
          git push origin HEAD:refactor/vor-022-semantic-responsive-hooks
