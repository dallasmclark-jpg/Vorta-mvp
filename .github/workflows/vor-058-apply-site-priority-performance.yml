name: Apply VOR-058 site-priority performance

# Applicator revision 3: handle the advanced daily release marker.
on:
  push:
    branches:
      - agent/vor-058-site-priority-performance
    paths:
      - ".github/workflows/vor-058-apply-site-priority-performance.yml"

permissions:
  contents: write

concurrency:
  group: vor-058-site-priority-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out VOR-058 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/vor-058-site-priority-performance
          fetch-depth: 0
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused VOR-058 source changes
        run: node scripts/vor-058-apply-site-priority-performance.mjs

      - name: Make the VOR-057 contract lifecycle-aware
        shell: bash
        run: |
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const path = "scripts/netlify-daily-deploy-contracts.mjs";
          const source = readFileSync(path, "utf8");
          const before = `assert.equal(marker.notBeforeDate, "2026-08-06");
          assert.equal(marker.releaseDate, null);
          assert.equal(marker.sourceCommit, null);`;
          const after = `assert.equal(marker.notBeforeDate, "2026-08-06");
          assert.ok(
            marker.releaseDate === null || /^\\d{4}-\\d{2}-\\d{2}$/.test(marker.releaseDate),
            "The release marker must be empty or carry one valid London calendar date",
          );
          assert.ok(
            marker.sourceCommit === null || /^[0-9a-f]{40}$/.test(marker.sourceCommit),
            "The release source must be empty or an exact Git commit",
          );
          if (marker.releaseDate !== null) {
            assert.ok(marker.sourceCommit, "A dated release requires an exact source commit");
            assert.ok(
              typeof marker.requestedAtUtc === "string" &&
                !Number.isNaN(Date.parse(marker.requestedAtUtc)),
              "A dated release requires a valid request timestamp",
            );
          }`;
          if (!source.includes(before)) {
            throw new Error("VOR-057 marker-state assertion anchor was not found");
          }
          writeFileSync(path, source.replace(before, after));
          NODE

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Run focused VOR-058 contracts
        run: node scripts/vor-058-site-priority-performance-contracts.mjs

      - name: Run strict TypeScript checks
        run: npm run typecheck -- --pretty false

      - name: Run complete permanent contract suite
        run: npm run test:contracts

      - name: Run route smoke tests
        run: npm run test:smoke

      - name: Build production bundle and enforce performance budgets
        run: npm run build

      - name: Check patch integrity
        run: git diff --check

      - name: Remove temporary application machinery
        run: |
          rm scripts/vor-058-apply-site-priority-performance.mjs
          rm .github/workflows/vor-058-apply-site-priority-performance.yml

      - name: Commit verified VOR-058 implementation
        run: |
          git config user.name "Vorta Ask Vorta Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "VOR-058: make site-priority answers deterministic [skip netlify]"
          git push origin HEAD:agent/vor-058-site-priority-performance
