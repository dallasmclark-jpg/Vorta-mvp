name: VOR-028 apply Shift Handover detail fixes

on:
  push:
    branches:
      - vor-028-shift-handover-detail-fixes

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused VOR-028 changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          transform_path = Path("supabase/functions/shift-handover-data/transform.ts")
          transform = transform_path.read_text()
          status_start = transform.index("function statusFor(")
          status_end = transform.index("\nfunction nextActionFor", status_start)
          status_logic = r'''function hasFinalCompletionEvidence(
            order: AnyRow,
            confirmations: AnyRow[],
          ): boolean {
            const hasFinalConfirmation = confirmations.some(
              (row) => Boolean(row.final_confirmation) && !Boolean(row.reversal),
            );
            const statusCodes = lowerJoined([
              order.system_status_codes,
              order.user_status_codes,
              order.status,
            ]);
            const hasExplicitClosureCode = /\b(teco|clsd)\b/.test(statusCodes);
            const orderStatus = text(order.status)
              .toLowerCase()
              .replace(/[_-]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();
            const hasExplicitClosedState = new Set([
              "complete",
              "completed",
              "closed",
              "technically complete",
              "technically completed",
              "business complete",
              "business completed",
            ]).has(orderStatus);
            const hasCompletionTimestamp = Boolean(
              order.technical_completion_at
              || order.business_completion_at
              || order.completed_at
              || order.completed_date
              || order.closed_at,
            );

            return hasFinalConfirmation
              || hasExplicitClosureCode
              || hasExplicitClosedState
              || hasCompletionTimestamp;
          }

          function statusFor(
            order: AnyRow,
            confirmations: AnyRow[],
            outstandingReservationCount: number,
          ): HandoverStatus {
            const latestText = confirmations[0]?.confirmation_text;
            const operationalEvidence = lowerJoined([
              order.status,
              order.outcome,
              order.system_status_codes,
              order.user_status_codes,
              order.assigned_engineer,
              order.main_work_center,
              latestText,
            ]);

            if (
              outstandingReservationCount > 0 ||
              /waiting parts|waiting on parts|parts required|material shortage|\bmspt\b|awaiting spare|awaiting material/.test(operationalEvidence)
            ) {
              return "waiting_on_parts";
            }
            if (/contractor|external|vendor|oem support|specialist/.test(operationalEvidence)) {
              return "external_contractor";
            }
            if (/waiting production|awaiting production|production access|line release|permit to work/.test(operationalEvidence)) {
              return "waiting_on_production";
            }
            if (/temporary|temporarily|temporary repair|running with restriction|restored pending/.test(operationalEvidence)) {
              return "temporarily_restored";
            }
            if (/monitor|observation|watching|trend/.test(operationalEvidence)) {
              return "monitoring";
            }
            if (/defer|deferred|postponed|shutdown scope/.test(operationalEvidence)) {
              return "deferred";
            }
            if (hasFinalCompletionEvidence(order, confirmations)) {
              return "completed";
            }
            return "ongoing";
          }
          '''
          transform = transform[:status_start] + status_logic + transform[status_end:]
          transform = replace_once(
              transform,
              'ongoing: items.filter((item) => item.status !== "completed").length,',
              'ongoing: items.filter((item) => item.status === "ongoing").length,',
              "edge summary ongoing count",
          )
          transform_path.write_text(transform)

          page_path = Path("src/screens/ShiftHandover/ShiftHandoverSection.tsx")
          page = page_path.read_text()
          page = replace_once(
              page,
              'ongoing: items.filter((item) => item.status !== "completed").length,',
              'ongoing: items.filter((item) => item.status === "ongoing").length,',
              "client summary ongoing count",
          )

          helper_anchor = "\nfunction MetricCard({"
          helper_index = page.index(helper_anchor)
          helpers = r'''
          function latestConfirmationSummary(item: ShiftHandoverItem): string {
            const latest = item.confirmations[0] ?? null;

            if (item.status === "completed") {
              return latest?.finalConfirmation
                ? "Work was completed and a final confirmation was posted. The recorded scope and completion details are shown below."
                : "The work order is recorded as completed or closed. The latest recorded confirmation is shown below.";
            }
            if (item.status === "waiting_on_parts") {
              return latest?.finalConfirmation
                ? "A final confirmation was posted, but outstanding material evidence keeps this item open for follow-up."
                : "The order remains open with outstanding material requirements. The latest confirmation is shown below.";
            }
            if (!latest) {
              return "No work confirmation has been posted. The order remains open for planned execution.";
            }
            if (item.status === "ongoing") {
              return "A partial confirmation was posted. The order remains open for planned execution.";
            }
            return `The work order is ${item.statusLabel.toLowerCase()}. The latest confirmation is shown below.`;
          }

          function formatConfirmationMeasure(value: number, unit: string | null): string | null {
            if (!Number.isFinite(value) || value <= 0) return null;
            const formatted = Number.isInteger(value) ? String(value) : value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
            return `${formatted} ${unit?.trim() || "hr"}`;
          }

          function confirmationMetadata(
            confirmation: ShiftHandoverItem["confirmations"][number],
          ): string[] {
            return [
              confirmation.finalConfirmation ? "Final confirmation" : "Partial confirmation",
              confirmation.workCenter ? `Work centre ${confirmation.workCenter}` : null,
              formatConfirmationMeasure(confirmation.actualWork, confirmation.workUnit),
              confirmation.actualDuration > 0
                ? `Duration ${formatConfirmationMeasure(confirmation.actualDuration, confirmation.durationUnit)}`
                : null,
            ].filter((value): value is string => Boolean(value));
          }
          '''
          page = page[:helper_index] + "\n" + helpers.strip("\n") + page[helper_index:]

          card_start = page.index("function HandoverCard(")
          card_end = page.index("\nfunction DetailSection", card_start)
          card = page[card_start:card_end]
          card = replace_once(
              card,
              '<span className={`rounded-md border px-2 py-1 text-xs font-semibold ${tone.badge}`}>',
              '<span\n          data-vorta-shift-handover-card-status={item.status}\n          className={`rounded-md border px-2 py-1 text-xs font-semibold ${tone.badge}`}\n        >',
              "activity card status marker",
          )
          page = page[:card_start] + card + page[card_end:]

          detail_start = page.index("function HandoverDetail(")
          detail_end = page.index("\nexport function ShiftHandoverSection", detail_start)
          detail = page[detail_start:detail_end]
          detail = replace_once(
              detail,
              "  const navigate = useNavigate();\n  const tone = STATUS_TONE[item.status];\n",
              "  const navigate = useNavigate();\n  const tone = STATUS_TONE[item.status];\n  const latestConfirmation = item.confirmations[0] ?? null;\n  const latestConfirmationNote = latestConfirmation?.text || item.latestConfirmationText;\n",
              "detail confirmation state",
          )
          detail = replace_once(
              detail,
              '<div className="min-w-0">\n          <div className="flex flex-wrap items-center gap-2">',
              '<div className="min-w-0 flex-1">\n          <div className="flex flex-wrap items-center gap-2">',
              "detail heading width",
          )
          detail = replace_once(
              detail,
              '<span className={`rounded-md border px-2 py-1 text-xs font-semibold ${tone.badge}`}>\n              {item.statusLabel}\n            </span>',
              '<span\n              data-vorta-shift-handover-detail-status={item.status}\n              className={`rounded-md border px-2 py-1 text-xs font-semibold ${tone.badge}`}\n            >\n              {item.statusLabel}\n            </span>',
              "detail status marker",
          )
          detail = replace_once(
              detail,
              '<h2 className="mt-3 text-xl font-semibold text-slate-50">{item.equipmentName}</h2>',
              '<h2 className="mt-3 break-words text-xl font-semibold text-slate-50 [overflow-wrap:anywhere]">{item.equipmentName}</h2>',
              "detail equipment wrapping",
          )
          detail = replace_once(
              detail,
              '<div className="min-h-0 flex-1 space-y-5 overflow-y-auto px-5 py-5">',
              '<div className="min-h-0 min-w-0 flex-1 space-y-5 overflow-x-hidden overflow-y-auto px-5 py-5">',
              "detail body overflow",
          )

          old_location = '''        <DetailSection title="Location">
                    <div className="space-y-2 text-sm text-slate-300">
                      <p className="flex items-start gap-2"><Building2 className="mt-0.5 h-4 w-4 shrink-0 text-slate-500" />{item.building}</p>
                      <p className="flex items-start gap-2"><MapPin className="mt-0.5 h-4 w-4 shrink-0 text-slate-500" />{item.area}{item.line ? ` · ${item.line}` : ""}</p>
                      <p className="flex items-start gap-2"><Gauge className="mt-0.5 h-4 w-4 shrink-0 text-slate-500" />{item.functionalLocation ?? "Functional location not supplied"}</p>
                    </div>
                  </DetailSection>'''
          new_location = '''        <DetailSection title="Location">
                    <dl className="space-y-3 text-sm" data-vorta-shift-handover-location="true">
                      <div className="flex min-w-0 items-start gap-3 rounded-lg border border-gray-800 bg-[#10151d] px-3 py-2.5">
                        <Building2 className="mt-0.5 h-4 w-4 shrink-0 text-slate-500" aria-hidden="true" />
                        <div className="min-w-0">
                          <dt className="text-xs text-slate-600">Building</dt>
                          <dd className="mt-1 break-words font-medium text-slate-300 [overflow-wrap:anywhere]">{item.building}</dd>
                        </div>
                      </div>
                      <div className="flex min-w-0 items-start gap-3 rounded-lg border border-gray-800 bg-[#10151d] px-3 py-2.5">
                        <MapPin className="mt-0.5 h-4 w-4 shrink-0 text-slate-500" aria-hidden="true" />
                        <div className="min-w-0">
                          <dt className="text-xs text-slate-600">Area</dt>
                          <dd className="mt-1 break-words font-medium text-slate-300 [overflow-wrap:anywhere]">{item.area}{item.line ? ` · ${item.line}` : ""}</dd>
                        </div>
                      </div>
                      <div className="flex min-w-0 items-start gap-3 rounded-lg border border-gray-800 bg-[#10151d] px-3 py-2.5">
                        <Gauge className={`mt-0.5 h-4 w-4 shrink-0 ${item.functionalLocation ? "text-slate-500" : "text-slate-600"}`} aria-hidden="true" />
                        <div className="min-w-0">
                          <dt className="text-xs text-slate-600">Functional location</dt>
                          <dd
                            data-vorta-shift-handover-functional-location={item.functionalLocation ? "supplied" : "unavailable"}
                            className={`mt-1 break-words [overflow-wrap:anywhere] ${item.functionalLocation ? "font-medium text-slate-300" : "text-slate-500"}`}
                          >
                            {item.functionalLocation ?? "Functional location not supplied"}
                          </dd>
                        </div>
                      </div>
                      <div className="flex min-w-0 items-start gap-3 rounded-lg border border-gray-800 bg-[#10151d] px-3 py-2.5">
                        <Wrench className="mt-0.5 h-4 w-4 shrink-0 text-slate-500" aria-hidden="true" />
                        <div className="min-w-0">
                          <dt className="text-xs text-slate-600">Equipment</dt>
                          <dd className="mt-1 break-words font-medium text-slate-300 [overflow-wrap:anywhere]">
                            {item.equipmentName}{item.equipmentCode ? ` · ${item.equipmentCode}` : ""}
                          </dd>
                        </div>
                      </div>
                    </dl>
                  </DetailSection>'''
          detail = replace_once(detail, old_location, new_location, "location hierarchy")

          old_latest = '''        <DetailSection title="Latest confirmation">
                    {item.latestConfirmationText ? (
                      <div className="rounded-xl border border-gray-800 bg-[#10151d] p-4">
                        <p className="text-sm leading-6 text-slate-300">{item.latestConfirmationText}</p>
                        <p className="mt-3 text-xs text-slate-600">
                          {item.confirmations[0]?.confirmedBy ?? "Unknown engineer"} · {formatTimestamp(item.confirmations[0]?.timestamp ?? null)}
                        </p>
                      </div>
                    ) : (
                      <p className="text-sm text-slate-500">No confirmation text was supplied for this shift.</p>
                    )}
                  </DetailSection>'''
          new_latest = '''        <DetailSection title="Latest confirmation">
                    <div
                      className="min-w-0 rounded-xl border border-gray-800 bg-[#10151d] p-4 sm:p-5"
                      data-vorta-shift-handover-latest-confirmation="true"
                    >
                      <p
                        className="break-words text-sm leading-6 text-slate-300 [overflow-wrap:anywhere]"
                        data-vorta-shift-handover-confirmation-summary="true"
                      >
                        {latestConfirmationSummary(item)}
                      </p>
                      {latestConfirmationNote ? (
                        <div className="mt-4 border-t border-gray-800 pt-4">
                          <p className="whitespace-pre-wrap break-words text-sm leading-6 text-slate-400 [overflow-wrap:anywhere]">
                            {latestConfirmationNote}
                          </p>
                        </div>
                      ) : null}
                      {latestConfirmation ? (
                        <div className="mt-4 grid min-w-0 gap-1 text-xs text-slate-600 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-start sm:gap-3">
                          <span className="min-w-0 break-words [overflow-wrap:anywhere]">{latestConfirmation.confirmedBy ?? "Unknown engineer"}</span>
                          <time className="whitespace-nowrap" dateTime={latestConfirmation.timestamp ?? undefined}>{formatTimestamp(latestConfirmation.timestamp)}</time>
                        </div>
                      ) : null}
                    </div>
                  </DetailSection>'''
          detail = replace_once(detail, old_latest, new_latest, "latest confirmation")

          old_history = '''        <DetailSection title={`Confirmation history (${item.confirmations.length})`}>
                    <div className="space-y-3">
                      {item.confirmations.map((confirmation) => (
                        <article key={confirmation.id} className="rounded-xl border border-gray-800 bg-[#10151d] p-4">
                          <div className="flex items-center justify-between gap-3 text-xs text-slate-500">
                            <span>{confirmation.confirmedBy ?? "Unknown engineer"}</span>
                            <span>{formatTimestamp(confirmation.timestamp)}</span>
                          </div>
                          <p className="mt-2 text-sm leading-6 text-slate-300">{confirmation.text || "No confirmation text"}</p>
                        </article>
                      ))}
                    </div>
                  </DetailSection>'''
          new_history = '''        <DetailSection title={`Confirmation history (${item.confirmations.length})`}>
                    {item.confirmations.length > 0 ? (
                      <div className="space-y-3">
                        {item.confirmations.map((confirmation) => {
                          const metadata = confirmationMetadata(confirmation);
                          return (
                            <article
                              key={confirmation.id}
                              className="min-w-0 rounded-xl border border-gray-800 bg-[#10151d] p-4 sm:p-5"
                              data-vorta-shift-handover-confirmation-history-item="true"
                            >
                              <header className="grid min-w-0 gap-1 text-xs text-slate-500 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-start sm:gap-3">
                                <span className="min-w-0 break-words font-medium text-slate-300 [overflow-wrap:anywhere]">
                                  {confirmation.confirmedBy ?? "Unknown engineer"}
                                </span>
                                <time className="whitespace-nowrap" dateTime={confirmation.timestamp ?? undefined}>
                                  {formatTimestamp(confirmation.timestamp)}
                                </time>
                              </header>
                              {metadata.length > 0 ? (
                                <div
                                  className="mt-3 flex min-w-0 flex-wrap gap-2"
                                  data-vorta-shift-handover-confirmation-metadata="true"
                                >
                                  {metadata.map((entry) => (
                                    <span key={entry} className="max-w-full break-words rounded-md border border-gray-700 bg-[#0d1117] px-2 py-1 text-xs text-slate-400 [overflow-wrap:anywhere]">
                                      {entry}
                                    </span>
                                  ))}
                                </div>
                              ) : null}
                              <p
                                className="mt-4 whitespace-pre-wrap break-words border-t border-gray-800 pt-4 text-sm leading-6 text-slate-300 [overflow-wrap:anywhere]"
                                data-vorta-shift-handover-confirmation-body="true"
                              >
                                {confirmation.text || "No confirmation text was supplied."}
                              </p>
                            </article>
                          );
                        })}
                      </div>
                    ) : (
                      <p className="text-sm text-slate-500">No confirmations have been posted against this work order.</p>
                    )}
                  </DetailSection>'''
          detail = replace_once(detail, old_history, new_history, "confirmation history")
          page = page[:detail_start] + detail + page[detail_end:]
          page_path.write_text(page)

          contract_path = Path("scripts/shift-handover-contracts.mjs")
          contract = contract_path.read_text()
          contract = replace_once(
              contract,
              'import { readFileSync } from "node:fs";\n',
              'import { readFileSync } from "node:fs";\nimport { transform as transpile } from "esbuild";\n',
              "contract esbuild import",
          )
          fixture_anchor = 'const browser = read("tests/browser/maintenance-manager-shift-handover.spec.ts");\n'
          fixture_code = r'''

          const compiledTransform = await transpile(transform, {
            loader: "ts",
            format: "esm",
            target: "es2022",
          });
          const transformModule = await import(
            `data:text/javascript;base64,${Buffer.from(compiledTransform.code).toString("base64")}`
          );
          const buildPayload = transformModule.buildShiftHandoverPayload;
          const baseOrder = (id, overrides = {}) => ({
            id,
            wo_number: `WO-${id}`,
            description: `Work order ${id}`,
            work_type: "PM01",
            priority: "2",
            status: "REL",
            system_status_codes: ["REL"],
            user_status_codes: [],
            equipment_id: "eq-1",
            assigned_engineer: "Engineer One",
            main_work_center: "MECH",
            updated_at: "2026-07-30T08:00:00Z",
            ...overrides,
          });
          const confirmation = (id, workOrderId, overrides = {}) => ({
            id,
            work_order_id: workOrderId,
            confirmation_timestamp: "2026-07-30T09:00:00Z",
            confirmation_text: "Inspection completed. The order remains open for planned execution.",
            confirmed_by: "Engineer With A Deliberately Long Name",
            work_center: "MECH",
            actual_work: 0.25,
            work_unit: "HR",
            final_confirmation: false,
            reversal: false,
            ...overrides,
          });
          const longNote = "Long confirmation note ".repeat(40).trim();
          const fixturePayload = buildPayload({
            site: { id: "site-1", name: "Test Site", timezone: "Europe/London" },
            window: {
              start: "2026-07-29T18:00:00Z",
              end: "2026-07-30T10:00:00Z",
              label: "Test window",
              mode: "latest",
            },
            workOrders: [
              baseOrder("partial"),
              baseOrder("final"),
              baseOrder("teco", { system_status_codes: ["REL", "TECO"] }),
              baseOrder("waiting"),
              baseOrder("none"),
              baseOrder("multiple"),
            ],
            confirmations: [
              confirmation("c-partial", "partial"),
              confirmation("c-final", "final", {
                confirmation_text: "Work completed and returned to service.",
                final_confirmation: true,
              }),
              confirmation("c-waiting", "waiting", {
                confirmation_text: "Partial work completed; replacement seal is still required.",
              }),
              confirmation("c-multiple-new", "multiple", {
                confirmation_timestamp: "2026-07-30T09:30:00Z",
                confirmation_text: longNote,
              }),
              confirmation("c-multiple-old", "multiple", {
                confirmation_timestamp: "2026-07-30T07:30:00Z",
                confirmation_text: "Earlier inspection note.",
              }),
            ],
            equipment: [{
              id: "eq-1",
              name: "Equipment With A Deliberately Long Operational Name",
              equipment_code: "EQ-001",
              area: "Fill Finish",
              line: "Line One",
              criticality: "high",
            }],
            departments: [],
            movements: [],
            reservations: [{
              id: "r-waiting",
              work_order_id: "waiting",
              material_number: "MAT-001",
              required_quantity: 1,
              withdrawn_quantity: 0,
              final_issue: false,
              base_unit: "EA",
              reservation_status: "Open",
            }],
          });
          const fixtureById = new Map(fixturePayload.items.map((item) => [item.id, item]));
          const statusFixtureChecks = [
            [fixtureById.get("partial")?.status === "ongoing", "Generic words such as completed in a partial confirmation must not complete an open work order."],
            [fixtureById.get("final")?.status === "completed", "A genuine final confirmation must complete the work order."],
            [fixtureById.get("teco")?.status === "completed", "An explicit TECO closure code must complete the work order."],
            [fixtureById.get("waiting")?.status === "waiting_on_parts", "Outstanding material evidence must retain Waiting on parts precedence."],
            [fixtureById.get("none")?.status === "ongoing", "An open work order with no confirmations must remain ongoing."],
            [fixtureById.get("multiple")?.confirmations.length === 2 && fixtureById.get("multiple")?.confirmations[0]?.text === longNote, "Multiple confirmations and long notes must remain complete and newest-first."],
            [fixturePayload.summary.completed === 2, "Completed summary count must include only genuinely completed records."],
            [fixturePayload.summary.ongoing === 3, "Ongoing summary count must include only normalised ongoing records."],
            [fixturePayload.summary.waitingOnParts === 1, "Waiting-parts summary count must match the normalised activity status."],
          ];
          '''
          contract = replace_once(contract, fixture_anchor, fixture_anchor + fixture_code, "status fixtures")
          contract = replace_once(
              contract,
              '  [transform.includes("waiting_on_parts") && transform.includes("external_contractor") && transform.includes("temporarily_restored"), "Normalised handover statuses are incomplete."],',
              '  [transform.includes("waiting_on_parts") && transform.includes("external_contractor") && transform.includes("temporarily_restored"), "Normalised handover statuses are incomplete."],\n  [transform.includes("hasFinalCompletionEvidence") && transform.includes("hasExplicitClosureCode"), "Completion must be derived from explicit SAP closure evidence rather than generic confirmation prose."],\n  [page.includes("data-vorta-shift-handover-card-status") && page.includes("data-vorta-shift-handover-detail-status"), "List and detail statuses need a shared normalised-state contract."],\n  [page.includes("latestConfirmationSummary") && page.includes("data-vorta-shift-handover-confirmation-summary"), "Latest confirmation wording must be state-aware."],\n  [page.includes("data-vorta-shift-handover-confirmation-history-item") && page.includes("whitespace-pre-wrap") && page.includes("[overflow-wrap:anywhere]"), "Confirmation history must expand and wrap without clipping or overlap."],\n  [page.includes("data-vorta-shift-handover-functional-location") && page.includes(">Equipment</dt>"), "The neutral location hierarchy must include functional location and equipment."],\n  ...statusFixtureChecks,',
              "VOR-028 contract assertions",
          )
          contract = contract.replace(
              'console.log("✓ Shift Handover review periods, four-card summary, relevant-area rail and responsive state verified.");',
              'console.log("✓ Shift Handover review periods, status truth, confirmation detail layout and responsive state verified.");',
          )
          contract_path.write_text(contract)

          browser_path = Path("tests/browser/maintenance-manager-shift-handover.spec.ts")
          browser = browser_path.read_text()
          detail_old = '''  await expect(cards.first()).toBeVisible();
            await cards.first().click();
            if (viewportWidth < 1280) {
              const detailDialog = page.getByRole("dialog", { name: "Detail panel" });
              await expect(detailDialog).toBeVisible();
              await expect(detailDialog.locator('[data-vorta-shift-handover-detail="true"]')).toBeVisible();
              await expect(detailDialog.getByText("Incoming shift action", { exact: true })).toBeVisible();
              await expect(detailDialog.getByRole("button", { name: "Open equipment work orders" })).toBeVisible();
              await detailDialog.getByRole("button", { name: "Close", exact: true }).click();
              await expect(detailDialog).toBeHidden();
            } else {
              await expect(page.locator('aside [data-vorta-shift-handover-detail="true"]')).toBeVisible();
              await expect(page.getByText("Incoming shift action", { exact: true })).toBeVisible();
            }
          '''
          detail_new = '''  await expect(cards.first()).toBeVisible();
            const visibleStatuses = await cards.evaluateAll((nodes) => nodes.map((node) =>
              node.querySelector<HTMLElement>("[data-vorta-shift-handover-card-status]")?.dataset.vortaShiftHandoverCardStatus ?? "",
            ));
            const completedCount = visibleStatuses.filter((status) => status === "completed").length;
            const ongoingCount = visibleStatuses.filter((status) => status === "ongoing").length;
            const waitingCount = visibleStatuses.filter((status) => status === "waiting_on_parts").length;
            await expect(page.locator('[data-vorta-shift-handover-metric="completed"] > p').first()).toHaveText(String(completedCount));
            await expect(page.locator('[data-vorta-shift-handover-metric="ongoing"] > p').first()).toHaveText(String(ongoingCount));
            await expect(page.locator('[data-vorta-shift-handover-metric="waiting-parts"] > p').first()).toHaveText(String(waitingCount));

            const selectedCardStatus = await cards.first().locator("[data-vorta-shift-handover-card-status]").getAttribute("data-vorta-shift-handover-card-status");
            await cards.first().click();
            const detailPanel = viewportWidth < 1280
              ? page.getByRole("dialog", { name: "Detail panel" })
              : page.locator('aside [data-vorta-shift-handover-detail="true"]').first();
            await expect(detailPanel).toBeVisible();
            await expect(detailPanel.locator('[data-vorta-shift-handover-detail="true"]')).toBeVisible();
            await expect(detailPanel.getByText("Incoming shift action", { exact: true })).toBeVisible();
            await expect(detailPanel.getByRole("button", { name: "Open equipment work orders" })).toBeVisible();
            await expect(detailPanel.locator("[data-vorta-shift-handover-detail-status]")).toHaveAttribute(
              "data-vorta-shift-handover-detail-status",
              selectedCardStatus ?? "",
            );
            const detailStatus = await detailPanel.locator("[data-vorta-shift-handover-detail-status]").getAttribute("data-vorta-shift-handover-detail-status");
            const summaryText = (await detailPanel.locator("[data-vorta-shift-handover-confirmation-summary]").textContent())?.toLowerCase() ?? "";
            if (detailStatus === "completed") {
              expect(summaryText).not.toContain("remains open");
            }
            const historyItems = detailPanel.locator("[data-vorta-shift-handover-confirmation-history-item]");
            for (let index = 0; index < await historyItems.count(); index += 1) {
              const historyItem = historyItems.nth(index);
              await expect(historyItem.locator("[data-vorta-shift-handover-confirmation-body]")).toHaveCount(1);
              expect(await historyItem.evaluate((element) => element.scrollWidth <= element.clientWidth + 1)).toBe(true);
            }
            await expect(detailPanel.locator('[data-vorta-shift-handover-location="true"]')).toBeVisible();
            if (viewportWidth < 1280) {
              await detailPanel.getByRole("button", { name: "Close", exact: true }).click();
              await expect(detailPanel).toBeHidden();
            }
          '''
          browser = replace_once(browser, detail_old, detail_new, "responsive detail browser test")
          browser_path.write_text(browser)
