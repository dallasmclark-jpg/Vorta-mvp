name: VOR-087 remove obsolete mobile answer trimming

on:
  push:
    branches:
      - agent/vor-087-universal-ask-vorta-disclosure

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[vor-087-trim-removed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/vor-087-universal-ask-vorta-disclosure
          fetch-depth: 0

      - name: Remove legacy positional answer trimming and redundant override
        shell: python
        run: |
          from pathlib import Path

          css_path = Path("src/screens/AiOperations/mobilePortalHardening.css")
          css = css_path.read_text()
          start = css.index("  /* Mobile answers show the direct answer and one useful next action, not the entire audit trail by default. */")
          end = css.index("  /* Replace the oversized introduction card with a simple ChatGPT-style welcome. */", start)
          css = css[:start] + css[end:]

          override = '''\n@media (max-width: 639px) {\n  /* VOR-087 universal progressive decision visibility: explicit semantic hook overrides the legacy positional answer trimming above. */\n  [data-vorta-global-ai-panel="true"] .justify-start > div > div.flex.flex-col.gap-2 > div[data-vorta-ai-progressive-decision="true"] {\n    display: block !important;\n    margin-top: 0.5rem !important;\n  }\n}\n'''
          if override not in css:
              raise SystemExit("Expected VOR-087 mobile override not found")
          css = css.replace(override, "\n", 1)
          css_path.write_text(css)

          contract_path = Path("scripts/vor-087-universal-disclosure-contracts.mjs")
          contract = contract_path.read_text()
          contract = contract.replace(
              'const mobileCss = read("src/screens/AiOperations/mobilePortalHardening.css");\n',
              'const mobileCss = read("src/screens/AiOperations/mobilePortalHardening.css");\n',
              1,
          )
          old = '''assert.ok(\n  mobileCss.includes('div[data-vorta-ai-progressive-decision="true"]') &&\n    mobileCss.includes("VOR-087 universal progressive decision visibility") &&\n    mobileCss.includes("display: block !important"),\n  "Phone Ask Vorta must explicitly keep the semantic progressive decision block visible instead of relying on legacy positional trimming",\n);'''
          new = '''assert.doesNotMatch(\n  mobileCss,\n  /div\\.flex\\.flex-col\\.gap-2 > div:nth-of-type\\(1\\)[\\s\\S]*?div:nth-of-type\\(n\\+4\\)/,\n  "Phone Ask Vorta must not use the retired positional answer trimming that can hide semantic progressive sections",\n);'''
          if old not in contract:
              raise SystemExit("Expected VOR-087 mobile visibility contract not found")
          contract_path.write_text(contract.replace(old, new, 1))

      - name: Verify source, TypeScript, contracts and production build
        run: |
          npm ci --silent
          npm run typecheck -- --pretty false
          npm run test:contracts
          npm run test:smoke
          npm run build
          git diff --check

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "dallasmclark-jpg"
          git config user.email "dallasmclark@gmail.com"
          git add src/screens/AiOperations/mobilePortalHardening.css scripts/vor-087-universal-disclosure-contracts.mjs
          git diff --cached --quiet && exit 0
          git commit -m "VOR-087 retire positional mobile answer trimming [vor-087-trim-removed]"
          git push origin HEAD:agent/vor-087-universal-ask-vorta-disclosure
