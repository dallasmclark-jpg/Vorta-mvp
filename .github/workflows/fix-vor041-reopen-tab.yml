name: Fix VOR-041 reopen tab

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/fix-vor041-reopen-tab.mjs"
      - ".github/workflows/fix-vor041-reopen-tab.yml"

permissions:
  contents: write

concurrency:
  group: fix-vor041-reopen-tab-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Apply reopen-tab test fix
        run: node scripts/fix-vor041-reopen-tab.mjs

      - name: Remove temporary scaffolding
        run: |
          rm scripts/fix-vor041-reopen-tab.mjs
          rm .github/workflows/fix-vor041-reopen-tab.yml

      - name: Verify diff formatting
        run: git diff --check

      - name: Commit reopen-tab test fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/browser/vor-041-ask-vorta-workspace.spec.ts \
            scripts/fix-vor041-reopen-tab.mjs \
            .github/workflows/fix-vor041-reopen-tab.yml
          git commit -m "Align Ask Vorta reopen tab test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
