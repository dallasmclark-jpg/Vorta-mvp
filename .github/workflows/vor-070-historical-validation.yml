name: VOR-070 Historical Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/screens/HistoricalValidation/**"
      - "src/screens/AiOperations/AiOperations.tsx"
      - "scripts/vor-070-historical-validation-contracts.mjs"
      - "scripts/run-contract-suite.mjs"
      - "tests/browser/maintenance-manager-historical-validation.spec.ts"
      - "playwright.config.ts"
      - ".github/workflows/vor-070-historical-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/screens/HistoricalValidation/**"
      - "src/screens/AiOperations/AiOperations.tsx"
      - "scripts/vor-070-historical-validation-contracts.mjs"
      - "scripts/run-contract-suite.mjs"
      - "tests/browser/maintenance-manager-historical-validation.spec.ts"
      - "playwright.config.ts"
      - ".github/workflows/vor-070-historical-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-validation:
    name: VOR-070 Historical Validation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000001

    steps:
      - name: Check out tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Run focused VOR-070 contract
        run: node scripts/vor-070-historical-validation-contracts.mjs

      - name: Run Maintenance Manager TypeScript
        run: npm run typecheck -- --pretty false

      - name: Create production build
        run: npx vite build

      - name: Verify authenticated browser-test secret
        shell: bash
        run: |
          test -n "$VORTA_E2E_PASSWORD" || {
            echo "VORTA_E2E_PASSWORD is not configured." >&2
            exit 1
          }

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Site and Area historical evidence on all target layouts
        run: |
          npx playwright test \
            tests/browser/maintenance-manager-historical-validation.spec.ts \
            --project=phone-360 \
            --project=samsung-tablet-portrait \
            --project=samsung-tablet-landscape \
            --project=desktop-1920 \
            --config=playwright.config.ts
