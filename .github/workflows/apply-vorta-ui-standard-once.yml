name: Apply Vorta UI standard once

on:
  push:
    paths:
      - .github/workflows/apply-vorta-ui-standard-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Vorta select and bottom navigation standards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          rota_path = Path('src/screens/EngineerPortal/EngineerRotaScreen.tsx')
          rota = rota_path.read_text()
          import_anchor = 'import { Link } from "react-router-dom";\n'
          vorta_import = 'import { VortaSelect } from "../../components/VortaSelect";\n'
          if vorta_import not in rota:
              rota = rota.replace(import_anchor, import_anchor + vorta_import, 1)

          old_selects = '''          <div className="grid grid-cols-2 gap-2.5">
            <label className="text-[10px] font-semibold uppercase tracking-[0.1em] text-slate-500">
              Type
              <select
                value={entryType}
                onChange={(event) =>
                  setEntryType(event.target.value as EngineerCalendarEntryType)
                }
                className="mt-1.5 h-11 w-full rounded-xl border border-slate-700/80 bg-[#030c1d] px-3 text-xs font-medium text-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
              >
                <option value="note">Note</option>
                <option value="training">Training</option>
                <option value="overtime">Overtime</option>
                <option value="annual_leave">Annual leave</option>
                <option value="appointment">Appointment</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label className="text-[10px] font-semibold uppercase tracking-[0.1em] text-slate-500">
              Status
              <select
                value={status}
                onChange={(event) =>
                  setStatus(event.target.value as EngineerCalendarEntryStatus)
                }
                className="mt-1.5 h-11 w-full rounded-xl border border-slate-700/80 bg-[#030c1d] px-3 text-xs font-medium text-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
              >
                <option value="planned">Planned</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </label>
          </div>'''

          new_selects = '''          <div className="grid grid-cols-2 gap-2.5">
            <div className="min-w-0">
              <label className="sr-only">
                Type
                <select
                  value={entryType}
                  onChange={(event) =>
                    setEntryType(event.target.value as EngineerCalendarEntryType)
                  }
                  tabIndex={-1}
                  aria-hidden="true"
                >
                  <option value="note">Note</option>
                  <option value="training">Training</option>
                  <option value="overtime">Overtime</option>
                  <option value="annual_leave">Annual leave</option>
                  <option value="appointment">Appointment</option>
                  <option value="other">Other</option>
                  <option value="shift_cover">Shift cover</option>
                  <option value="development">Development</option>
                </select>
              </label>
              <VortaSelect<EngineerCalendarEntryType>
                label="Type"
                value={entryType}
                options={[
                  { value: "note", label: "Note" },
                  { value: "training", label: "Training" },
                  { value: "overtime", label: "Overtime" },
                  { value: "annual_leave", label: "Annual leave" },
                  { value: "appointment", label: "Appointment" },
                  { value: "other", label: "Other" },
                  { value: "shift_cover", label: "Shift cover" },
                  { value: "development", label: "Development" },
                ]}
                onChange={setEntryType}
              />
            </div>
            <div className="min-w-0">
              <label className="sr-only">
                Status
                <select
                  value={status}
                  onChange={(event) =>
                    setStatus(event.target.value as EngineerCalendarEntryStatus)
                  }
                  tabIndex={-1}
                  aria-hidden="true"
                >
                  <option value="planned">Planned</option>
                  <option value="completed">Completed</option>
                  <option value="cancelled">Cancelled</option>
                </select>
              </label>
              <VortaSelect<EngineerCalendarEntryStatus>
                label="Status"
                value={status}
                options={[
                  { value: "planned", label: "Planned" },
                  { value: "completed", label: "Completed" },
                  { value: "cancelled", label: "Cancelled" },
                ]}
                onChange={setStatus}
              />
            </div>
          </div>'''

          if old_selects not in rota:
              raise SystemExit('Could not find Engineer rota native select block')
          rota = rota.replace(old_selects, new_selects, 1)
          rota_path.write_text(rota)

          portal_path = Path('src/screens/EngineerPortal/EngineerPortal.tsx')
          portal = portal_path.read_text()
          portal = portal.replace('import { EngineerBottomNavStyles } from "./EngineerBottomNavStyles";\n', '')
          portal = portal.replace('import { EngineerVortaSelectBridge } from "./EngineerVortaSelectBridge";\n', '')
          portal = portal.replace('      <EngineerBottomNavStyles />\n', '')
          portal = portal.replace('      <EngineerVortaSelectBridge />\n', '')
          portal_path.write_text(portal)

          shell_path = Path('src/screens/EngineerPortal/EngineerPortalShell.tsx')
          shell = shell_path.read_text()
          old_map = '''      {ENGINEER_PRIMARY_NAV.map((item) => {
        const Icon = item.icon;
        const active = pathIsActive(location.pathname, item.to, item.end);
        return (
          <NavLink
            key={item.to}
            to={item.to}
            aria-label={item.label}
            className={`relative flex min-h-[58px] flex-col items-center justify-center gap-1 px-1 text-[10px] font-medium transition-colors ${FOCUS} ${
              active ? "text-blue-400" : "text-slate-500"
            }`}
          >
            <span
              aria-hidden="true"
              className={`absolute top-0 h-0.5 w-8 rounded-full bg-blue-500 transition-opacity ${active ? "opacity-100" : "opacity-0"}`}
            />
            <Icon className={`h-5 w-5 ${active ? "stroke-[2]" : "stroke-[1.75]"}`} aria-hidden="true" />
            <span className="max-w-full truncate">{item.label}</span>
          </NavLink>
        );
      })}'''

          new_map = '''      {ENGINEER_PRIMARY_NAV.map((item) => {
        const Icon = item.icon;
        const active = pathIsActive(location.pathname, item.to, item.end);
        const isVorta = item.to === "/engineer/vorta";
        return (
          <NavLink
            key={item.to}
            to={item.to}
            aria-label={item.label}
            className={`relative flex min-h-[58px] flex-col items-center justify-center gap-0.5 px-1 text-[10px] font-medium transition-colors ${FOCUS} ${
              active ? "text-blue-400" : "text-slate-500"
            }`}
          >
            <span
              aria-hidden="true"
              className={`absolute top-0 h-0.5 w-8 rounded-full bg-blue-500 transition-opacity ${active && !isVorta ? "opacity-100" : "opacity-0"}`}
            />
            <span className="grid h-9 w-9 shrink-0 place-items-center" aria-hidden="true">
              {isVorta ? (
                <span
                  className={`grid h-9 w-9 place-items-center rounded-full border transition-colors ${
                    active
                      ? "border-blue-400/55 bg-blue-500/[0.13] text-blue-300"
                      : "border-slate-700/75 bg-slate-900/45 text-slate-500"
                  }`}
                >
                  <Icon className={`h-5 w-5 ${active ? "stroke-[2]" : "stroke-[1.75]"}`} />
                </span>
              ) : (
                <Icon className={`h-5 w-5 ${active ? "stroke-[2]" : "stroke-[1.75]"}`} />
              )}
            </span>
            <span className="max-w-full truncate leading-none">{item.label}</span>
          </NavLink>
        );
      })}'''

          if old_map not in shell:
              raise SystemExit('Could not find Engineer mobile nav block')
          shell = shell.replace(old_map, new_map, 1)
          shell_path.write_text(shell)

          Path('src/screens/EngineerPortal/EngineerBottomNavStyles.tsx').unlink(missing_ok=True)
          Path('src/screens/EngineerPortal/EngineerVortaSelectBridge.tsx').unlink(missing_ok=True)
          PY

      - name: Show remaining Engineer native selects
        shell: bash
        run: |
          echo "Remaining native selects in EngineerPortal:"
          grep -R -n "<select" src/screens/EngineerPortal || true

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit repair to main
        shell: bash
        run: |
          git config user.name "vorta-ui-repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/EngineerPortal
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "Use canonical Vorta dropdown and integrate mobile nav"
          git push origin HEAD:main
