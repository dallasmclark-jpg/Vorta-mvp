name: VOR-041 preserve active conversation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: vor-041-active-conversation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preserve:
    if: github.event.pull_request.head.ref == 'agent/vor-041-ask-vorta-workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-041-ask-vorta-workspace
          fetch-depth: 0

      - name: Stop when active conversation is already persistent
        id: state
        shell: bash
        run: |
          if grep -q 'vorta:ask-vorta:active-conversation:v1' src/screens/AiOperations/AskVortaWorkspace.tsx; then
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "persistent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.state.outputs.persistent == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.persistent == 'false'
        run: npm ci --silent

      - name: Preserve active workspace conversation
        if: steps.state.outputs.persistent == 'false'
        run: python scripts/vor-041-preserve-active-conversation.py

      - name: Prove mobile presentation was not edited
        if: steps.state.outputs.persistent == 'false'
        run: git diff --exit-code origin/main -- src/screens/AiOperations/mobilePortalHardening.css

      - name: Verify workspace contracts and production build
        if: steps.state.outputs.persistent == 'false'
        run: |
          npm run typecheck -- --pretty false
          node scripts/vor-037-unified-ask-vorta-contracts.mjs
          node scripts/vor-041-ask-vorta-workspace-contracts.mjs
          node scripts/tablet-presentation-contracts.mjs
          npm run build

      - name: Remove disposable repair scaffolding
        if: steps.state.outputs.persistent == 'false'
        run: |
          rm scripts/vor-041-preserve-active-conversation.py
          rm .github/workflows/vor-041-preserve-active-conversation.yml

      - name: Commit verified active conversation repair
        if: steps.state.outputs.persistent == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/AiOperations/AskVortaWorkspace.tsx \
                  scripts/vor-041-ask-vorta-workspace-contracts.mjs \
                  tests/browser/vor-041-ask-vorta-workspace.spec.ts \
                  scripts/vor-041-preserve-active-conversation.py \
                  .github/workflows/vor-041-preserve-active-conversation.yml
          git commit -m "VOR-041: preserve active conversation across compact mode"
          git push origin HEAD:agent/vor-041-ask-vorta-workspace
