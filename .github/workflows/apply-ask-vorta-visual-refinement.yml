name: Apply Ask Vorta visual refinement

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply-ask-vorta-visual-refinement.mjs"
      - ".github/workflows/apply-ask-vorta-visual-refinement.yml"

permissions:
  contents: write

concurrency:
  group: apply-ask-vorta-visual-refinement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Correct helper quoting and apply exact patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-ask-vorta-visual-refinement.mjs")
          text = path.read_text()
          old = '{evidenceUpdatedLabel ? `Evidence updated ${evidenceUpdatedLabel}` : "Evidence checked for this response"}'
          new = '{evidenceUpdatedLabel ? "Evidence updated " + evidenceUpdatedLabel : "Evidence checked for this response"}'
          if old not in text:
              raise SystemExit("Expected helper interpolation was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/apply-ask-vorta-visual-refinement.mjs
          node scripts/apply-ask-vorta-visual-refinement.mjs

      - name: Remove temporary apply scaffolding
        run: |
          rm scripts/apply-ask-vorta-visual-refinement.mjs
          rm .github/workflows/apply-ask-vorta-visual-refinement.yml

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit final Ask Vorta refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/screens/AiOperations/AskVortaWorkspace.tsx \
            src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx \
            src/screens/AiOperations/mobilePortalHardening.css \
            scripts/vor-041-ask-vorta-workspace-contracts.mjs \
            tests/browser/vor-041-ask-vorta-workspace.spec.ts \
            scripts/apply-ask-vorta-visual-refinement.mjs \
            .github/workflows/apply-ask-vorta-visual-refinement.yml
          git commit -m "Refine Ask Vorta visual workspace"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
