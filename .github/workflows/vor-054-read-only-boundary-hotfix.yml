name: VOR-054 read-only boundary hotfix

on:
  push:
    branches:
      - agent/vor-054-cross-domain-live-evals
    paths:
      - ".github/workflows/vor-054-read-only-boundary-hotfix.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vor-054-cross-domain-live-evals
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Apply focused read-only boundary fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          response_path = Path("netlify/functions/ask-vorta/response-validation.mts")
          response = response_path.read_text()
          old_boundary = '''export function enforceAnswerEvidence(
            answer: JsonRecord,
            question: string,
            shiftCoverEvidence: JsonRecord | null,
            shiftCoverArguments: JsonRecord | null,
          ): void {
            const writeRequest =
              /^\\s*(?:please\\s+)?(?:change|update|assign|delete|create|approve|order|schedule|book|cancel|close|complete|move|switch)\\b/i.test(
                question,
              ) ||
              /\\b(?:can|could|would|will)\\s+you\\s+(?:change|update|assign|delete|create|approve|order|schedule|book|cancel|close|complete|move|switch)\\b/i.test(
                question,
              );
            if (writeRequest) {
              const directAnswer =
                typeof answer.directAnswer === "string" ? answer.directAnswer.trim() : "";
              if (!/\\bread-only\\b/i.test(directAnswer) || !/\\bcannot\\b/i.test(directAnswer)) {
                answer.directAnswer =
                  `Ask Vorta is read-only and cannot change Vorta records. ${directAnswer}`.trim();
              }
            }

            if (!shiftCoverEvidence) return;'''
          new_boundary = '''export function enforceReadOnlyWriteBoundary(
            answer: JsonRecord,
            question: string,
          ): void {
            const writeRequest =
              /^\\s*(?:please\\s+)?(?:change|update|assign|delete|create|approve|order|schedule|book|cancel|close|complete|move|switch)\\b/i.test(
                question,
              ) ||
              /\\b(?:can|could|would|will)\\s+you\\s+(?:change|update|assign|delete|create|approve|order|schedule|book|cancel|close|complete|move|switch)\\b/i.test(
                question,
              );
            if (!writeRequest) return;

            const directAnswer =
              typeof answer.directAnswer === "string" ? answer.directAnswer.trim() : "";
            if (/\\bread-only\\b/i.test(directAnswer) && /\\bcannot\\b/i.test(directAnswer)) {
              return;
            }
            const staffingWriteRequest =
              /\\b(?:shift|rota|cover|engineers?|people|team)\\b/i.test(question);
            const refusal = staffingWriteRequest
              ? "Ask Vorta is read-only and cannot assign engineers or change the rota."
              : "Ask Vorta is read-only and cannot change Vorta records.";
            answer.directAnswer = `${refusal} ${directAnswer}`.trim();
          }

          export function enforceAnswerEvidence(
            answer: JsonRecord,
            question: string,
            shiftCoverEvidence: JsonRecord | null,
            shiftCoverArguments: JsonRecord | null,
          ): void {
            enforceReadOnlyWriteBoundary(answer, question);

            if (!shiftCoverEvidence) return;'''
          if response.count(old_boundary) != 1:
              raise SystemExit(f"Expected one write-boundary block, found {response.count(old_boundary)}")
          response = response.replace(old_boundary, new_boundary)
          response, end_count = re.subn(
              r'(  answer\.confidence = coverEvidenceConfidence\(\n.*?  \);\n)(\})\s*$',
              r'\1  enforceReadOnlyWriteBoundary(answer, question);\n\2\n',
              response,
              count=1,
              flags=re.DOTALL,
          )
          if end_count != 1:
              raise SystemExit(f"Expected one Shift Cover function end, found {end_count}")
          response_path.write_text(response)

          route_path = Path("netlify/functions/ask-vorta/route-planning.mts")
          route = route_path.read_text()
          workforce_anchor = '''  const datedWorkforceQuestion =
            (coverDate !== null || nextWeek || thisWeek) &&'''
          staffing_route = '''  const staffingWriteRequest =
            /^\\s*(?:please\\s+)?(?:assign|move|switch|update|change)\\b/.test(question) &&
            /\\b(?:cover|engineers?|people|team|shift|rota)\\b/.test(question);
          const datedWorkforceQuestion =
            (coverDate !== null || nextWeek || thisWeek) &&'''
          if route.count(workforce_anchor) != 1:
              raise SystemExit(f"Expected one workforce anchor, found {route.count(workforce_anchor)}")
          route = route.replace(workforce_anchor, staffing_route)
          routing_anchor = '''    (shiftCoverPageContext ||
                (asksForCoverDecision &&'''
          routing_replacement = '''    (shiftCoverPageContext ||
                staffingWriteRequest ||
                (asksForCoverDecision &&'''
          if route.count(routing_anchor) != 1:
              raise SystemExit(f"Expected one routing anchor, found {route.count(routing_anchor)}")
          route = route.replace(routing_anchor, routing_replacement)
          focus_anchor = '''      "Identify the dated rota and validated-skill cover risks, then give the best evidence-backed cover action.",'''
          focus_replacement = '''      staffingWriteRequest
                ? "State that Ask Vorta is read-only and cannot assign engineers or change the rota, then provide the best evidence-backed provisional cover recommendation and confirmation steps."
                : "Identify the dated rota and validated-skill cover risks, then give the best evidence-backed cover action.",'''
          if route.count(focus_anchor) != 1:
              raise SystemExit(f"Expected one cover focus anchor, found {route.count(focus_anchor)}")
          route_path.write_text(route.replace(focus_anchor, focus_replacement))

          scenario_path = Path("tests/evals/vor-054-cross-domain-live.json")
          scenarios = json.loads(scenario_path.read_text())
          boundary = next(
              (item for item in scenarios if item.get("id") == "vor054-read-only-write-boundary"),
              None,
          )
          if boundary is None:
              raise SystemExit("Missing VOR-054 read-only scenario")
          boundary["expectedTools"] = ["get_shift_cover"]
          boundary["maxToolCount"] = 1
          scenario_path.write_text(json.dumps(scenarios, indent=2) + "\n")

          contract_path = Path("scripts/vor-054-cross-domain-live-contracts.mjs")
          contract = contract_path.read_text()
          source_anchor = '''const centralWorkflow = readFileSync(centralWorkflowPath, "utf8");
          const shiftCoverScenarios = JSON.parse('''
          source_replacement = '''const centralWorkflow = readFileSync(centralWorkflowPath, "utf8");
          const routePlanning = readFileSync(
            "netlify/functions/ask-vorta/route-planning.mts",
            "utf8",
          );
          const responseValidation = readFileSync(
            "netlify/functions/ask-vorta/response-validation.mts",
            "utf8",
          );
          const shiftCoverScenarios = JSON.parse('''
          if contract.count(source_anchor) != 1:
              raise SystemExit(f"Expected one VOR-054 source anchor, found {contract.count(source_anchor)}")
          contract = contract.replace(source_anchor, source_replacement)
          old_write_assertion = '''assert.deepEqual(
            writeBoundary.expectedTools,
            [],
            "The write-boundary scenario must not invoke a Vorta tool",
          );'''
          new_write_assertion = '''assert.deepEqual(
            writeBoundary.expectedTools,
            ["get_shift_cover"],
            "The staffing write-boundary scenario may use one read-only Shift Cover lookup",
          );
          assert.equal(
            writeBoundary.maxToolCount,
            1,
            "The staffing write-boundary scenario must not expand beyond one read-only lookup",
          );'''
          if contract.count(old_write_assertion) != 1:
              raise SystemExit(f"Expected one write assertion, found {contract.count(old_write_assertion)}")
          contract = contract.replace(old_write_assertion, new_write_assertion)
          runtime_assertion_anchor = '''for (const trigger of [
            '      - "scripts/vor-054*"','''
          runtime_assertions = '''assert.ok(
            routePlanning.includes("const staffingWriteRequest =") &&
              routePlanning.includes("staffingWriteRequest ||"),
            "Staffing write commands must route deterministically through one Shift Cover lookup",
          );
          assert.ok(
            routePlanning.includes(
              "Ask Vorta is read-only and cannot assign engineers or change the rota",
            ),
            "The staffing route must require an explicit read-only refusal",
          );
          assert.ok(
            responseValidation.includes(
              "export function enforceReadOnlyWriteBoundary(",
            ) &&
              (responseValidation.match(
                /enforceReadOnlyWriteBoundary\\(answer, question\\);/g,
              ) ?? []).length >= 2,
            "The read-only boundary must be enforced before and after Shift Cover answer shaping",
          );

          for (const trigger of [
            '      - "scripts/vor-054*"','''
          if contract.count(runtime_assertion_anchor) != 1:
              raise SystemExit(f"Expected one runtime assertion anchor, found {contract.count(runtime_assertion_anchor)}")
          contract_path.write_text(contract.replace(runtime_assertion_anchor, runtime_assertions))
          PY

      - name: Verify focused contracts and runtime checks
        run: |
          node scripts/vor-054-cross-domain-live-contracts.mjs
          npm run typecheck -- --pretty false
          npm run test:contracts
          npm run test:smoke

      - name: Commit focused fix and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ask Vorta automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/vor-054-read-only-boundary-hotfix.yml
          git add netlify/functions/ask-vorta/route-planning.mts netlify/functions/ask-vorta/response-validation.mts tests/evals/vor-054-cross-domain-live.json scripts/vor-054-cross-domain-live-contracts.mjs
          git diff --cached --check
          git commit -m "Enforce Ask Vorta staffing write boundary"
          git push origin HEAD:agent/vor-054-cross-domain-live-evals
