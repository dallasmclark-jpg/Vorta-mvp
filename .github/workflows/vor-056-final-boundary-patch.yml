name: VOR-056 final response boundary patch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vor-056-backlog-action-plan
    paths:
      - .github/workflows/vor-056-final-boundary-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out VOR-056 branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-056-backlog-action-plan
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply final backlog response guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          response_path = Path("netlify/functions/ask-vorta/response-validation.mts")
          runtime_path = Path("netlify/functions/ask-vorta/runtime.mts")
          contract_path = Path("scripts/vor-056-backlog-action-plan-contracts.mjs")

          response = response_path.read_text()
          runtime = runtime_path.read_text()
          contract = contract_path.read_text()

          function_marker = "export function enforceDeterministicResponseShape(\n"
          guard = '''export function enforceBacklogActionPlan(
            answer: JsonRecord,
            outcomes: Map<string, ToolResult>,
          ): void {
            const backlogResult = outcomes.get("get_site_work_backlog");
            if (
              !backlogResult ||
              backlogResult.status !== "ok" ||
              records(answer.actionPlan).length > 0
            ) {
              return;
            }

            const firstFinding = records(answer.findings).find(
              (item) => typeof item.title === "string" && item.title.trim().length > 0,
            );
            const prioritySummary = records(answer.decisionSummary).find((item) =>
              /highest priority|first priority|first action/i.test(String(item.label ?? "")),
            );
            const findingTitle =
              typeof firstFinding?.title === "string" ? firstFinding.title.trim() : "";
            const summaryValue =
              typeof prioritySummary?.value === "string" ? prioritySummary.value.trim() : "";
            const target = findingTitle || summaryValue;
            if (!target) return;

            const action =
              `Confirm scope, readiness and an authorised assignee for ${target}, then have the Maintenance Planner update and sequence the SAP work order before release.`;
            const existingRecommendations = textValues(answer.recommendedActions).filter(
              (item) => item !== action,
            );
            answer.recommendedActions = [action, ...existingRecommendations].slice(0, 4);
            answer.actionPlan = [
              {
                priority: "now",
                action,
                owner: "Maintenance Manager / Planner",
                expectedImpact:
                  "Moves the highest-priority overdue or unassigned work order from identified risk toward an owned, executable plan.",
                verification:
                  "Open the linked SAP work order evidence and confirm the authorised assignee, readiness, due date and released sequence are recorded by an authorised user.",
              },
            ];
          }

          '''
          if "export function enforceBacklogActionPlan(" not in response:
              if function_marker not in response:
                  raise SystemExit("response-validation insertion marker not found")
              response = response.replace(function_marker, guard + function_marker, 1)

          import_marker = "enforceAnswerEvidence, enforceDeterministicResponseShape,"
          import_replacement = (
              "enforceAnswerEvidence, enforceBacklogActionPlan, "
              "enforceDeterministicResponseShape,"
          )
          import_section = runtime.split('from "./response-validation.mjs";')[0]
          if "enforceBacklogActionPlan" not in import_section:
              if import_marker not in runtime:
                  raise SystemExit("runtime import marker not found")
              runtime = runtime.replace(import_marker, import_replacement, 1)

          repair_pattern = re.compile(
              r"(?m)^([ \t]*)repairEquipmentDecisionAnswer\(answer, questionPlan, toolOutcomes\);\n"
          )
          if runtime.count("enforceBacklogActionPlan(answer, toolOutcomes);") < 2:
              def add_guard(match):
                  indent = match.group(1)
                  return match.group(0) + f"{indent}enforceBacklogActionPlan(answer, toolOutcomes);\n"
              runtime, inserted = repair_pattern.subn(add_guard, runtime, count=2)
              if inserted != 2:
                  raise SystemExit(
                      f"expected two final answer repair boundaries, found {inserted}"
                  )

          fallback_pattern = re.compile(
              r"(?m)^([ \t]*)enforceDeterministicResponseShape\(verifiedFallback, questionPlan\);\n"
          )
          if "enforceBacklogActionPlan(verifiedFallback, toolOutcomes);" not in runtime:
              def add_fallback_guard(match):
                  indent = match.group(1)
                  return (
                      match.group(0)
                      + f"{indent}enforcePlannedResponseShape(verifiedFallback, questionPlan);\n"
                      + f"{indent}enforceBacklogActionPlan(verifiedFallback, toolOutcomes);\n"
                  )
              runtime, inserted = fallback_pattern.subn(add_fallback_guard, runtime, count=1)
              if inserted != 1:
                  raise SystemExit("verified fallback final-boundary marker not found")

          if 'const runtime = readFileSync(' not in contract:
              contract_marker = "const contractSuite = readFileSync("
              if contract_marker not in contract:
                  raise SystemExit("contract runtime-read insertion marker not found")
              runtime_reader = '''const runtime = readFileSync(
            "netlify/functions/ask-vorta/runtime.mts",
            "utf8",
          );
          '''
              contract = contract.replace(contract_marker, runtime_reader + contract_marker, 1)

          assertion_marker = 'assert.equal(scenarios.length, 1, "VOR-056 must retain one focused live scenario");'
          final_contract = '''for (const marker of [
            "export function enforceBacklogActionPlan(",
            'outcomes.get("get_site_work_backlog")',
            'backlogResult.status !== "ok"',
            "records(answer.actionPlan).length > 0",
            "authorised assignee",
            "Maintenance Manager / Planner",
            "released sequence are recorded by an authorised user",
          ]) {
            assert.ok(
              responseValidation.includes(marker),
              `The final backlog response boundary is missing ${marker}`,
            );
          }
          assert.ok(
            runtime.includes("enforceBacklogActionPlan") &&
              runtime.split("enforceBacklogActionPlan(").length - 1 >= 4,
            "The backlog guard must be imported and run at deterministic, semantic and verified-fallback response boundaries",
          );

          '''
          if "The final backlog response boundary is missing" not in contract:
              if assertion_marker not in contract:
                  raise SystemExit("contract assertion insertion marker not found")
              contract = contract.replace(
                  assertion_marker,
                  final_contract + assertion_marker,
                  1,
              )

          response_path.write_text(response)
          runtime_path.write_text(runtime)
          contract_path.write_text(contract)
          PY

      - name: Run focused VOR-056 contracts
        run: node scripts/vor-056-backlog-action-plan-contracts.mjs

      - name: Run complete canonical validation
        run: npm run build

      - name: Check final diff
        run: |
          git diff --check
          git status --short
          git diff -- netlify/functions/ask-vorta/response-validation.mts netlify/functions/ask-vorta/runtime.mts scripts/vor-056-backlog-action-plan-contracts.mjs

      - name: Commit verified source patch
        run: |
          git config user.name "Ask Vorta CI"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/ask-vorta/response-validation.mts
          git add netlify/functions/ask-vorta/runtime.mts
          git add scripts/vor-056-backlog-action-plan-contracts.mjs
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "Fix VOR-056 final backlog response boundary"
          git push origin HEAD:agent/vor-056-backlog-action-plan
