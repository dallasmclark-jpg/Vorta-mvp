name: Engineer rota today border fix

on:
  push:
    branches:
      - agent/engineer-rota-today-border-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/engineer-rota-today-border-fix
      - name: Apply visible today border
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/EngineerPortal/EngineerRotaScreen.tsx')
          s = p.read_text()
          old = 'ring-2 ring-inset ring-white/90 shadow-[0_0_0_1px_rgba(255,255,255,0.10),0_0_14px_rgba(255,255,255,0.12)]'
          new = '!border-white border-2 ring-0 shadow-[0_0_0_1px_rgba(255,255,255,0.12),0_0_16px_rgba(255,255,255,0.14)]'
          if old not in s:
              raise SystemExit('Expected today highlight string not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/engineer-rota-today-border-fix.yml
      - name: Commit patch
        run: |
          git config user.name "Vorta release agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/EngineerPortal/EngineerRotaScreen.tsx .github/workflows/engineer-rota-today-border-fix.yml
          git commit -m "Make Engineer rota today border explicit"
          git push origin HEAD:agent/engineer-rota-today-border-fix
