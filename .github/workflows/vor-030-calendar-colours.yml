name: VOR-030 use Shift Calendar colours

on:
  push:
    branches:
      - fix/vor-030-shift-calendar-colours

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/vor-030-shift-calendar-colours
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused VOR-030 correction
        run: |
          python3 scripts/apply-vor-030-calendar-colours.py
          python3 scripts/apply-vor-030-calendar-colours-fix.py

      - name: Run Shift Handover contracts
        run: node scripts/shift-handover-contracts.mjs

      - name: Run Maintenance Manager TypeScript
        run: npx tsc -p tsconfig.maintenance.json --noEmit

      - name: Run route smoke tests
        run: npm run test:smoke

      - name: Create production build
        run: npm run build

      - name: Commit validated correction
        run: |
          rm scripts/apply-vor-030-calendar-colours.py
          rm scripts/apply-vor-030-calendar-colours-fix.py
          rm .github/workflows/vor-030-calendar-colours.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "VOR-030: use Shift Calendar rota colours in handover"
          git push origin HEAD:fix/vor-030-shift-calendar-colours
