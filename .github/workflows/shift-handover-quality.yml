name: Shift Handover quality gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/screens/ShiftHandover/**"
      - "src/components/VortaSelect.tsx"
      - "src/components/VortaMultiSelect.tsx"
      - "src/lib/shiftPresentation.ts"
      - "supabase/functions/shift-handover-data/**"
      - "scripts/shift-handover-contracts.mjs"
      - "tests/browser/maintenance-manager-shift-handover.spec.ts"
      - "tests/browser/maintenance-manager-shift-handover-team-filter.spec.ts"
      - "tests/browser/maintenance-manager-shift-handover-select-scroll.spec.ts"
      - "playwright.config.ts"
      - ".github/workflows/shift-handover-quality.yml"
  push:
    branches:
      - main
    paths:
      - "src/screens/ShiftHandover/**"
      - "src/components/VortaSelect.tsx"
      - "src/components/VortaMultiSelect.tsx"
      - "src/lib/shiftPresentation.ts"
      - "supabase/functions/shift-handover-data/**"
      - "scripts/shift-handover-contracts.mjs"
      - "tests/browser/maintenance-manager-shift-handover.spec.ts"
      - "tests/browser/maintenance-manager-shift-handover-team-filter.spec.ts"
      - "tests/browser/maintenance-manager-shift-handover-select-scroll.spec.ts"
      - "playwright.config.ts"
      - ".github/workflows/shift-handover-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shift-handover-quality-${{ github.sha }}
  cancel-in-progress: false

jobs:
  responsive:
    name: Shift Handover responsive checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      # The pilot fixture contains real imported SAP evidence dated before the
      # current day. "demo" selects the latest evidence window; it does not
      # replace the Supabase records with generated placeholders.
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000001

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Compose public Supabase client key
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Run TypeScript check
        run: npm run typecheck -- --pretty false

      - name: Run Shift Handover contracts
        run: node scripts/shift-handover-contracts.mjs

      - name: Verify authenticated browser-test secret
        run: test -n "$VORTA_E2E_PASSWORD"

      - name: Install browser-test runner
        run: npm install --no-save --package-lock=false --silent @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile dropdown scroll regression
        run: |
          npx playwright test \
            tests/browser/maintenance-manager-shift-handover-select-scroll.spec.ts \
            --project=phone-360 \
            --config=playwright.config.ts

      - name: Run maintenance-team responsive regression
        run: |
          npx playwright test \
            tests/browser/maintenance-manager-shift-handover-team-filter.spec.ts \
            --project=phone-360 \
            --project=samsung-tablet-portrait \
            --project=samsung-tablet-landscape \
            --project=laptop-1366 \
            --project=desktop-1920 \
            --config=playwright.config.ts
