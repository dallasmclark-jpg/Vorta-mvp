name: Apply VOR-031 maintenance team filter

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'vorta/vor-031-finalise' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair the one-use patch runners
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path('scripts/vor-031-ui.py')
          ui_content = ui_path.read_text()
          ui_old = '''for _ in range(2):
              replace_once(
                  path,
                  '{reviewPeriodLoadingState(reviewHours)}',
                  '{reviewPeriodLoadingState(reviewHours, maintenanceTeams)}',
              )'''
          ui_new = '''target = ROOT / path
          content = target.read_text()
          marker = '{reviewPeriodLoadingState(reviewHours)}'
          if content.count(marker) != 2:
              raise RuntimeError(f"{path}: expected two loading-state markers, found {content.count(marker)}")
          target.write_text(content.replace(marker, '{reviewPeriodLoadingState(reviewHours, maintenanceTeams)}'))'''
          if ui_old not in ui_content:
              raise RuntimeError('UI patch runner repair marker was not found')
          ui_path.write_text(ui_content.replace(ui_old, ui_new, 1))

          test_path = Path('scripts/vor-031-tests.py')
          test_content = test_path.read_text()
          test_old = '''    if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}: {old[:100]!r}")'''
          test_new = '''    if count < 1:
                  raise RuntimeError(f"{path}: replacement marker was not found: {old[:100]!r}")'''
          if test_old not in test_content:
              raise RuntimeError('Test patch runner multiplicity repair marker was not found')
          test_path.write_text(test_content.replace(test_old, test_new, 1))
          PY
      - name: Apply focused VOR-031 patches
        run: |
          python scripts/vor-031-backend.py
          python scripts/vor-031-ui.py
          python scripts/vor-031-tests.py
      - name: Remove one-use patch machinery
        run: |
          rm scripts/vor-031-backend.py
          rm scripts/vor-031-ui.py
          rm scripts/vor-031-tests.py
          rm -f .github/vor-031-trigger
          rm -f .github/vor-031-main-trigger
          rm -f .github/vor-031-finalise-trigger
          rm .github/workflows/vor-031-apply.yml
      - name: Commit implementation
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "Vorta automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VOR-031: add maintenance team handover filtering"
          git push origin "HEAD:${TARGET_BRANCH}"
