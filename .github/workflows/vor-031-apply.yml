name: Apply VOR-031 maintenance team filter

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'vorta/vor-031-finalise' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused VOR-031 patches
        run: |
          python scripts/vor-031-backend.py
          python scripts/vor-031-ui.py
          python scripts/vor-031-tests.py
      - name: Remove one-use patch machinery
        run: |
          rm scripts/vor-031-backend.py
          rm scripts/vor-031-ui.py
          rm scripts/vor-031-tests.py
          rm -f .github/vor-031-trigger
          rm -f .github/vor-031-main-trigger
          rm -f .github/vor-031-finalise-trigger
          rm .github/workflows/vor-031-apply.yml
      - name: Commit implementation
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "Vorta automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VOR-031: add maintenance team handover filtering"
          git push origin "HEAD:${TARGET_BRANCH}"
