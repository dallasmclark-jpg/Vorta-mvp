name: VOR-039 deterministic fast route patch v2

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/vor-039-fast-route-patch-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vor-039-ask-vorta-confidence-latency
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and repair deterministic patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/vor-039-fast-route-patch.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )

          block_start = script.index("old_tool_choice = '''")
          block_marker = 'agent = replace_once(agent, old_tool_choice, new_tool_choice, "disable tools after deterministic evidence")'
          block_end = script.index(block_marker, block_start) + len(block_marker)
          replacement = '''agent = replace_once(
              agent,
              "        tools: TOOLS,",
              "        tools: deterministicToolName ? [] : TOOLS,",
              "disable tools after deterministic evidence",
          )
          agent = replace_once(
              agent,
              "        tool_choice:\\n          round === 0 && questionPlan?.shouldUseTools === true\\n            ? \\\"required\\\"\\n            : \\\"auto\\\",",
              "        tool_choice: deterministicToolName\\n          ? \\\"none\\\"\\n          : round === 0 && questionPlan?.shouldUseTools === true\\n            ? \\\"required\\\"\\n            : \\\"auto\\\",",
              "deterministic tool choice",
          )
          agent = replace_once(
              agent,
              "        parallel_tool_calls: true,",
              "        parallel_tool_calls: !deterministicToolName,",
              "deterministic parallel tool calls",
          )'''
          script = script[:block_start] + replacement + script[block_end:]
          Path('/tmp/apply-vor-039-fast-route.py').write_text(script + "\n")
          PY
          python /tmp/apply-vor-039-fast-route.py

      - name: Install dependencies
        run: npm ci

      - name: Verify focused implementation
        run: |
          npm run typecheck:functions
          node scripts/vor-038-ask-vorta-intelligence-contracts.mjs
          node scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs
          node scripts/ask-vorta-agent-contracts.mjs

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/vor-039-fast-route-patch.yml
          rm .github/workflows/vor-039-fast-route-patch-v2.yml
          git config user.name "Vorta Agent"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/ask-vorta.mts \
            scripts/ask-vorta-live-evals.mjs \
            scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs \
            .github/workflows/vor-039-fast-route-patch.yml \
            .github/workflows/vor-039-fast-route-patch-v2.yml
          git commit -m "VOR-039: add deterministic Ask Vorta fast route [vor-039 fast route]"
          git push origin HEAD:agent/vor-039-ask-vorta-confidence-latency
