name: VERIFY ONLY VOR-055/056 exact production 2026-08-09

on:
  push:
    branches:
      - verify/vor-055-056-production-20260809
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-vor-055-056-production-20260809
  cancel-in-progress: true

jobs:
  verify:
    name: Verify VOR-055/056 on exact production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PRODUCTION_COMMIT: beffbed84fce32a9d31f594e2bc7617dfd394104
      VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
      VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000001
      VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
      VORTA_E2E_DENIED_EQUIPMENT_ID: 40000000-0000-0000-0000-000000000013
      VORTA_EVAL_DELAY_MS: 0
      VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 1
      VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000

    steps:
      - name: Check out verification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Prove verification-only branch above exact production
        shell: bash
        run: |
          git merge-base --is-ancestor "$EXPECTED_PRODUCTION_COMMIT" HEAD
          test "$(git diff --name-only "$EXPECTED_PRODUCTION_COMMIT" HEAD | tr -d '\r')" = ".github/workflows/verify-vor-055-056-production-20260809.yml"

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Verify protected evaluation secret
        run: test -n "$VORTA_E2E_PASSWORD"

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Run permanent VOR-056 action-plan contract
        run: node scripts/vor-056-backlog-action-plan-contracts.mjs

      - name: Verify production backlog action plan
        shell: bash
        run: |
          set -o pipefail
          VORTA_EVAL_OFFSET=8 VORTA_EVAL_LIMIT=1 node scripts/ask-vorta-live-evals.mjs tests/evals/ask-vorta-live-golden.json 2>&1 | tee vor-056-production-backlog.log

      - name: Verify production handover action plan
        shell: bash
        run: |
          set -o pipefail
          VORTA_EVAL_OFFSET=6 VORTA_EVAL_LIMIT=1 node scripts/ask-vorta-live-evals.mjs tests/evals/ask-vorta-live-golden.json 2>&1 | tee vor-055-production-handover.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated Maintenance Manager production browser acceptance
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser -- \
            tests/browser/maintenance-manager-core.spec.ts \
            tests/browser/maintenance-manager-work-orders.spec.ts \
            --project=phone-360 \
            --project=desktop-1920 \
            2>&1 | tee vor-055-056-production-browser.log

      - name: Preserve production verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vor-055-056-production-${{ github.sha }}
          path: |
            vor-056-production-backlog.log
            vor-055-production-handover.log
            vor-055-056-production-browser.log
          if-no-files-found: error
          retention-days: 14
