name: Apply VOR-026 on pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/vor-026-shift-handover-mobile-refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vor-026-shift-handover-mobile-refinement
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and run focused transformation
        shell: bash
        run: |
          awk '
            /python <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/vor-026-apply.yml > /tmp/vor-026-apply.py
          python /tmp/vor-026-apply.py

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run Shift Handover contracts
        run: node scripts/shift-handover-contracts.mjs

      - name: Commit focused implementation
        shell: bash
        run: |
          rm .github/workflows/vor-026-apply.yml .github/workflows/vor-026-pr-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/ShiftHandover/ShiftHandoverSection.tsx tests/browser/maintenance-manager-shift-handover.spec.ts scripts/shift-handover-contracts.mjs .github/workflows/vor-026-apply.yml .github/workflows/vor-026-pr-apply.yml
          git commit -m "VOR-026: refine mobile Shift Handover layout"
          git push origin HEAD:feature/vor-026-shift-handover-mobile-refinement
