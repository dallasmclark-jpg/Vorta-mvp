name: Apply VOR-026 on pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/vor-026-shift-handover-mobile-refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vor-026-shift-handover-mobile-refinement
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and run corrected transformation
        shell: bash
        run: |
          awk '
            /python <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/vor-026-pr-apply-v2.yml > /tmp/vor-026-apply.py
          python <<'PATCH'
          from pathlib import Path
          path = Path('/tmp/vor-026-apply.py')
          script = path.read_text()
          start = script.index("old_empty = '''")
          end = script.index("page_path.write_text(page)", start)
          replacement = '''empty_start = page.index(
              '              <h2 className="mt-4 font-semibold text-slate-300">',
              page.index('<PackageCheck className="mx-auto h-8 w-8 text-slate-600"'),
          )
          empty_end = page.index('            </div>\\n          )}', empty_start)
          new_empty = \'''              <h2 className="mt-4 font-semibold text-slate-300">
                {snapshot.items.length === 0
                  ? reviewPeriodEmptyState(reviewHours)
                  : "No work orders match the selected filters."}
              </h2>
              <p className="mt-1 text-sm text-slate-600">
                {snapshot.items.length === 0
                  ? "No work orders were confirmed in this review period."
                  : "Return to the site scope or remove a discipline, status or criticality filter."}
              </p>
          \'''
          page = page[:empty_start] + new_empty + "\\n" + page[empty_end:]
          '''
          script = script[:start] + replacement + script[end:]
          path.write_text(script)
          PATCH
          python /tmp/vor-026-apply.py

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run Shift Handover contracts
        run: node scripts/shift-handover-contracts.mjs

      - name: Commit focused implementation
        shell: bash
        run: |
          rm -f \
            .github/workflows/vor-026-apply.yml \
            .github/workflows/vor-026-pr-apply.yml \
            .github/workflows/vor-026-pr-apply-v2.yml \
            scripts/vor-026-trigger.txt \
            scripts/vor-026-acceptance.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "VOR-026: refine mobile Shift Handover layout"
          git push origin HEAD:feature/vor-026-shift-handover-mobile-refinement
