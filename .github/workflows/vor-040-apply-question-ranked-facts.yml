name: VOR-040 apply question-ranked equipment facts

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/vor-040-natural-question-audit-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect completed extraction repair
        id: state
        shell: bash
        run: |
          if grep -q 'equipmentDecisionFacts(selected, domains, request.question)' netlify/functions/ask-vorta.mts; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.skip != 'true'
        run: npm ci

      - name: Apply question-ranked fact extraction
        if: steps.state.outputs.skip != 'true'
        run: python3 scripts/vor-040-question-ranked-facts-patch.py

      - name: Verify backend TypeScript and Ask Vorta contracts
        if: steps.state.outputs.skip != 'true'
        run: |
          npm run typecheck:functions
          node scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs
          node scripts/vor-040-natural-question-contracts.mjs
          node scripts/ask-vorta-agent-contracts.mjs

      - name: Remove disposable repair scaffolding
        if: steps.state.outputs.skip != 'true'
        run: |
          rm scripts/vor-040-question-ranked-facts-patch.py
          rm .github/workflows/vor-040-apply-question-ranked-facts.yml

      - name: Commit verified extraction repair
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/ask-vorta.mts
          git add -u scripts/vor-040-question-ranked-facts-patch.py .github/workflows/vor-040-apply-question-ranked-facts.yml
          git commit -m 'VOR-040: rank equipment facts against the actual question'
          git push origin HEAD:${{ github.head_ref }}
