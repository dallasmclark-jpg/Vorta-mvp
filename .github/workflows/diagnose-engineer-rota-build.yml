name: Diagnose Engineer rota build

on:
  push:
    branches:
      - agent/deploy-engineer-rota-artifact

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run production build and capture output
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: engineer-rota-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail if production build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
