name: VOR-048 routing telemetry feedback

on:
  pull_request:
    branches:
      - main
    paths:
      - "netlify/functions/ask-vorta.mts"
      - "src/screens/AiOperations/**"
      - "scripts/vor-048*"
      - "scripts/vor-044-operational-value-ranking-contracts.mjs"
      - "scripts/vor-045-conversation-context-contracts.mjs"
      - "scripts/vor-046-photo-ocr-contracts.mjs"
      - "scripts/run-contract-suite.mjs"
      - "supabase/migrations/20260803202500_vor_048_route_latency_feedback.sql"
      - "tests/browser/vor-048-feedback.spec.ts"
      - "tests/evals/vor-048-shift-cover-routing.json"
      - "package.json"
      - ".github/workflows/vor-048-validation.yml"
  push:
    branches:
      - main
    paths:
      - "netlify/functions/ask-vorta.mts"
      - "src/screens/AiOperations/**"
      - "scripts/vor-048*"
      - "scripts/vor-044-operational-value-ranking-contracts.mjs"
      - "scripts/vor-045-conversation-context-contracts.mjs"
      - "scripts/vor-046-photo-ocr-contracts.mjs"
      - "scripts/run-contract-suite.mjs"
      - "supabase/migrations/20260803202500_vor_048_route_latency_feedback.sql"
      - "tests/browser/vor-048-feedback.spec.ts"
      - "tests/evals/vor-048-shift-cover-routing.json"
      - "package.json"
      - ".github/workflows/vor-048-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vor-048-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Routing, telemetry and feedback validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          show-progress: false

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Apply the complete Ask Vorta integration chain
        run: npm run build:metadata

      - name: Run transformed-source TypeScript checks
        run: npm run typecheck -- --pretty false

      - name: Run permanent VOR-048 contracts
        run: node scripts/vor-048-routing-telemetry-feedback-contracts.mjs

      - name: Run route smoke tests
        run: npm run test:smoke

      - name: Build production bundle
        run: npx vite build

      - name: Enforce unchanged performance budgets
        run: npm run test:performance

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated phone and laptop feedback journeys
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser -- \
            tests/browser/vor-048-feedback.spec.ts \
            --project=phone-360 \
            --project=laptop-1366 2>&1 | tee vor-048-browser.log

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-048-failure-evidence-${{ github.sha }}
          path: |
            vor-048-browser.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve successful validation evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-048-validation-evidence-${{ github.sha }}
          path: |
            dist/vorta-build.json
            vor-048-browser.log
          if-no-files-found: warn
          retention-days: 7
