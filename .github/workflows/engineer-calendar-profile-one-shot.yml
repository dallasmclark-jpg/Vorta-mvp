name: Engineer calendar profile one-shot

on:
  push:
    branches:
      - agent/engineer-calendar-profile

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/engineer-calendar-profile
      - name: Apply feature patch
        run: python .github/engineer_calendar_profile_patch.py
      - name: Remove one-shot files
        run: rm .github/workflows/engineer-calendar-profile-one-shot.yml .github/engineer_calendar_profile_patch.py
      - name: Commit feature patch
        run: |
          git config user.name "Vorta release agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/EngineerPortal/EngineerRotaScreen.tsx netlify/functions/ask-vorta.mts netlify/functions/ask-vorta/runtime-personal-calendar.mts .github/workflows/engineer-calendar-profile-one-shot.yml .github/engineer_calendar_profile_patch.py
          git commit -m "Add Engineer profile calendar and Ask Vorta personal answers"
          git push origin HEAD:agent/engineer-calendar-profile
