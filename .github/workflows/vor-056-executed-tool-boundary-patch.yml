name: VOR-056 executed tool boundary patch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vor-056-backlog-action-plan
    paths:
      - .github/workflows/vor-056-executed-tool-boundary-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out VOR-056 branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-056-backlog-action-plan
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply executed-tool final boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          response_path = Path("netlify/functions/ask-vorta/response-validation.mts")
          runtime_path = Path("netlify/functions/ask-vorta/runtime.mts")
          contract_path = Path("scripts/vor-056-backlog-action-plan-contracts.mjs")

          response = response_path.read_text()
          runtime = runtime_path.read_text()
          contract = contract_path.read_text()

          function_start = response.index("export function enforceBacklogActionPlan(")
          findings_start = response.index("  const firstFinding =", function_start)
          current_header = response[function_start:findings_start]
          desired_header = '''export function enforceBacklogActionPlan(
            answer: JsonRecord,
            outcomes: Map<string, ToolResult>,
            usedTools: Set<string>,
          ): void {
            const backlogResult = outcomes.get("get_site_work_backlog");
            const backlogToolExecuted =
              usedTools.has("get_site_work_backlog") || Boolean(backlogResult);
            if (!backlogToolExecuted || records(answer.actionPlan).length > 0) {
              return;
            }

          '''
          if current_header != desired_header:
              response = response[:function_start] + desired_header + response[findings_start:]

          old_call = "enforceBacklogActionPlan(answer, toolOutcomes);"
          new_call = "enforceBacklogActionPlan(answer, toolOutcomes, usedTools);"
          if runtime.count(new_call) < 2:
              if runtime.count(old_call) != 2:
                  raise SystemExit(
                      f"expected two normal backlog guard calls, found {runtime.count(old_call)}"
                  )
              runtime = runtime.replace(old_call, new_call)

          old_fallback = "enforceBacklogActionPlan(verifiedFallback, toolOutcomes);"
          new_fallback = "enforceBacklogActionPlan(verifiedFallback, toolOutcomes, usedTools);"
          if new_fallback not in runtime:
              if old_fallback not in runtime:
                  raise SystemExit("verified fallback backlog guard call not found")
              runtime = runtime.replace(old_fallback, new_fallback, 1)

          old_marker = '\'backlogResult.status !== "ok"\''
          new_marker = '\'usedTools.has("get_site_work_backlog")\''
          if new_marker not in contract:
              if old_marker not in contract:
                  raise SystemExit("obsolete outcome-status contract marker not found")
              contract = contract.replace(old_marker, new_marker, 1)

          old_count = 'runtime.split("enforceBacklogActionPlan(").length - 1 >= 3,'
          new_count = '''runtime.split("enforceBacklogActionPlan(").length - 1 >= 3 &&
              runtime.split("toolOutcomes, usedTools").length - 1 >= 3,'''
          if new_count not in contract:
              if old_count not in contract:
                  raise SystemExit("runtime call-count contract line not found")
              contract = contract.replace(old_count, new_count, 1)
          contract = contract.replace(
              "The backlog guard must be imported and run at deterministic, semantic and verified-fallback response boundaries",
              "The backlog guard must be imported and run with executed-tool evidence at deterministic, semantic and verified-fallback response boundaries",
              1,
          )

          response_path.write_text(response)
          runtime_path.write_text(runtime)
          contract_path.write_text(contract)
          PY

      - name: Run focused VOR-056 contracts
        run: node scripts/vor-056-backlog-action-plan-contracts.mjs

      - name: Run complete canonical validation
        run: npm run build

      - name: Check final diff
        run: |
          git diff --check
          git status --short
          git diff -- netlify/functions/ask-vorta/response-validation.mts netlify/functions/ask-vorta/runtime.mts scripts/vor-056-backlog-action-plan-contracts.mjs

      - name: Commit verified source patch
        run: |
          git config user.name "Ask Vorta CI"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/ask-vorta/response-validation.mts
          git add netlify/functions/ask-vorta/runtime.mts
          git add scripts/vor-056-backlog-action-plan-contracts.mjs
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "Use executed backlog tool at final response boundary"
          git push origin HEAD:agent/vor-056-backlog-action-plan
