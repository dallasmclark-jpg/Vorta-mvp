name: VOR-053 migrate canonical contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/vor-053-canonicalisation-audit.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace codemod lifecycle assertions with canonical-source assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_regex(file_name, pattern, replacement, expected=1):
              path = Path(file_name)
              source = path.read_text()
              updated, count = re.subn(pattern, replacement, source, flags=re.S)
              if count != expected:
                  raise SystemExit(f"{file_name}: expected {expected} replacements, found {count}")
              path.write_text(updated)

          canonical_lifecycle = '''assert.equal(
            packageJson.scripts["build:metadata"],
            "node scripts/write-build-metadata.mjs",
          );
          assert.equal(
            packageJson.scripts.predev,
            "node scripts/vor-053-canonical-build-contracts.mjs --quick",
          );
          assert.equal(
            packageJson.scripts["test:contracts"],
            "node scripts/run-contract-suite.mjs",
          );'''

          replace_regex(
              "scripts/vor-044-operational-value-ranking-contracts.mjs",
              r'''assert\.match\(\n  packageJson\.scripts\["build:metadata"\],[\s\S]*?\n\);\nassert\.equal\(packageJson\.scripts\["pretest:contracts"\], undefined\);\nassert\.match\(\n  packageJson\.scripts\.predev,[\s\S]*?\n\);''',
              canonical_lifecycle,
          )

          replace_regex(
              "scripts/vor-045-conversation-context-contracts.mjs",
              r'''assert\.match\(\n  packageJson\.scripts\["build:metadata"\],[\s\S]*?\n\);\nassert\.match\(\n  packageJson\.scripts\.predev,[\s\S]*?\n\);''',
              canonical_lifecycle,
          )

          replace_regex(
              "scripts/vor-046-photo-ocr-contracts.mjs",
              r'''assert\.match\(\n  packageJson\.scripts\["build:metadata"\],[\s\S]*?\n\);''',
              '''assert.equal(
            packageJson.scripts["build:metadata"],
            "node scripts/write-build-metadata.mjs",
          );
          assert.equal(
            packageJson.scripts.predev,
            "node scripts/vor-053-canonical-build-contracts.mjs --quick",
          );''',
          )

          replace_regex(
              "scripts/vor-049-decision-ready-equipment-contracts.mjs",
              r'''assert\.match\(\n  packageJson\.scripts\.predev,[\s\S]*?\n\);\nassert\.match\(\n  packageJson\.scripts\["build:metadata"\],[\s\S]*?\n\);''',
              '''assert.equal(
            packageJson.scripts.predev,
            "node scripts/vor-053-canonical-build-contracts.mjs --quick",
          );
          assert.equal(
            packageJson.scripts["build:metadata"],
            "node scripts/write-build-metadata.mjs",
          );''',
          )

          replace_regex(
              "scripts/repository-hygiene-contracts.mjs",
              r'''assert\.equal\(\n  packageJson\.scripts\["test:contracts"\],[\s\S]*?\n\);\nassert\.match\(\n  packageJson\.scripts\["test:contracts"\],[\s\S]*?\n\);''',
              '''assert.equal(
            packageJson.scripts["test:contracts"],
            "node scripts/run-contract-suite.mjs",
            "The contract command must execute canonical source without preparation or mutation",
          );''',
          )

          replace_regex(
              "scripts/vor-051-manager-demo-rehearsal-contracts.mjs",
              r'''assert\.ok\(\n  packageJson\.scripts\.predev\.includes\("node scripts/vor-051-integrate-evidence-links\.mjs"\),[\s\S]*?\n\);\nassert\.ok\(\n  packageJson\.scripts\["build:metadata"\]\.includes\("node scripts/vor-051-integrate-evidence-links\.mjs"\),[\s\S]*?\n\);''',
              '''assert.equal(
            packageJson.scripts.predev,
            "node scripts/vor-053-canonical-build-contracts.mjs --quick",
            "Development must verify the canonical evidence-link source without transforming it",
          );
          assert.equal(
            packageJson.scripts["build:metadata"],
            "node scripts/write-build-metadata.mjs",
            "Production builds must use the committed evidence-link source directly",
          );''',
          )

          replace_regex(
              "scripts/vor-052-backend-modularisation-contracts.mjs",
              r'''for \(const marker of \[\n  'case "get_site_ranked_actions":',[\s\S]*?\n\]\) requireText\(entry, marker, "legacy integration guard"\);''',
              '''if (/legacy integration guards|case "get_site_ranked_actions":/.test(entry)) {
            fail("the deployable entrypoint still contains retired integration guards");
          }''',
          )

          suite_path = Path("scripts/run-contract-suite.mjs")
          suite = suite_path.read_text()
          marker = '  ["VOR-052 Ask Vorta backend modularisation", "scripts/vor-052-backend-modularisation-contracts.mjs"],\n'
          addition = marker + '  ["VOR-053 canonical Ask Vorta build", "scripts/vor-053-canonical-build-contracts.mjs"],\n'
          if suite.count(marker) != 1:
              raise SystemExit("run-contract-suite.mjs: VOR-052 registration marker is missing or duplicated")
          suite_path.write_text(suite.replace(marker, addition))
          PY
          git diff --check
      - name: Verify migrated contract groups
        run: |
          node scripts/vor-044-operational-value-ranking-contracts.mjs
          node scripts/vor-045-conversation-context-contracts.mjs
          node scripts/vor-046-photo-ocr-contracts.mjs
          node scripts/vor-049-decision-ready-equipment-contracts.mjs
          node scripts/vor-051-manager-demo-rehearsal-contracts.mjs
          node scripts/vor-052-backend-modularisation-contracts.mjs
          node scripts/vor-053-canonical-build-contracts.mjs
          node scripts/repository-hygiene-contracts.mjs
      - name: Commit canonical contract migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/vor-044-operational-value-ranking-contracts.mjs \
            scripts/vor-045-conversation-context-contracts.mjs \
            scripts/vor-046-photo-ocr-contracts.mjs \
            scripts/vor-049-decision-ready-equipment-contracts.mjs \
            scripts/vor-051-manager-demo-rehearsal-contracts.mjs \
            scripts/vor-052-backend-modularisation-contracts.mjs \
            scripts/repository-hygiene-contracts.mjs \
            scripts/run-contract-suite.mjs
          git commit -m "VOR-053 migrate contracts to canonical source"
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
