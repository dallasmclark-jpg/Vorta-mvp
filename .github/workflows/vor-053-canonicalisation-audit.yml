name: VOR-053 materialise canonical source

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/vor-053-canonicalisation-audit.yml"

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply the validated legacy integration chain once
        run: npm run predev
      - name: Verify the exact canonical source delta
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/vor-053-expected.txt <<'EOF'
          scripts/ask-vorta-live-evals.mjs
          scripts/vor-044-operational-value-ranking-contracts.mjs
          scripts/vor-045-conversation-context-contracts.mjs
          scripts/vor-046-photo-ocr-contracts.mjs
          scripts/vor-049-decision-ready-equipment-contracts.mjs
          src/screens/AiOperations/AskVortaWorkspace.tsx
          src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx
          src/screens/AiOperations/vortaAgentService.ts
          EOF
          git diff --name-only | sort > /tmp/vor-053-actual.txt
          diff -u /tmp/vor-053-expected.txt /tmp/vor-053-actual.txt
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check
      - name: Commit canonical generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/ask-vorta-live-evals.mjs \
            scripts/vor-044-operational-value-ranking-contracts.mjs \
            scripts/vor-045-conversation-context-contracts.mjs \
            scripts/vor-046-photo-ocr-contracts.mjs \
            scripts/vor-049-decision-ready-equipment-contracts.mjs \
            src/screens/AiOperations/AskVortaWorkspace.tsx \
            src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx \
            src/screens/AiOperations/vortaAgentService.ts
          git commit -m "VOR-053 materialise Ask Vorta generated source"
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
