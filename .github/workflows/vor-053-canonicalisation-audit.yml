name: VOR-053 legacy scaffolding audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/vor-053-canonicalisation-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: List legacy Ask Vorta scaffolding and references
        shell: bash
        run: |
          set -euo pipefail
          echo "## Candidate scaffolding"
          find scripts -maxdepth 2 -type f \
            \( -name 'vor-044-integrate-*' \
            -o -name 'vor-045-normalise-*' \
            -o -name 'vor-045-integrate-*' \
            -o -name 'vor-046-integrate-*' \
            -o -name 'vor-047-integrate-*' \
            -o -name 'vor-048-integrate-*' \
            -o -name 'vor-048-*.patch' \
            -o -name 'vor-049-integrate-*' \
            -o -name 'vor-051-integrate-*' \
            -o -path 'scripts/templates/vor-044-*' \
            -o -path 'scripts/templates/vor-045-*' \
            -o -path 'scripts/templates/vor-046-*' \
            -o -path 'scripts/templates/vor-047-*' \
            -o -path 'scripts/templates/vor-048-*' \
            -o -path 'scripts/templates/vor-049-*' \
            -o -path 'scripts/templates/vor-051-*' \) \
            -print | sort | tee /tmp/vor-053-candidates.txt

          echo
          echo "## References outside candidate scaffolding"
          while IFS= read -r file; do
            base="$(basename "$file")"
            grep -RInF --exclude="$base" "$base" package.json .github scripts netlify src tests 2>/dev/null || true
          done < /tmp/vor-053-candidates.txt

          echo
          echo "## Remaining package lifecycle"
          node -e 'const p=require("./package.json"); console.log(JSON.stringify({predev:p.scripts.predev,buildMetadata:p.scripts["build:metadata"],contracts:p.scripts["test:contracts"],build:p.scripts.build},null,2))'
