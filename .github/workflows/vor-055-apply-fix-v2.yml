name: Run robust VOR-055 patch and validation

on:
  push:
    branches:
      - agent/vor-055-production-verifier
    paths:
      - ".github/workflows/vor-055-apply-fix-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vor-055-apply-fix-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out VOR-055 branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-055-production-verifier
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused VOR-055 patch
        run: python scripts/vor-055-apply-fix.py

      - name: Install dependencies
        run: npm ci --silent

      - name: Run focused VOR-055 contracts
        run: node scripts/vor-055-production-verification-contracts.mjs

      - name: Run canonical production build and permanent checks
        run: npm run build

      - name: Commit verified VOR-055 patch
        shell: bash
        run: |
          git config user.name "Vorta Engineering Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix VOR-055 production verification"
          git push origin HEAD:agent/vor-055-production-verifier

# Structural VOR-037 compatibility check repaired before this rerun.
