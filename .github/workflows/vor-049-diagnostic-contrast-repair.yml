name: VOR-049 diagnostic contrast repair

on:
  push:
    branches:
      - agent/vor-049-diagnostic-contrast-repair
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vor-049-diagnostic-contrast-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Patch and validate diagnostic contrast directness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: 5a9c496fd1e2056d651cbff1a5a0da72818a2393
      WORKFLOW_FILE: .github/workflows/vor-049-diagnostic-contrast-repair.yml
      PATCH_FILE: scripts/tmp-vor049-diagnostic-contrast-patch.py

    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify temporary branch scope
        shell: bash
        run: |
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          git diff --name-only "$EXPECTED_MAIN" HEAD | sort > /tmp/before.txt
          printf '%s\n' "$WORKFLOW_FILE" "$PATCH_FILE" | sort > /tmp/expected-before.txt
          diff -u /tmp/expected-before.txt /tmp/before.txt

      - name: Apply bounded VOR-049 patch
        run: python "$PATCH_FILE"

      - name: Remove temporary scaffolding from candidate tree
        run: rm "$WORKFLOW_FILE" "$PATCH_FILE"

      - name: Verify exact four-file candidate scope
        shell: bash
        run: |
          git diff --name-only "$EXPECTED_MAIN" | sort > /tmp/after.txt
          printf '%s\n' \
            netlify/functions/ask-vorta/equipment-evidence.mts \
            scripts/ask-vorta-live-evals.mjs \
            scripts/vor-049-decision-ready-equipment-contracts.mjs \
            tests/evals/vor-033-demo-golden.json | sort > /tmp/expected-after.txt
          diff -u /tmp/expected-after.txt /tmp/after.txt

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Run focused VOR-049 contract
        run: node scripts/vor-049-decision-ready-equipment-contracts.mjs

      - name: Prove diagnostic contrast behaviour
        shell: bash
        run: |
          npx tsc -p .tmp-vor049-tsconfig.json
          node .tmp-vor049-behaviour.mjs

      - name: Run TypeScript
        run: npm run typecheck

      - name: Run complete permanent contract suite
        run: npm run test:contracts

      - name: Run route smoke tests
        run: npm run test:smoke

      - name: Build production bundle without deployment
        run: npm run build

      - name: Run performance budget
        run: npm run test:performance

      - name: Clean temporary test files and recheck scope
        shell: bash
        run: |
          rm -rf .tmp-vor049-build .tmp-vor049-tsconfig.json .tmp-vor049-behaviour.mjs
          git diff --name-only "$EXPECTED_MAIN" | sort > /tmp/final.txt
          printf '%s\n' \
            netlify/functions/ask-vorta/equipment-evidence.mts \
            scripts/ask-vorta-live-evals.mjs \
            scripts/vor-049-decision-ready-equipment-contracts.mjs \
            tests/evals/vor-033-demo-golden.json | sort > /tmp/expected-final.txt
          diff -u /tmp/expected-final.txt /tmp/final.txt

      - name: Commit only after every gate passes
        shell: bash
        run: |
          git config user.name "Vorta Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VOR-049: make diagnostic contrast answers decision-first"
          git push origin HEAD:${GITHUB_REF_NAME}
