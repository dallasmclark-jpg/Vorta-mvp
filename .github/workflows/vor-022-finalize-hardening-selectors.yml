name: VOR-022 Finalize Hardening Selectors

on:
  push:
    branches:
      - refactor/vor-022-semantic-responsive-hooks
    paths:
      - scripts/finalize-vor-022-hardening-selectors.mjs
      - .github/workflows/vor-022-finalize-hardening-selectors.yml

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'run hardening selector finalizer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/vor-022-semantic-responsive-hooks
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize responsive hardening selectors
        run: node scripts/finalize-vor-022-hardening-selectors.mjs
      - name: Run focused contracts
        run: |
          node scripts/mobile-portal-audit-contracts.mjs
          node scripts/mobile-portal-final-polish-contracts.mjs
      - name: Commit selector refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "VOR-022: finalize semantic hardening selectors"
          git push origin HEAD:refactor/vor-022-semantic-responsive-hooks
