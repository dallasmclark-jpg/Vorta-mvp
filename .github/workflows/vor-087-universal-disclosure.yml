name: VOR-087 universal Ask Vorta disclosure

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/screens/AiOperations/**"
      - "scripts/vor-087-universal-disclosure-contracts.mjs"
      - "tests/browser/vor-087-universal-disclosure.spec.ts"
      - ".github/workflows/vor-087-universal-disclosure.yml"
  push:
    branches:
      - main
    paths:
      - "src/screens/AiOperations/**"
      - "scripts/vor-087-universal-disclosure-contracts.mjs"
      - "tests/browser/vor-087-universal-disclosure.spec.ts"
      - ".github/workflows/vor-087-universal-disclosure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-answer-hierarchy:
    name: phone tablet desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000001

    steps:
      - name: Check out tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Verify VOR-087 source contract
        run: node scripts/vor-087-universal-disclosure-contracts.mjs

      - name: Verify authenticated browser secret
        shell: bash
        run: test -n "$VORTA_E2E_PASSWORD"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run universal answer hierarchy on all device classes
        run: |
          npx playwright test \
            tests/browser/vor-087-universal-disclosure.spec.ts \
            --config=playwright.config.ts \
            --project=phone-360 \
            --project=samsung-tablet-portrait \
            --project=samsung-tablet-landscape \
            --project=laptop-1366 \
            --project=desktop-1920

      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vor-087-responsive-answer-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
