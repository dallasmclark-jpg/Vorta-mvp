name: VOR-056 deployment integrity patch

on:
  push:
    branches:
      - agent/vor-056-backlog-action-plan
    paths:
      - .github/workflows/vor-056-deployment-integrity-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vor-056-backlog-action-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent

      - name: Bind the deployed entrypoint to the current response validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          entry_path = Path("netlify/functions/ask-vorta.mts")
          validation_path = Path("netlify/functions/ask-vorta/response-validation.mts")
          contract_path = Path("scripts/vor-056-backlog-action-plan-contracts.mjs")

          entry = entry_path.read_text()
          validation = validation_path.read_text()
          contract = contract_path.read_text()

          revision_export = '''export const ASK_VORTA_RESPONSE_VALIDATION_REVISION =
            "vor-056-final-backlog-boundary-v1";

          '''
          validation_marker = "export function replaceReleasedWording("
          if "ASK_VORTA_RESPONSE_VALIDATION_REVISION" not in validation:
              if validation_marker not in validation:
                  raise SystemExit("response-validation export marker not found")
              validation = validation.replace(
                  validation_marker,
                  revision_export + validation_marker,
                  1,
              )

          default_import = 'import handler from "./ask-vorta/runtime.mjs";\n'
          revision_import = '''import {
            ASK_VORTA_RESPONSE_VALIDATION_REVISION,
          } from "./ask-vorta/response-validation.mjs";
          '''
          integrity_check = '''
          if (
            ASK_VORTA_RESPONSE_VALIDATION_REVISION !==
            "vor-056-final-backlog-boundary-v1"
          ) {
            throw new Error("Ask Vorta response-validation bundle revision mismatch.");
          }
          '''
          if "ASK_VORTA_RESPONSE_VALIDATION_REVISION" not in entry:
              if default_import not in entry:
                  raise SystemExit("Ask Vorta entrypoint delegation import not found")
              entry = entry.replace(
                  default_import,
                  default_import + revision_import + integrity_check,
                  1,
              )
          entry = entry.replace(
              'export const ASK_VORTA_RUNTIME_REVISION = "vor-056-backlog-action-plan-v2";\n\n',
              "",
          )

          contract_marker = 'assert.equal(scenarios.length, 1, "VOR-056 must retain one focused live scenario");'
          contract_block = '''for (const marker of [
            "ASK_VORTA_RESPONSE_VALIDATION_REVISION",
            '"vor-056-final-backlog-boundary-v1"',
          ]) {
            assert.ok(
              responseValidation.includes(marker),
              `The response-validation deployment revision is missing ${marker}`,
            );
            assert.ok(
              entrypoint.includes(marker),
              `The Netlify entrypoint deployment integrity check is missing ${marker}`,
            );
          }
          assert.ok(
            entrypoint.includes(
              'import handler from "./ask-vorta/runtime.mjs";',
            ) && entrypoint.includes("export default handler;"),
            "The deployment integrity check must preserve the thin Netlify handler delegation",
          );

          '''
          if "The response-validation deployment revision is missing" not in contract:
              if contract_marker not in contract:
                  raise SystemExit("VOR-056 contract insertion marker not found")
              contract = contract.replace(
                  contract_marker,
                  contract_block + contract_marker,
                  1,
              )
          contract = contract.replace(
              '''assert.ok(
            entrypoint.includes(
              'export const ASK_VORTA_RUNTIME_REVISION = "vor-056-backlog-action-plan-v2";',
            ),
            "The Netlify entrypoint must rev when nested Ask Vorta runtime behaviour changes",
          );
          ''',
              "",
          )

          entry_path.write_text(entry)
          validation_path.write_text(validation)
          contract_path.write_text(contract)
          PY

      - name: Verify focused and complete source
        run: |
          npm run build:metadata
          npm run typecheck -- --pretty false
          node scripts/vor-052-backend-modularisation-contracts.mjs
          node scripts/vor-056-backlog-action-plan-contracts.mjs
          npm run test:contracts
          npm run test:smoke
          npx vite build
          npm run test:performance

      - name: Enforce focused diff
        shell: bash
        run: |
          allowed='^(netlify/functions/ask-vorta\.mts|netlify/functions/ask-vorta/response-validation\.mts|scripts/vor-056-backlog-action-plan-contracts\.mjs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --check

      - name: Commit verified deployment integrity patch
        shell: bash
        run: |
          git config user.name "Ask Vorta CI"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/ask-vorta.mts \
            netlify/functions/ask-vorta/response-validation.mts \
            scripts/vor-056-backlog-action-plan-contracts.mjs
          git diff --cached --quiet && { echo "No permanent changes"; exit 1; }
          git commit -m "Bind Ask Vorta deploy to final response validator"
          git push origin HEAD:agent/vor-056-backlog-action-plan
