name: VOR-035 Samsung tablet recovery gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/screens/AiOperations/**"
      - "src/screens/Engineers/**"
      - "src/screens/LabourRisk/**"
      - "src/screens/SkillsMatrix/**"
      - "src/screens/Equipment/**"
      - "src/screens/StoresInventory/**"
      - "src/components/**"
      - "src/lib/**"
      - "tests/browser/vor-035-tablet-recovery.spec.ts"
      - "playwright.config.ts"
      - ".github/workflows/vor-035-tablet-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vor-035-tablet-recovery-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tablet-recovery:
    name: Authenticated Samsung tablet evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000001

    steps:
      - name: Check out recovery commit
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Verify tablet recovery compiles
        run: npm run typecheck -- --pretty false

      - name: Install browser-test runner
        run: npm install --no-save --package-lock=false --silent @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated Samsung tablet recovery journey
        id: tablet-regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test \
            tests/browser/vor-035-tablet-recovery.spec.ts \
            --project=samsung-tablet-portrait \
            --project=samsung-tablet-landscape \
            --config=playwright.config.ts \
            2>&1 | tee vor-035-tablet-recovery.log

      - name: Preserve Samsung tablet screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vor-035-samsung-tablet-evidence-${{ github.sha }}
          path: |
            vor-035-tablet-recovery.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Samsung tablet result
        if: steps.tablet-regression.outcome == 'failure'
        run: exit 1
