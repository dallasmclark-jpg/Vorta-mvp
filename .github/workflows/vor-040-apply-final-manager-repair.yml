name: VOR-040 apply final manager repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/vor-040-natural-question-audit-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Apply final manager repair
        run: python .github/scripts/vor-040-final-manager-repair.py

      - name: Verify backend TypeScript
        run: npm run typecheck:functions

      - name: Verify focused Ask Vorta contracts
        run: node scripts/run-contract-suite.mjs "VOR-037" "VOR-038" "VOR-039" "VOR-040" "VOR-042" "Ask Vorta agent"

      - name: Remove disposable scaffolding
        run: rm .github/scripts/vor-040-final-manager-repair.py .github/workflows/vor-040-apply-final-manager-repair.yml

      - name: Commit verified final manager repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vorta CI"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/ask-vorta.mts scripts/vor-040-natural-question-contracts.mjs .github/scripts/vor-040-final-manager-repair.py .github/workflows/vor-040-apply-final-manager-repair.yml
          git diff --cached --check
          git commit -m "VOR-040: close remaining manager evidence gaps"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
