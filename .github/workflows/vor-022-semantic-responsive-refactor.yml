name: VOR-022 Semantic Responsive Refactor

on:
  push:
    branches:
      - refactor/vor-022-semantic-responsive-hooks
    paths:
      - scripts/finalize-vor-022-semantic-responsive-hooks.mjs
      - .github/workflows/vor-022-semantic-responsive-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'run semantic refactor finalizer')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/vor-022-semantic-responsive-hooks
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Finalise semantic responsive hooks
        run: node scripts/finalize-vor-022-semantic-responsive-hooks.mjs

      - name: Run focused source contracts
        run: node scripts/mobile-portal-final-polish-contracts.mjs

      - name: Commit finalised refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "VOR-022: finalise semantic responsive hooks"
          git push origin HEAD:refactor/vor-022-semantic-responsive-hooks
