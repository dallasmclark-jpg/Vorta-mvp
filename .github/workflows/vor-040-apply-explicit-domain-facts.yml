name: VOR-040 apply explicit equipment domain facts

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/vor-040-natural-question-audit-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect completed domain repair
        id: state
        shell: bash
        run: |
          if grep -q 'explicitEquipmentDomainFacts' netlify/functions/ask-vorta.mts; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.skip != 'true'
        run: npm ci

      - name: Apply explicit domain evidence repair
        if: steps.state.outputs.skip != 'true'
        run: |
          python3 scripts/vor-040-explicit-domain-facts-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/vor-040-natural-question-contracts.mjs')
          source = path.read_text()
          old = '''  "const questionRanked = relevantEquipmentDecisionFacts(question, rankedFacts)",
          "typeof value !== \\\"object\\\"",
          "pathSegments",'''
          new = '''  "explicitEquipmentDomainFacts",
          "nestedDecisionRecords",
          "work evidence",
          "spare evidence",
          "capability evidence",
          "document evidence",
          "const questionRanked = relevantEquipmentDecisionFacts(\n    question,\n    [...explicitFacts, ...rankedFacts]",
          "...selectedFacts,\n      ...textValues(answer.evidence)",
          "typeof value !== \\\"object\\\"",
          "pathSegments",'''
          if old not in source:
              raise SystemExit('VOR-040 explicit-domain contract anchor missing')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Verify backend TypeScript and Ask Vorta contracts
        if: steps.state.outputs.skip != 'true'
        run: |
          npm run typecheck:functions
          node scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs
          node scripts/vor-040-natural-question-contracts.mjs
          node scripts/ask-vorta-agent-contracts.mjs

      - name: Remove disposable repair scaffolding
        if: steps.state.outputs.skip != 'true'
        run: |
          rm scripts/vor-040-explicit-domain-facts-patch.py
          rm .github/workflows/vor-040-apply-explicit-domain-facts.yml

      - name: Commit verified explicit domain repair
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/ask-vorta.mts scripts/vor-040-natural-question-contracts.mjs
          git add -u scripts/vor-040-explicit-domain-facts-patch.py .github/workflows/vor-040-apply-explicit-domain-facts.yml
          git commit -m 'VOR-040: retain explicit equipment domain evidence'
          git push origin HEAD:${{ github.head_ref }}
