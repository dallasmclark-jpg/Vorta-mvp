name: VOR-071 future role data truth

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/components/PrototypePortalUnavailable.tsx"
      - "src/screens/ProductionManager/ProductionManagerPortal.tsx"
      - "src/screens/OperatorPortal/OperatorPortal.tsx"
      - "src/screens/ContractorPortal/ContractorPortal.tsx"
      - "scripts/vor-071-future-role-data-truth-contracts.mjs"
      - "tests/browser/vor-071-future-role-data-truth.spec.ts"
      - ".github/workflows/vor-071-future-role-data-truth.yml"
  push:
    branches:
      - main
    paths:
      - "src/components/PrototypePortalUnavailable.tsx"
      - "src/screens/ProductionManager/ProductionManagerPortal.tsx"
      - "src/screens/OperatorPortal/OperatorPortal.tsx"
      - "src/screens/ContractorPortal/ContractorPortal.tsx"
      - "scripts/vor-071-future-role-data-truth-contracts.mjs"
      - "tests/browser/vor-071-future-role-data-truth.spec.ts"
      - ".github/workflows/vor-071-future-role-data-truth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Honest future-role portal evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Verify application TypeScript
        run: npm run typecheck -- --pretty false

      - name: Verify future-role data-truth contract
        run: node scripts/vor-071-future-role-data-truth-contracts.mjs

      - name: Verify existing permanent contracts
        run: npm run test:contracts

      - name: Verify route smoke
        run: npm run test:smoke

      - name: Build production assets
        run: npx vite build

      - name: Enforce production performance budgets
        run: npm run test:performance

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify authenticated phone tablet and desktop role routes
        run: >-
          npx playwright test
          tests/browser/vor-071-future-role-data-truth.spec.ts
          --project=phone-360
          --project=samsung-tablet-portrait
          --project=samsung-tablet-landscape
          --project=desktop-1920
          --config=playwright.config.ts

      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vor-071-failure-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
