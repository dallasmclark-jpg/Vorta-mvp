name: Engineer calendar CSS fix

on:
  push:
    branches:
      - agent/engineer-calendar-profile

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/engineer-calendar-profile
      - name: Apply CSS budget fix
        run: python .github/engineer_calendar_css_fix.py
      - name: Remove one-shot files
        run: rm .github/workflows/engineer-calendar-css-fix.yml .github/engineer_calendar_css_fix.py
      - name: Commit CSS budget fix
        run: |
          git config user.name "Vorta release agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/EngineerPortal/EngineerRotaScreen.tsx .github/workflows/engineer-calendar-css-fix.yml .github/engineer_calendar_css_fix.py
          git commit -m "Keep Engineer calendar inside CSS budget"
          git push origin HEAD:agent/engineer-calendar-profile
