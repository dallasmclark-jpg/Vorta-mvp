name: VOR-039 response shape patch v2

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/vor-039-response-shape-patch-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vor-039-ask-vorta-confidence-latency
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and repair response-shape patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/vor-039-response-shape-patch.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )

          block_start_marker = "agent = replace_once(\n    agent,\n    '''        enforceAnswerEvidence("
          block_start = script.index(block_start_marker)
          block_end_marker = '\n\nagent = replace_once(\n    agent,\n    "Summarise what the previous shift completed'
          block_end = script.index(block_end_marker, block_start)
          replacement = '''answer_evidence_call = """        enforceAnswerEvidence(
            answer,
            request.question,
            shiftCoverEvidence,
            shiftCoverArguments,
          );
          """
          agent = replace_once(
              agent,
              answer_evidence_call,
              answer_evidence_call + "        enforceDeterministicResponseShape(answer, questionPlan);\\n",
              "apply deterministic response-shape helper",
          )'''
          script = script[:block_start] + replacement + script[block_end:]
          Path('/tmp/apply-vor-039-response-shape.py').write_text(script + "\n")
          PY
          python /tmp/apply-vor-039-response-shape.py

      - name: Install dependencies
        run: npm ci

      - name: Verify focused implementation
        run: |
          npm run typecheck:functions
          node scripts/vor-038-ask-vorta-intelligence-contracts.mjs
          node scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs
          node scripts/ask-vorta-agent-contracts.mjs

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/vor-039-response-shape-patch.yml
          rm .github/workflows/vor-039-response-shape-patch-v2.yml
          git config user.name "Vorta Agent"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/ask-vorta.mts \
            scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs \
            .github/workflows/vor-039-response-shape-patch.yml \
            .github/workflows/vor-039-response-shape-patch-v2.yml
          git commit -m "VOR-039: enforce fast-route response shape [vor-039 response shape]"
          git push origin HEAD:agent/vor-039-ask-vorta-confidence-latency
