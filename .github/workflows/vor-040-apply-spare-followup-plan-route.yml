name: VOR-040 apply spare follow-up and maintenance plan

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/vor-040-natural-question-audit-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect completed routing repair
        id: state
        shell: bash
        run: |
          if grep -q 'equipment_spare_blocker' netlify/edge-functions/ask-vorta-work-backlog.ts && grep -q 'maintenancePlanOnly' netlify/functions/ask-vorta.mts; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.skip != 'true'
        run: npm ci

      - name: Apply routing repair
        if: steps.state.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/vor-040-spare-followup-plan-route-patch.py')
          source = path.read_text()
          old = '''    '  "MIXED_DECISION_PATTERN",\\n  "EQUIPMENT_CODE_PATTERN",',
              '  "MIXED_DECISION_PATTERN",\\n  "EQUIPMENT_CODE_PATTERN",\\n  "EQUIPMENT_SPARE_FOLLOW_UP_PATTERN",\\n  "isEquipmentSpareFollowUp",\\n  "equipmentReferenceFromRequest",\\n  "componentConstraintScore",\\n  \\'toolsUsed: ["get_equipment_spares"]\\',\\n  \\'intentLabel: "equipment_spare_blocker"\\',',
              "edge spare route contracts",'''
          new = '''    '  "CAPABILITY_PATTERN",\\n  "isCapabilityRequest",',
              '  "CAPABILITY_PATTERN",\\n  "isCapabilityRequest",\\n  "EQUIPMENT_SPARE_FOLLOW_UP_PATTERN",\\n  "isEquipmentSpareFollowUp",\\n  "equipmentReferenceFromRequest",\\n  "componentConstraintScore",\\n  \\'toolsUsed: ["get_equipment_spares"]\\',\\n  \\'intentLabel: "equipment_spare_blocker"\\',',
              "edge spare route contracts",'''
          if old not in source:
              raise SystemExit('VOR-040 patch-script contract migration anchor missing')
          path.write_text(source.replace(old, new, 1))
          PY
          python3 scripts/vor-040-spare-followup-plan-route-patch.py

      - name: Verify backend and edge TypeScript
        if: steps.state.outputs.skip != 'true'
        run: |
          npm run typecheck:functions
          npx tsc --noEmit --strict --skipLibCheck --moduleResolution bundler --module ESNext --target ES2022 --lib ES2022,DOM netlify/edge-functions/ask-vorta-work-backlog.ts

      - name: Verify Ask Vorta contracts
        if: steps.state.outputs.skip != 'true'
        run: |
          node scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs
          node scripts/vor-040-natural-question-contracts.mjs
          node scripts/ask-vorta-agent-contracts.mjs

      - name: Remove disposable repair scaffolding
        if: steps.state.outputs.skip != 'true'
        run: |
          rm scripts/vor-040-spare-followup-plan-route-patch.py
          rm .github/workflows/vor-040-apply-spare-followup-plan-route.yml

      - name: Commit verified routing repair
        if: steps.state.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/ask-vorta.mts netlify/edge-functions/ask-vorta-work-backlog.ts scripts/vor-040-natural-question-contracts.mjs
          git add -u scripts/vor-040-spare-followup-plan-route-patch.py .github/workflows/vor-040-apply-spare-followup-plan-route.yml
          git commit -m 'VOR-040: accelerate spare follow-ups and isolate maintenance plans'
          git push origin HEAD:${{ github.head_ref }}
