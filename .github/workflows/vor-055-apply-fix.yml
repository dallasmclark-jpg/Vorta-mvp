name: Apply VOR-055 production verifier fix

on:
  push:
    branches:
      - agent/vor-055-production-verifier
    paths:
      - ".github/workflows/vor-055-apply-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vor-055-apply-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out VOR-055 branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-055-production-verifier
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused VOR-055 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path("netlify/functions/ask-vorta/route-planning.mts")
          route = route_path.read_text()

          helper = r'''function parseEnglishDateRange(
            question: string,
          ): { startDate: string; endDate: string } | null {
            const months: Record<string, number> = {
              jan: 1,
              feb: 2,
              mar: 3,
              apr: 4,
              may: 5,
              jun: 6,
              jul: 7,
              aug: 8,
              sep: 9,
              oct: 10,
              nov: 11,
              dec: 12,
            };
            const monthPattern =
              "jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?";
            const normalized = question
              .toLowerCase()
              .replace(/[’']/g, "'")
              .replace(/[,–—]/g, " ")
              .replace(/\s+/g, " ")
              .trim();
            const toIsoDate = (
              dayText: string,
              monthText: string,
              yearText: string,
            ): string | null => {
              const day = Number(dayText);
              const month = months[monthText.slice(0, 3)];
              const year = Number(yearText);
              if (!month || !Number.isInteger(day) || !Number.isInteger(year)) return null;
              const date = new Date(Date.UTC(year, month - 1, day));
              if (
                date.getUTCFullYear() !== year ||
                date.getUTCMonth() !== month - 1 ||
                date.getUTCDate() !== day
              ) {
                return null;
              }
              return date.toISOString().slice(0, 10);
            };

            const rangeMatch = normalized.match(
              new RegExp(
                `\\b(?:from\\s+|between\\s+)(\\d{1,2})(?:st|nd|rd|th)?\\s+(${monthPattern})(?:\\s+(\\d{4}))?\\s+(?:to|and)\\s+(\\d{1,2})(?:st|nd|rd|th)?\\s+(${monthPattern})(?:\\s+(\\d{4}))?\\b`,
                "i",
              ),
            );
            if (rangeMatch) {
              const sharedYear = rangeMatch[6] || rangeMatch[3];
              if (!sharedYear) return null;
              const startDate = toIsoDate(
                rangeMatch[1],
                rangeMatch[2],
                rangeMatch[3] || sharedYear,
              );
              const endDate = toIsoDate(
                rangeMatch[4],
                rangeMatch[5],
                rangeMatch[6] || sharedYear,
              );
              if (!startDate || !endDate || startDate > endDate) return null;
              return { startDate, endDate };
            }

            const singleMatch = normalized.match(
              new RegExp(
                `\\b(?:on\\s+|for\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+(${monthPattern})\\s+(\\d{4})\\b`,
                "i",
              ),
            );
            if (!singleMatch) return null;
            const date = toIsoDate(singleMatch[1], singleMatch[2], singleMatch[3]);
            return date ? { startDate: date, endDate: date } : null;
          }

          '''
          export_marker = "export function deterministicQuestionPlan(\n"
          if "function parseEnglishDateRange(" not in route:
              assert export_marker in route
              route = route.replace(export_marker, helper + export_marker, 1)

          context_marker = "  const contextText = [...request.history.map((item) => item.content), request.question].join(\" \");\n"
          date_context = r'''  const explicitCoverRange = parseEnglishDateRange(request.question);
            const absoluteWorkforceQuestion =
              explicitCoverRange !== null &&
              /\b(?:who(?:'s| is)? off|holiday|absence|leave|training|available|availability|cover|coverage|rest conflict|fatigue|rota|engineers?|team|shift)\b/.test(
                question,
              );

          '''
          if "const explicitCoverRange = parseEnglishDateRange(" not in route:
              assert context_marker in route
              route = route.replace(context_marker, date_context + context_marker, 1)

          assert "  if (equipmentQuery) {" in route
          route = route.replace(
              "  if (equipmentQuery) {",
              "  if (equipmentQuery && !absoluteWorkforceQuestion) {",
              1,
          )

          old_range = '''  const requestedCoverRange = nextWeek
              ? nextWeekRange()
              : thisWeek
                ? thisWeekRange()
                : { startDate: coverDate ?? today, endDate: coverDate ?? today };'''
          new_range = '''  const requestedCoverRange =
              explicitCoverRange ??
              (nextWeek
                ? nextWeekRange()
                : thisWeek
                  ? thisWeekRange()
                  : { startDate: coverDate ?? today, endDate: coverDate ?? today });'''
          assert old_range in route
          route = route.replace(old_range, new_range, 1)

          assert "if (planAndCover && (coverDate || nextWeek || thisWeek))" in route
          route = route.replace(
              "if (planAndCover && (coverDate || nextWeek || thisWeek))",
              "if (planAndCover && (explicitCoverRange || coverDate || nextWeek || thisWeek))",
              1,
          )

          old_dated = '''  const datedWorkforceQuestion =
              (coverDate !== null || nextWeek || thisWeek) &&'''
          new_dated = '''  const datedWorkforceQuestion =
              (explicitCoverRange !== null || coverDate !== null || nextWeek || thisWeek) &&'''
          assert old_dated in route
          route = route.replace(old_dated, new_dated, 1)

          contractor_old = '''      "Report only recorded contractor skills and availability, with any confirmation caveat.",
              { summaryItemLimit: 4 },'''
          contractor_new = '''      "Report only recorded contractor skills and availability, with the first confirmation action and any caveat.",
              { summaryItemLimit: 4, forceActionPlan: true },'''
          assert contractor_old in route
          route = route.replace(contractor_old, contractor_new, 1)

          backlog_old = '''      "Prioritise the current work backlog using exact orders, assets, dates and readiness evidence.",
              { summaryItemLimit: 4 },'''
          backlog_new = '''      "Prioritise the current work backlog using exact orders, assets, dates and readiness evidence, then state the first executable action.",
              { summaryItemLimit: 4, forceActionPlan: true },'''
          assert backlog_old in route
          route = route.replace(backlog_old, backlog_new, 1)
          route_path.write_text(route)

          workflow_path = Path(".github/workflows/maintenance-manager-production.yml")
          workflow_path.write_text(r'''name: Maintenance Manager production verification

          on:
            workflow_run:
              workflows:
                - Maintenance Manager quality gate
              types:
                - completed

          permissions:
            contents: read

          concurrency:
            group: maintenance-manager-production-${{ github.event.workflow_run.head_sha }}
            cancel-in-progress: true

          jobs:
            production:
              if: >-
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.head_branch == 'main'
              name: Verify exact production commit
              runs-on: ubuntu-latest
              timeout-minutes: 40
              env:
                EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
                VORTA_PRODUCTION_URL: https://vorta-app.netlify.app
                VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
                VORTA_E2E_EMAIL: demo@vorta.network
                VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
                VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
                VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
                VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
                VITE_SUPABASE_ANON_KEY: sb_publishable_JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq

              steps:
                - name: Check out deployed commit
                  uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.workflow_run.head_sha }}
                    show-progress: false

                - name: Use Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install application dependencies
                  run: npm ci --silent

                - name: Verify Netlify serves the exact tested commit
                  run: node scripts/verify-production-commit.mjs

                - name: Verify authenticated browser-test secret
                  shell: bash
                  run: |
                    test -n "$VORTA_E2E_PASSWORD" || {
                      echo "VORTA_E2E_PASSWORD is not configured for production verification." >&2
                      exit 1
                    }

                - name: Run first 12 Ask Vorta production decisions
                  id: production_window_one
                  continue-on-error: true
                  shell: bash
                  env:
                    VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
                    VORTA_EVAL_SITE_ID: ${{ env.VORTA_E2E_SITE_ID }}
                    VORTA_EVAL_OFFSET: 0
                    VORTA_EVAL_LIMIT: 12
                  run: |
                    set -o pipefail
                    npm run eval:ask-vorta:live 2>&1 | tee ask-vorta-production-window-1.log

                - name: Reset production evaluation rate window
                  if: always()
                  run: sleep 310

                - name: Run final Ask Vorta production decision
                  id: production_window_two
                  if: always()
                  continue-on-error: true
                  shell: bash
                  env:
                    VORTA_EVAL_BASE_URL: https://vorta-app.netlify.app
                    VORTA_EVAL_SITE_ID: ${{ env.VORTA_E2E_SITE_ID }}
                    VORTA_EVAL_OFFSET: 12
                    VORTA_EVAL_LIMIT: 1
                  run: |
                    set -o pipefail
                    npm run eval:ask-vorta:live 2>&1 | tee ask-vorta-production-window-2.log

                - name: Preserve Ask Vorta production evaluation evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: ask-vorta-production-evidence-${{ github.event.workflow_run.head_sha }}
                    path: |
                      ask-vorta-production-window-1.log
                      ask-vorta-production-window-2.log
                    if-no-files-found: error
                    retention-days: 14

                - name: Enforce Ask Vorta production evaluations
                  if: always()
                  shell: bash
                  run: |
                    test "${{ steps.production_window_one.outcome }}" = "success" || {
                      echo "The first 12 Ask Vorta production decisions failed." >&2
                      exit 1
                    }
                    test "${{ steps.production_window_two.outcome }}" = "success" || {
                      echo "The final Ask Vorta production decision failed." >&2
                      exit 1
                    }

                - name: Install browser-test runner without changing the lockfile
                  run: npm install --no-save --package-lock=false --silent @playwright/test@1.55.0

                - name: Install Chromium
                  run: npx playwright install --with-deps chromium

                - name: Run authenticated production regression
                  run: npm run test:browser
          ''').replace("          ", "")

          contract_suite_path = Path("scripts/run-contract-suite.mjs")
          contract_suite = contract_suite_path.read_text()
          contract_line = '  ["VOR-055 Ask Vorta production verification", "scripts/vor-055-production-verification-contracts.mjs"],\n'
          if contract_line not in contract_suite:
              marker = '  ["VOR-053 canonical Ask Vorta build", "scripts/vor-053-canonical-build-contracts.mjs"],\n'
              assert marker in contract_suite
              contract_suite = contract_suite.replace(marker, marker + contract_line, 1)
              contract_suite_path.write_text(contract_suite)

          central_path = Path(".github/workflows/vor-049-validation.yml")
          central = central_path.read_text()
          trigger_block = '''      - "scripts/vor-054*"
                - "scripts/vor-055*"
                - "tests/evals/ask-vorta-live-golden.json"
                - ".github/workflows/maintenance-manager-production.yml"'''
          if '      - "scripts/vor-055*"' not in central:
              assert central.count('      - "scripts/vor-054*"') == 2
              central = central.replace('      - "scripts/vor-054*"', trigger_block)
              central_path.write_text(central)

          patch_workflow = Path(".github/workflows/vor-055-apply-fix.yml")
          assert patch_workflow.exists()
          patch_workflow.unlink()
          PY

      - name: Install dependencies
        run: npm ci --silent

      - name: Run focused VOR-055 contracts
        run: node scripts/vor-055-production-verification-contracts.mjs

      - name: Run canonical production build and permanent checks
        run: npm run build

      - name: Commit verified VOR-055 patch
        shell: bash
        run: |
          git config user.name "Vorta Engineering Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            netlify/functions/ask-vorta/route-planning.mts \
            tests/evals/ask-vorta-live-golden.json \
            scripts/vor-055-production-verification-contracts.mjs \
            scripts/run-contract-suite.mjs \
            .github/workflows/maintenance-manager-production.yml \
            .github/workflows/vor-049-validation.yml \
            .github/workflows/vor-055-apply-fix.yml
          git commit -m "Fix VOR-055 production verification"
          git push origin HEAD:agent/vor-055-production-verifier
