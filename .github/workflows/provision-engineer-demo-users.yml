name: Resolve cereal demo context

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provision-engineer-demo-users.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Resolve cereal demo context'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      SUPABASE_KEY_PREFIX: sb_publishable_
      SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      DEMO_EMAIL: demo@vorta.network
      DEMO_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      CEREAL_SITE_ID: 11000000-0000-0000-0000-000000000002

    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Inspect repository tenant references
        shell: bash
        run: |
          set -euo pipefail
          echo "--- repository references: cereal ---"
          git grep -ni -E 'cereal|11000000-0000-0000-0000-000000000002|10000000-0000-0000-0000-000000000002' -- ':!package-lock.json' || true

      - name: Inspect authenticated tenant metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEMO_PASSWORD" || { echo "Missing demo password secret" >&2; exit 1; }
          node <<'NODE'
          const base = process.env.SUPABASE_URL;
          const anon = `${process.env.SUPABASE_KEY_PREFIX}${process.env.SUPABASE_KEY_SUFFIX}`;
          const password = process.env.DEMO_PASSWORD;
          const cerealSite = process.env.CEREAL_SITE_ID;
          async function call(path, token=anon) {
            const r = await fetch(`${base}${path}`, { headers: { apikey: anon, Authorization: `Bearer ${token}` } });
            const text = await r.text();
            let data = text;
            try { data = text ? JSON.parse(text) : null; } catch {}
            return { ok:r.ok, status:r.status, data };
          }
          const login = await fetch(`${base}/auth/v1/token?grant_type=password`, {
            method:'POST',
            headers:{apikey:anon,'content-type':'application/json'},
            body:JSON.stringify({email:process.env.DEMO_EMAIL,password}),
          });
          const auth = await login.json();
          if (!login.ok || !auth.access_token) throw new Error('Demo authentication failed');
          const token = auth.access_token;
          console.log('Demo authentication verified.');

          const root = await call('/rest/v1/', token);
          if (root.ok && root.data && typeof root.data === 'object') {
            const defs = Object.keys(root.data.definitions || {}).filter((x) => /site|organi|access|profile/i.test(x));
            const paths = Object.keys(root.data.paths || {}).filter((x) => /site|organi|access|profile/i.test(x));
            console.log('Relevant REST definitions:', defs.join(', ') || '(none)');
            console.log('Relevant REST paths:', paths.join(', ') || '(none)');
          } else {
            console.log(`REST schema status ${root.status}`);
          }

          const probes = [
            ['user_site_access', `site_id=eq.${cerealSite}&select=site_id,organisation_id,app_role,active`],
            ['sites', `id=eq.${cerealSite}&select=*`],
            ['organisations', 'select=*'],
            ['organizations', 'select=*'],
            ['equipment', `site_id=eq.${cerealSite}&select=site_id,organisation_id&limit=1`],
          ];
          for (const [table,q] of probes) {
            const r = await call(`/rest/v1/${table}?${q}`, token);
            if (!r.ok) {
              const msg = r.data?.message || r.data?.hint || '';
              console.log(`${table}: status ${r.status}${msg ? ` | ${msg}` : ''}`);
              continue;
            }
            const rows = Array.isArray(r.data) ? r.data : [];
            const safe = rows.slice(0,10).map((row) => {
              const out = {};
              for (const key of ['id','site_id','organisation_id','organization_id','name','site_name','display_name','app_role','active']) {
                if (row[key] !== undefined) out[key] = row[key];
              }
              return out;
            });
            console.log(`${table}: ${rows.length} visible row(s)`, JSON.stringify(safe));
          }
          NODE
