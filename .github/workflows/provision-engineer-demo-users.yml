name: Check Vorta Supabase admin credential

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provision-engineer-demo-users.yml"

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'Check Vorta Supabase admin credential'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VORTA_SUPABASE_ACCESS_TOKEN: ${{ secrets.VORTA_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VORTA_SUPABASE_DB_PASSWORD: ${{ secrets.VORTA_SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VORTA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VORTA_SUPABASE_SERVICE_ROLE_KEY }}
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
    steps:
      - name: Report configured credential types without exposing values
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN VORTA_SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VORTA_SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY VORTA_SUPABASE_SERVICE_ROLE_KEY VORTA_E2E_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "$name=CONFIGURED"
            else
              echo "$name=NOT_CONFIGURED"
            fi
          done
