name: Find Vorta user provisioning path

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provision-engineer-demo-users.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Find Vorta user provisioning path'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Find provisioning and access-management code
        shell: bash
        run: |
          set -euo pipefail
          echo '--- user_site_access references ---'
          git grep -ni -E 'user_site_access|app_role' -- ':!package-lock.json' | head -n 250 || true
          echo '--- auth provisioning references ---'
          git grep -ni -E 'auth\.users|auth\.admin|createUser|create_user|inviteUser|invite_user|provision.*user|user.*provision|admin.*user|user.*admin' -- ':!package-lock.json' | head -n 300 || true
          echo '--- security/RPC references ---'
          git grep -ni -E 'security definer|rpc\(|from\("profiles"\)|from\("user_site_access"\)' supabase scripts src netlify tests 2>/dev/null | head -n 350 || true
