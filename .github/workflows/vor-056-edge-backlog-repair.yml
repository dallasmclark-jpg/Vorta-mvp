name: VOR-056 edge backlog repair

on:
  push:
    branches:
      - agent/vor-055-056-final-action-plan-repair
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vor-056-edge-backlog-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Patch and validate factual backlog edge response
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_MAIN: db693559b9dd55c174f96a25c899f1dd44eb3935
      WORKFLOW_FILE: .github/workflows/vor-056-edge-backlog-repair.yml
      PATCH_FILE: scripts/tmp-vor056-edge-backlog-patch.py

    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify branch descends from protected production main
        run: git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD

      - name: Apply exact edge backlog patch
        run: python "$PATCH_FILE"

      - name: Remove temporary repair scaffolding
        run: rm "$WORKFLOW_FILE" "$PATCH_FILE"

      - name: Verify exact four-file candidate scope
        shell: bash
        run: |
          git diff --name-only "$EXPECTED_MAIN" | sort > /tmp/files.txt
          printf '%s\n' \
            netlify/edge-functions/ask-vorta-work-backlog.ts \
            netlify/functions/ask-vorta.mts \
            netlify/functions/ask-vorta/runtime-document-links.mts \
            scripts/vor-056-backlog-action-plan-contracts.mjs | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Run focused VOR-056 contract
        run: node scripts/vor-056-backlog-action-plan-contracts.mjs

      - name: Run TypeScript
        run: npm run typecheck -- --pretty false

      - name: Run complete permanent contract suite
        run: npm run test:contracts

      - name: Run route smoke tests
        run: npm run test:smoke

      - name: Build production bundle without deployment
        run: npm run build

      - name: Run performance budget
        run: npm run test:performance

      - name: Recheck exact final scope
        shell: bash
        run: |
          git diff --name-only "$EXPECTED_MAIN" | sort > /tmp/final.txt
          printf '%s\n' \
            netlify/edge-functions/ask-vorta-work-backlog.ts \
            netlify/functions/ask-vorta.mts \
            netlify/functions/ask-vorta/runtime-document-links.mts \
            scripts/vor-056-backlog-action-plan-contracts.mjs | sort > /tmp/expected-final.txt
          diff -u /tmp/expected-final.txt /tmp/final.txt

      - name: Commit only after every gate passes
        shell: bash
        run: |
          git config user.name "Vorta Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VOR-056: return evidence-bounded backlog action plan at edge"
          git push origin HEAD:${GITHUB_REF_NAME}
