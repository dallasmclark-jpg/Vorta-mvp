name: VOR-094 production verification

on:
  push:
    branches:
      - fix/vor-094-neutral-graphite-surfaces

permissions:
  contents: read

jobs:
  verify:
    name: Verify corrected production hierarchy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VORTA_E2E_BASE_URL: https://vorta-app.netlify.app
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Confirm production is reachable
        shell: bash
        run: |
          for attempt in {1..24}; do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' "$VORTA_E2E_BASE_URL/dashboard" || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not become reachable in time." >&2
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run VOR-094 responsive production verification
        run: >-
          npx playwright test --config=playwright.config.ts
          tests/browser/vor-094-dark-surface-hierarchy.spec.ts
          --project=phone-360
          --project=samsung-tablet-portrait
          --project=samsung-tablet-landscape
          --project=laptop-1366
          --project=desktop-1920

      - name: Preserve VOR-094 production screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vor-094-production-evidence
          path: |
            test-results/**/*.png
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
