name: One-time run VOR-004 dashboard deep links

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply branch patch
        run: |
          git fetch origin fix/vor-004-dashboard-deep-links
          git checkout fix/vor-004-dashboard-deep-links
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/one-time-vor-004-dashboard-deep-links.yml \
            | sed '1d;$d;s/^          //' > /tmp/vor-004-patch.py
          python /tmp/vor-004-patch.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused contract
        run: node scripts/vor-004-dashboard-deep-links-contract.mjs

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Commit tested branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement VOR-004 dashboard record deep links"
          git push origin HEAD:fix/vor-004-dashboard-deep-links

      - name: Remove one-time runner from main
        if: always()
        run: |
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/one-time-run-vor-004-dashboard-deep-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time VOR-004 runner"
          git push origin main
