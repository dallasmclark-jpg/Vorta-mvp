name: One-time fix mobile Equipment browser contract

on:
  push:
    branches:
      - improve/vor-007-013-audit-actions

permissions:
  contents: write

jobs:
  patch-test-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/vor-007-013-audit-actions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update browser contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/maintenance-manager-mobile-routes.spec.ts')
          text = path.read_text()
          old = '''  const equipmentButton = page
              .locator('[data-vorta-mobile-equipment="true"] button')
              .filter({ hasText: "Open" })
              .first();
            await expect(equipmentButton).toBeVisible({ timeout: 30_000 });
            await equipmentButton.click();
            await page.waitForURL(/\/equipment\/[^/]+\/overview(?:\?.*)?$/);
          '''
          new = '''  const equipmentOverviewButton = page
              .locator('[data-vorta-mobile-equipment="true"] button[aria-label^="Open overview for "]')
              .first();
            await expect(equipmentOverviewButton).toBeVisible({ timeout: 30_000 });
            await equipmentOverviewButton.click();
            await page.waitForURL(/\/equipment\/[^/]+\/overview(?:\?.*)?$/);
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy equipment block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate focused browser contract
        env:
          VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VORTA_SUPABASE_ANON_KEY }}
          VITE_VORTA_DATA_MODE: demo
          VORTA_E2E_EMAIL: demo@vorta.network
          VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
          VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
          VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000001
          VORTA_E2E_DENIED_SITE_ID: 11000000-0000-0000-0000-000000000002
          VORTA_E2E_DENIED_EQUIPMENT_ID: 40000000-0000-0000-0000-000000000013
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.config.ts tests/browser/maintenance-manager-mobile-routes.spec.ts --project=phone-360

      - name: Commit validated correction and remove workflow
        run: |
          git rm .github/workflows/one-time-fix-mobile-equipment-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/maintenance-manager-mobile-routes.spec.ts
          git commit -m "Align mobile Equipment browser test with direct actions"
          git push origin HEAD:improve/vor-007-013-audit-actions
