name: VOR-022 Semantic Send Hook

on:
  push:
    branches:
      - refactor/vor-022-semantic-responsive-hooks
    paths:
      - scripts/apply-vor-022-send-hook.mjs
      - .github/workflows/vor-022-send-hook.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'run semantic send-hook migration')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/vor-022-semantic-responsive-hooks
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply semantic send hook
        run: node scripts/apply-vor-022-send-hook.mjs

      - name: Run focused responsive contract
        run: node scripts/mobile-portal-final-polish-contracts.mjs

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/mobile-portal-final-polish-contracts.mjs
          git commit -m "VOR-022: own mobile send styling through semantic hook"
          git push origin HEAD:refactor/vor-022-semantic-responsive-hooks
