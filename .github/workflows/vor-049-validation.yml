name: VOR-049 decision-ready equipment

on:
  pull_request:
    branches:
      - main
    paths:
      - "netlify/functions/ask-vorta.mts"
      - "netlify/functions/ask-vorta/**"
      - "src/screens/AiOperations/**"
      - "scripts/vor-048*"
      - "scripts/vor-049*"
      - "scripts/vor-054*"
      - "scripts/vor-055*"
      - "scripts/vor-056*"
      - "scripts/vor-058*"
      - "scripts/vor-059*"
      - "scripts/ask-vorta-live-evals.mjs"
      - "scripts/run-contract-suite.mjs"
      - "scripts/vor-044-operational-value-ranking-contracts.mjs"
      - "scripts/vor-045-conversation-context-contracts.mjs"
      - "scripts/vor-046-photo-ocr-contracts.mjs"
      - "supabase/migrations/20260803202500_vor_048_route_latency_feedback.sql"
      - "tests/browser/vor-048-feedback.spec.ts"
      - "tests/evals/vor-048-shift-cover-routing.json"
      - "tests/evals/vor-054-cross-domain-live.json"
      - "tests/evals/vor-056-backlog-action-plan.json"
      - "tests/evals/vor-058-site-priority-performance.json"
      - "tests/evals/vor-059-deterministic-operational-answers.json"
      - "tests/evals/vor-059-operational-model-independence-audit.json"
      - "tests/evals/vor-033-demo-golden.json"
      - "tests/evals/ask-vorta-live-golden.json"
      - "netlify.toml"
      - "ops/netlify-release.json"
      - "scripts/netlify-*"
      - ".github/workflows/netlify-daily-release.yml"
      - "package.json"
      - ".github/workflows/vor-038-intelligence-live-eval.yml"
      - ".github/workflows/vor-048-validation.yml"
      - ".github/workflows/vor-049-validation.yml"
      - ".github/workflows/maintenance-manager-production.yml"
  push:
    branches:
      - main
    paths:
      - "netlify/functions/ask-vorta.mts"
      - "netlify/functions/ask-vorta/**"
      - "src/screens/AiOperations/**"
      - "scripts/vor-048*"
      - "scripts/vor-049*"
      - "scripts/vor-054*"
      - "scripts/vor-055*"
      - "scripts/vor-056*"
      - "scripts/vor-058*"
      - "scripts/vor-059*"
      - "scripts/ask-vorta-live-evals.mjs"
      - "scripts/run-contract-suite.mjs"
      - "scripts/vor-044-operational-value-ranking-contracts.mjs"
      - "scripts/vor-045-conversation-context-contracts.mjs"
      - "scripts/vor-046-photo-ocr-contracts.mjs"
      - "supabase/migrations/20260803202500_vor_048_route_latency_feedback.sql"
      - "tests/browser/vor-048-feedback.spec.ts"
      - "tests/evals/vor-048-shift-cover-routing.json"
      - "tests/evals/vor-054-cross-domain-live.json"
      - "tests/evals/vor-056-backlog-action-plan.json"
      - "tests/evals/vor-058-site-priority-performance.json"
      - "tests/evals/vor-059-deterministic-operational-answers.json"
      - "tests/evals/vor-059-operational-model-independence-audit.json"
      - "tests/evals/vor-033-demo-golden.json"
      - "tests/evals/ask-vorta-live-golden.json"
      - "netlify.toml"
      - "ops/netlify-release.json"
      - "scripts/netlify-*"
      - ".github/workflows/netlify-daily-release.yml"
      - "package.json"
      - ".github/workflows/vor-038-intelligence-live-eval.yml"
      - ".github/workflows/vor-048-validation.yml"
      - ".github/workflows/vor-049-validation.yml"
      - ".github/workflows/maintenance-manager-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ask-vorta-live-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Cross-domain and equipment decision quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
      OPENAI_API_KEY: vor-058-deterministic-local-only
      OPENAI_BASE_URL: https://api.openai.com/v1

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          show-progress: false

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Apply complete Ask Vorta integration chain
        run: npm run build:metadata

      - name: Run transformed-source TypeScript checks
        run: npm run typecheck -- --pretty false

      - name: Run permanent VOR-049 contracts
        run: node scripts/vor-049-decision-ready-equipment-contracts.mjs

      - name: Run permanent VOR-054 contracts
        run: node scripts/vor-054-cross-domain-live-contracts.mjs

      - name: Run permanent VOR-056 contracts
        run: node scripts/vor-056-backlog-action-plan-contracts.mjs

      - name: Run permanent VOR-058 contracts
        run: node scripts/vor-058-site-priority-performance-contracts.mjs

      - name: Run permanent VOR-059 contracts
        run: node scripts/vor-059-deterministic-operational-answers-contracts.mjs

      - name: Run complete contract suite
        run: npm run test:contracts

      - name: Run route smoke tests
        run: npm run test:smoke

      - name: Build production bundle
        run: npx vite build

      - name: Enforce unchanged performance budgets
        run: npm run test:performance

      - name: Start exact-source Ask Vorta evaluation server
        shell: bash
        run: |
          node scripts/vor-058-local-eval-server.mjs > vor-058-local-server.log 2>&1 &
          echo $! > vor-058-local-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8788/api/ask-vorta; then
              echo "Exact-source Ask Vorta server is ready."
              exit 0
            fi
            sleep 1
          done
          cat vor-058-local-server.log
          exit 1

      - name: Run six authenticated VOR-058 site-priority decisions
        env:
          VORTA_EVAL_BASE_URL: http://127.0.0.1:8788
          VORTA_EVAL_DELAY_MS: 250
          VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000
          VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 1
        shell: bash
        run: npm run eval:ask-vorta:vor058 | tee vor-058-live-eval.log

      - name: Run six authenticated VOR-059 operational decisions
        env:
          VORTA_EVAL_BASE_URL: http://127.0.0.1:8788
          VORTA_EVAL_DELAY_MS: 250
          VORTA_EVAL_RATE_LIMIT_RETRY_MS: 310000
          VORTA_EVAL_RATE_LIMIT_MAX_RETRIES: 1
        shell: bash
        run: npm run eval:ask-vorta:vor059 | tee vor-059-live-eval.log

      - name: Stop exact-source Ask Vorta evaluation server
        if: always()
        shell: bash
        run: |
          if [[ -f vor-058-local-server.pid ]]; then
            kill "$(cat vor-058-local-server.pid)" 2>/dev/null || true
          fi

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-049-failure-evidence-${{ github.sha }}
          path: |
            dist/vorta-build.json
            vor-058-local-server.log
            vor-058-live-eval.log
            vor-059-live-eval.log
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve successful validation evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-049-validation-evidence-${{ github.sha }}
          path: |
            dist/vorta-build.json
            vor-058-local-server.log
            vor-058-live-eval.log
            vor-059-live-eval.log
          if-no-files-found: error
          retention-days: 7
