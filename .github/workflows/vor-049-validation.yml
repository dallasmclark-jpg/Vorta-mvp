name: VOR-049 decision-ready equipment

on:
  pull_request:
    branches:
      - main
    paths:
      - "netlify/functions/ask-vorta.mts"
      - "scripts/vor-049*"
      - "scripts/ask-vorta-live-evals.mjs"
      - "scripts/run-contract-suite.mjs"
      - "scripts/vor-044-operational-value-ranking-contracts.mjs"
      - "scripts/vor-045-conversation-context-contracts.mjs"
      - "scripts/vor-046-photo-ocr-contracts.mjs"
      - "tests/evals/vor-033-demo-golden.json"
      - "package.json"
      - ".github/workflows/vor-049-validation.yml"
  push:
    branches:
      - main
    paths:
      - "netlify/functions/ask-vorta.mts"
      - "scripts/vor-049*"
      - "scripts/ask-vorta-live-evals.mjs"
      - "scripts/run-contract-suite.mjs"
      - "scripts/vor-044-operational-value-ranking-contracts.mjs"
      - "scripts/vor-045-conversation-context-contracts.mjs"
      - "scripts/vor-046-photo-ocr-contracts.mjs"
      - "tests/evals/vor-033-demo-golden.json"
      - "package.json"
      - ".github/workflows/vor-049-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vor-049-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Equipment decision quality and live golden set
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--vorta-app.netlify.app

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Apply complete Ask Vorta integration chain
        run: npm run build:metadata

      - name: Run transformed-source TypeScript checks
        run: npm run typecheck -- --pretty false

      - name: Run permanent VOR-049 contracts
        run: node scripts/vor-049-decision-ready-equipment-contracts.mjs

      - name: Run complete contract suite
        run: npm run test:contracts

      - name: Run route smoke tests
        run: npm run test:smoke

      - name: Build production bundle
        run: npx vite build

      - name: Enforce unchanged performance budgets
        run: npm run test:performance

      - name: Wait for exact Netlify preview commit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            metadata="$(curl -fsS "${PREVIEW_URL}/vorta-build.json" || true)"
            if printf '%s' "$metadata" | grep -Fq "$EXPECTED_HEAD_SHA"; then
              echo "Netlify preview is serving $EXPECTED_HEAD_SHA."
              exit 0
            fi
            echo "Preview is not on the expected commit yet (${attempt}/60)."
            sleep 10
          done
          echo "Netlify preview did not publish the expected commit." >&2
          exit 1

      - name: Run all 24 visible-answer golden decisions
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          VORTA_EVAL_BASE_URL: ${{ env.PREVIEW_URL }}
          VORTA_EVAL_DELAY_MS: 30000
        run: |
          set -o pipefail
          npm run eval:ask-vorta:vor049 2>&1 | tee vor-049-live-eval.log

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vor-049-failure-evidence-${{ github.sha }}
          path: |
            vor-049-live-eval.log
            dist/vorta-build.json
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve successful validation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vor-049-validation-evidence-${{ github.sha }}
          path: |
            vor-049-live-eval.log
            dist/vorta-build.json
          if-no-files-found: warn
          retention-days: 7
