name: Recover VOR-057 production release

on:
  push:
    branches:
      - agent/vor-057-explicit-netlify-deploy
    paths:
      - ".github/workflows/vor-057-recover-production-release.yml"

permissions:
  contents: write

concurrency:
  group: vor-057-production-recovery-2026-08-06
  cancel-in-progress: false

jobs:
  deploy-exact-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_COMMIT: 0268689c845c4880701dc35d759c9d9684578a77
      COMMIT_REF: 0268689c845c4880701dc35d759c9d9684578a77
      NETLIFY_SITE_ID: 4672c4a4-53eb-475d-ae88-a9de4ecdeae8
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0268689c845c4880701dc35d759c9d9684578a77
          fetch-depth: 0
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify controlled deployment credentials
        shell: bash
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || {
            echo "NETLIFY_AUTH_TOKEN repository secret is not configured."
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Install locked application dependencies
        run: npm ci --silent

      - name: Deploy the exact validated release once
        shell: bash
        run: |
          npx --yes netlify-cli@27.0.1 deploy \
            --build \
            --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "VOR-057 controlled release 2026-08-06 $EXPECTED_COMMIT" \
            --json | tee vor-057-netlify-deploy.json

      - name: Verify production build metadata
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            actual_commit="$(curl --fail --silent --show-error --no-cache \
              "https://vorta-app.netlify.app/vorta-build.json?attempt=$attempt" \
              | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => console.log(JSON.parse(input).commit || ""));')" || true
            if [[ "$actual_commit" == "$EXPECTED_COMMIT" ]]; then
              echo "Production serves exact release commit $EXPECTED_COMMIT."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not expose expected release metadata."
          exit 1

      - name: Preserve deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vor-057-production-recovery-${{ env.EXPECTED_COMMIT }}
          path: vor-057-netlify-deploy.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary recovery workflow
        if: success()
        shell: bash
        run: |
          git switch agent/vor-057-explicit-netlify-deploy
          git config user.name "Vorta Release Recovery"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/vor-057-recover-production-release.yml
          git commit -m "Remove temporary VOR-057 recovery workflow [skip netlify]"
          git push origin HEAD:agent/vor-057-explicit-netlify-deploy
