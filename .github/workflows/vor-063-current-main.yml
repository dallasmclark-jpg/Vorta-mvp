name: VOR-063 current-main integration

on:
  push:
    branches:
      - agent/vor-063-verified-multi-site-context
    paths:
      - scripts/apply-vor-063-multi-site-context.mjs
      - .github/workflows/vor-063-current-main.yml

permissions:
  contents: write

concurrency:
  group: vor-063-current-main-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out current VOR-063 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/vor-063-verified-multi-site-context
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Apply recovered VOR-063 to current main
        run: node scripts/apply-vor-063-multi-site-context.mjs

      - name: Run focused and permanent verification
        run: |
          node scripts/vor-063-multi-site-context-tests.mjs
          node scripts/vor-063-multi-site-context-contracts.mjs
          npm run typecheck
          npm run test:contracts
          npm run test:smoke
          npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "Vorta Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/auth.tsx src/lib/siteAccessContext.ts scripts/vor-063-multi-site-context-tests.mjs scripts/vor-063-multi-site-context-contracts.mjs scripts/run-contract-suite.mjs
          if git diff --cached --quiet; then
            echo "VOR-063 implementation is already integrated."
            exit 0
          fi
          git commit -m "VOR-063: hydrate verified multi-site context"
          git push origin HEAD:agent/vor-063-verified-multi-site-context
