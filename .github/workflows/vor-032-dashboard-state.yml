name: Apply VOR-032 expanded dashboard state

on:
  push:
    branches:
      - agent/vor-032-critical-spares

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip vor-032 state]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused dashboard-state patch
        run: python scripts/vor-032-dashboard-state-patch.py

      - name: Run focused VOR-032 contracts
        run: node scripts/vor-032-dashboard-critical-spares-contracts.mjs

      - name: Remove one-use patch machinery
        run: |
          rm -f .github/vor-032-dashboard-state-trigger
          rm scripts/vor-032-dashboard-state-patch.py
          rm .github/workflows/vor-032-dashboard-state.yml

      - name: Commit dashboard return-state fix
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "Vorta automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VOR-032: preserve expanded work plan on return [skip vor-032 state]"
          git push origin "HEAD:${TARGET_BRANCH}"
