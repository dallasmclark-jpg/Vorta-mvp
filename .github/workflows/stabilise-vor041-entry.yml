name: Stabilise VOR-041 entry

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/stabilise-vor041-entry.mjs"
      - ".github/workflows/stabilise-vor041-entry.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node scripts/stabilise-vor041-entry.mjs
      - run: |
          rm scripts/stabilise-vor041-entry.mjs
          rm .github/workflows/stabilise-vor041-entry.yml
          git diff --check
      - name: Commit stable entry test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/vor-041-ask-vorta-workspace.spec.ts scripts/stabilise-vor041-entry.mjs .github/workflows/stabilise-vor041-entry.yml
          git commit -m "Stabilise Ask Vorta workspace entry test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
