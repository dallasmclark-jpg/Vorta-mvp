name: Publish validated VOR-055 runtime patch

on:
  push:
    branches:
      - agent/vor-055-production-verifier
    paths:
      - ".github/workflows/vor-055-publish-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vor-055-publish-runtime
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out VOR-055 branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-055-production-verifier
          show-progress: false

      - name: Apply the already validated patch
        run: python scripts/vor-055-apply-fix.py

      - name: Restore workflow files for connector-owned publication
        shell: bash
        run: |
          git checkout HEAD -- \
            .github/workflows/maintenance-manager-production.yml \
            .github/workflows/vor-049-validation.yml \
            .github/workflows/vor-055-apply-fix.yml \
            .github/workflows/vor-055-apply-fix-v2.yml \
            .github/workflows/vor-055-publish-runtime.yml

      - name: Commit validated runtime and contract changes
        shell: bash
        run: |
          git config user.name "Vorta Engineering Automation"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/ask-vorta/route-planning.mts scripts/run-contract-suite.mjs
          git add -A -- scripts/vor-055-apply-fix.py
          git commit -m "Fix VOR-055 runtime routing"
          git push origin HEAD:agent/vor-055-production-verifier
