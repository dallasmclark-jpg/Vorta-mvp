name: Apply VOR-026 Shift Handover refinement

on:
  push:
    branches:
      - feature/vor-026-shift-handover-mobile-refinement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vor-026-shift-handover-mobile-refinement
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          page_path = Path("src/screens/ShiftHandover/ShiftHandoverSection.tsx")
          page = page_path.read_text()

          page = replace_once(
              page,
              "  useMemo,\n  useState,",
              "  useMemo,\n  useRef,\n  useState,",
              "React useRef import",
          )

