name: Package current Netlify deployment client

on:
  push:
    branches:
      - ops/package-current-netlify-client
    paths:
      - .github/workflows/package-current-netlify-client.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Netlify MCP client
        shell: bash
        run: |
          mkdir -p deployment-runner
          npm install --prefix deployment-runner --omit=dev --ignore-scripts @netlify/mcp@latest

      - name: Package deployment client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netlify-mcp-current
          path: deployment-runner
          include-hidden-files: true
          retention-days: 1
