name: Tighten VOR-058 natural matchers

on:
  push:
    branches:
      - agent/vor-058-site-priority-performance
    paths:
      - ".github/workflows/vor-058-tighten-natural-matchers.yml"

permissions:
  contents: write

concurrency:
  group: vor-058-natural-matchers
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out VOR-058 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/vor-058-site-priority-performance
          fetch-depth: 0
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused natural-language matcher patch
        run: node scripts/vor-058-tighten-natural-matchers.mjs

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Run focused VOR-058 contracts
        run: node scripts/vor-058-site-priority-performance-contracts.mjs

      - name: Run strict TypeScript checks
        run: npm run typecheck -- --pretty false

      - name: Remove temporary patch machinery
        run: |
          rm scripts/vor-058-tighten-natural-matchers.mjs
          rm .github/workflows/vor-058-tighten-natural-matchers.yml

      - name: Commit verified matcher changes
        run: |
          git config user.name "Vorta Ask Vorta Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "VOR-058: cover natural site-priority phrasing [skip netlify]"
          git push origin HEAD:agent/vor-058-site-priority-performance
