name: Fix VOR-041 Recent title

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/fix-vor041-recent-title.mjs"
      - ".github/workflows/fix-vor041-recent-title.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node scripts/fix-vor041-recent-title.mjs
      - run: |
          rm scripts/fix-vor041-recent-title.mjs
          rm .github/workflows/fix-vor041-recent-title.yml
          git diff --check
      - name: Commit test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/vor-041-ask-vorta-workspace.spec.ts scripts/fix-vor041-recent-title.mjs .github/workflows/fix-vor041-recent-title.yml
          git commit -m "Align Ask Vorta Recent title test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
