name: VOR-041 Ask Vorta workspace gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx"
      - "src/screens/AiOperations/AskVortaWorkspace.tsx"
      - "src/screens/AiOperations/mobilePortalHardening.css"
      - "tests/browser/vor-041-ask-vorta-workspace.spec.ts"
      - "scripts/vor-041-ask-vorta-workspace-contracts.mjs"
      - ".github/workflows/vor-041-ask-vorta-workspace-gate.yml"

permissions:
  contents: read

concurrency:
  group: vor-041-workspace-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
  VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
  VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
  VITE_VORTA_DATA_MODE: demo
  VORTA_E2E_EMAIL: demo@vorta.network
  VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
  VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
  VORTA_E2E_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--vorta-app.netlify.app

jobs:
  workspace:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Verify workspace contracts and production compile
        run: |
          npm run typecheck -- --pretty false
          node scripts/vor-037-unified-ask-vorta-contracts.mjs
          node scripts/vor-041-ask-vorta-workspace-contracts.mjs

      - name: Verify authenticated browser secret
        shell: bash
        run: |
          test -n "$VORTA_E2E_PASSWORD" || {
            echo "VORTA_E2E_PASSWORD is not configured for the VOR-041 browser gate." >&2
            exit 1
          }

      - name: Install browser-test runner
        run: npm install --no-save --package-lock=false --silent @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for exact Netlify preview head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 60); do
            payload="$(curl --silent --show-error --fail --max-time 15 "$VORTA_E2E_BASE_URL/vorta-build.json" || true)"
            deployed_head="$(printf '%s' "$payload" | node -e 'let value="";process.stdin.on("data",c=>value+=c).on("end",()=>{try{process.stdout.write(JSON.parse(value).commit||"")}catch{}})')"
            if [ "$deployed_head" = "$EXPECTED_HEAD" ]; then
              echo "Exact VOR-041 preview head is ready: $deployed_head"
              exit 0
            fi
            echo "Preview head is ${deployed_head:-unavailable}; waiting for $EXPECTED_HEAD (attempt $attempt/60)."
            sleep 5
          done
          echo "The exact VOR-041 Netlify preview head did not become ready." >&2
          exit 1

      - name: Run authenticated workspace journeys
        run: |
          npx playwright test \
            tests/browser/vor-041-ask-vorta-workspace.spec.ts \
            --project=phone-360 \
            --project=samsung-tablet-portrait \
            --project=samsung-tablet-landscape \
            --project=desktop-1920 \
            --config=playwright.config.ts

      - name: Preserve workspace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vor-041-workspace-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
