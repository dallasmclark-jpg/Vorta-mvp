name: VOR-041 implement Ask Vorta workspace

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: vor-041-workspace-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'agent/vor-041-ask-vorta-workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-041-ask-vorta-workspace
          fetch-depth: 0

      - name: Stop when already integrated
        id: state
        shell: bash
        run: |
          if grep -q 'data-vorta-global-ai-expand="true"' src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx; then
            echo "integrated=true" >> "$GITHUB_OUTPUT"
          else
            echo "integrated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.state.outputs.integrated == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.integrated == 'false'
        run: npm ci --silent

      - name: Apply bounded workspace integration
        if: steps.state.outputs.integrated == 'false'
        run: |
          python scripts/vor-041-integrate-workspace.py
          python scripts/vor-041-optimise-workspace.py

      - name: Prove mobile presentation was not edited
        if: steps.state.outputs.integrated == 'false'
        run: git diff --exit-code origin/main -- src/screens/AiOperations/mobilePortalHardening.css

      - name: Verify focused contracts
        if: steps.state.outputs.integrated == 'false'
        run: |
          npm run typecheck
          node scripts/vor-037-unified-ask-vorta-contracts.mjs
          node scripts/vor-041-ask-vorta-workspace-contracts.mjs
          node scripts/tablet-presentation-contracts.mjs

      - name: Verify production build
        if: steps.state.outputs.integrated == 'false'
        run: npm run build

      - name: Remove disposable implementation scaffolding
        if: steps.state.outputs.integrated == 'false'
        run: |
          rm scripts/vor-041-integrate-workspace.py
          rm scripts/vor-041-optimise-workspace.py
          rm .github/workflows/vor-041-implement-workspace.yml

      - name: Commit verified workspace integration
        if: steps.state.outputs.integrated == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/AiOperations/GlobalMaintenanceAiAssistant.tsx \
                  src/screens/AiOperations/AskVortaWorkspace.tsx \
                  scripts/run-contract-suite.mjs \
                  scripts/vor-041-ask-vorta-workspace-contracts.mjs \
                  scripts/vor-041-integrate-workspace.py \
                  scripts/vor-041-optimise-workspace.py \
                  .github/workflows/vor-041-implement-workspace.yml
          git commit -m "VOR-041: add desktop and tablet Ask Vorta workspace"
          git push origin HEAD:agent/vor-041-ask-vorta-workspace
