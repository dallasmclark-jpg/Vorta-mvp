name: VOR-040 guarded engineering workflow

on:
  pull_request:
    branches: [main]
    paths:
      - .github/vor-040-preview-baseline.marker

permissions:
  contents: write

jobs:
  engineer-or-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Check out branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Read guarded mode
        id: mode
        shell: bash
        run: |
          mode="$(awk -F= '$1 == "mode" { print $2 }' .github/vor-040-preview-baseline.marker | tail -1)"
          echo "mode=${mode:-skip}" >> "$GITHUB_OUTPUT"
          echo "Mode: ${mode:-skip}"

      - name: Use Node.js
        if: steps.mode.outputs.mode == 'patch-natural-routing' || steps.mode.outputs.mode == 'evaluate'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.mode.outputs.mode == 'patch-natural-routing' || steps.mode.outputs.mode == 'evaluate'
        run: npm ci --silent

      - name: Apply natural-language routing and evidence repair
        if: steps.mode.outputs.mode == 'patch-natural-routing'
        run: python scripts/vor-040-apply-natural-routing-patch.py

      - name: Verify patched Ask Vorta contracts
        if: steps.mode.outputs.mode == 'patch-natural-routing'
        run: |
          npm run typecheck:functions
          node scripts/vor-038-ask-vorta-intelligence-contracts.mjs
          node scripts/vor-039-ask-vorta-confidence-latency-contracts.mjs
          node scripts/vor-040-natural-question-contracts.mjs
          node scripts/ask-vorta-agent-contracts.mjs

      - name: Commit verified routing repair
        if: steps.mode.outputs.mode == 'patch-natural-routing'
        shell: bash
        run: |
          git config user.name "Vorta Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/ask-vorta.mts
          git commit -m "VOR-040: preserve equipment facts and mixed evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Read evaluation configuration
        if: steps.mode.outputs.mode == 'evaluate'
        shell: bash
        run: |
          offset="$(awk -F= '$1 == "offset" { print $2 }' .github/vor-040-preview-baseline.marker | tail -1)"
          limit="$(awk -F= '$1 == "limit" { print $2 }' .github/vor-040-preview-baseline.marker | tail -1)"
          delay="$(awk -F= '$1 == "delay_ms" { print $2 }' .github/vor-040-preview-baseline.marker | tail -1)"
          echo "VORTA_EVAL_OFFSET=${offset:-0}" >> "$GITHUB_ENV"
          echo "VORTA_EVAL_LIMIT=${limit:-8}" >> "$GITHUB_ENV"
          echo "VORTA_EVAL_DELAY_MS=${delay:-500}" >> "$GITHUB_ENV"

      - name: Wait for exact Netlify preview head
        if: steps.mode.outputs.mode == 'evaluate'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: https://deploy-preview-191--vorta-app.netlify.app
        run: |
          for attempt in $(seq 1 60); do
            payload="$(curl --silent --show-error --fail --max-time 15 "$PREVIEW_URL/vorta-build.json" || true)"
            deployed_head="$(printf '%s' "$payload" | node -e 'let value="";process.stdin.on("data",c=>value+=c).on("end",()=>{try{process.stdout.write(JSON.parse(value).commit||"")}catch{}})')"
            if [ "$deployed_head" = "$EXPECTED_HEAD" ]; then
              echo "Exact preview head is ready: $deployed_head"
              exit 0
            fi
            echo "Preview head is ${deployed_head:-unavailable}; waiting for $EXPECTED_HEAD (attempt $attempt/60)."
            sleep 5
          done
          echo "The exact Netlify preview head did not become ready." >&2
          exit 1

      - name: Compose public Supabase client key
        if: steps.mode.outputs.mode == 'evaluate'
        shell: bash
        env:
          VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
          VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Run configured natural-question batch against preview
        if: steps.mode.outputs.mode == 'evaluate'
        shell: bash
        env:
          VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
          VORTA_E2E_EMAIL: demo@vorta.network
          VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
          VORTA_EVAL_BASE_URL: https://deploy-preview-191--vorta-app.netlify.app
          VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
        run: |
          set -o pipefail
          npm run eval:ask-vorta:vor040 2>&1 | tee vor-040-preview-batch.log

      - name: Preserve preview evidence
        if: always() && steps.mode.outputs.mode == 'evaluate'
        uses: actions/upload-artifact@v4
        with:
          name: vor-040-preview-batch
          path: vor-040-preview-batch.log
          if-no-files-found: error
          retention-days: 14
