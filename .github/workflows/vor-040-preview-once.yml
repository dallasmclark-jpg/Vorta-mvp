name: VOR-040 guarded preview evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/vor-040-preview-baseline.marker

permissions:
  contents: read

jobs:
  evaluate-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Guard exact evaluation commit
        id: guard
        shell: bash
        run: |
          message="$(git log -1 --pretty=%s)"
          if [ "$message" = "VOR-040: execute repaired preview batch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping evaluation for commit: $message"
          fi

      - name: Read batch configuration
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          offset="$(awk -F= '$1 == "offset" { print $2 }' .github/vor-040-preview-baseline.marker | tail -1)"
          limit="$(awk -F= '$1 == "limit" { print $2 }' .github/vor-040-preview-baseline.marker | tail -1)"
          delay="$(awk -F= '$1 == "delay_ms" { print $2 }' .github/vor-040-preview-baseline.marker | tail -1)"
          echo "VORTA_EVAL_OFFSET=${offset:-0}" >> "$GITHUB_ENV"
          echo "VORTA_EVAL_LIMIT=${limit:-8}" >> "$GITHUB_ENV"
          echo "VORTA_EVAL_DELAY_MS=${delay:-500}" >> "$GITHUB_ENV"

      - name: Compose public Supabase client key
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
          VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci --silent

      - name: Run configured natural-question batch against preview
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
          VORTA_E2E_EMAIL: demo@vorta.network
          VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
          VORTA_EVAL_BASE_URL: https://deploy-preview-191--vorta-app.netlify.app
          VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
        run: |
          set -o pipefail
          npm run eval:ask-vorta:vor040 2>&1 | tee vor-040-preview-batch.log

      - name: Preserve preview evidence
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vor-040-preview-batch
          path: vor-040-preview-batch.log
          if-no-files-found: error
          retention-days: 14
