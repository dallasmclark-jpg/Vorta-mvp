name: VOR-040 manager second half

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  evaluate:
    if: github.head_ref == 'agent/vor-040-natural-question-audit-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_EVAL_BASE_URL: https://deploy-preview-196--vorta-app.netlify.app
      VORTA_EVAL_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_EVAL_OFFSET: 12
      VORTA_EVAL_LIMIT: 12
      VORTA_EVAL_DELAY_MS: 500
    steps:
      - name: Check out exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Wait for exact Netlify preview head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: https://deploy-preview-196--vorta-app.netlify.app
        run: |
          for attempt in $(seq 1 72); do
            payload="$(curl --silent --show-error --fail --max-time 15 "$PREVIEW_URL/vorta-build.json" || true)"
            deployed_head="$(printf '%s' "$payload" | node -e 'let value="";process.stdin.on("data",c=>value+=c).on("end",()=>{try{process.stdout.write(JSON.parse(value).commit||"")}catch{}})')"
            if [ "$deployed_head" = "$EXPECTED_HEAD" ]; then
              echo "Exact preview head is ready: $deployed_head"
              exit 0
            fi
            echo "Preview head is ${deployed_head:-unavailable}; waiting for $EXPECTED_HEAD (attempt $attempt/72)."
            sleep 5
          done
          echo "The exact Netlify preview head did not become ready." >&2
          exit 1

      - name: Reset the full request window
        run: sleep 315

      - name: Run second 12 manager scenarios
        shell: bash
        run: |
          set -o pipefail
          node scripts/ask-vorta-live-evals.mjs tests/evals/vor-033-demo-golden.json 2>&1 | tee vor-040-manager-second-half.log

      - name: Preserve second-half evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vor-040-manager-second-half-${{ github.event.pull_request.head.sha }}
          path: vor-040-manager-second-half.log
          if-no-files-found: error
          retention-days: 14
