name: VOR-097 Netlify client export

on:
  push:
    branches:
      - agent/vor-097-deploy-source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install Netlify MCP client bundle
        run: npm install --prefix /tmp/netlify-mcp @netlify/mcp@1.15.1

      - name: Export Netlify MCP client bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: netlify-mcp-client
          path: /tmp/netlify-mcp
          if-no-files-found: error
          retention-days: 1
