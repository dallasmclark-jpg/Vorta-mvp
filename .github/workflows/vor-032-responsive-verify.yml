name: Verify VOR-032 responsive dashboard

on:
  push:
    branches:
      - agent/vor-032-critical-spares

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip vor-032 responsive]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://ndhqxetvkaeyiwvnvjjy.supabase.co
      VORTA_SUPABASE_KEY_PREFIX: sb_publishable_
      VORTA_SUPABASE_KEY_SUFFIX: JCxOUB33InqPhTJWwDVRfQ_Yi3P6NBq
      VITE_VORTA_DATA_MODE: demo
      VORTA_E2E_EMAIL: demo@vorta.network
      VORTA_E2E_PASSWORD: ${{ secrets.VORTA_E2E_PASSWORD }}
      VORTA_E2E_SITE_ID: 11000000-0000-0000-0000-000000000001
      VORTA_E2E_ORGANISATION_ID: 10000000-0000-0000-0000-000000000001

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Compose public Supabase client key
        shell: bash
        run: echo "VITE_SUPABASE_ANON_KEY=${VORTA_SUPABASE_KEY_PREFIX}${VORTA_SUPABASE_KEY_SUFFIX}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --silent

      - name: Install browser-test runner
        run: npm install --no-save --package-lock=false --silent @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run VOR-032 across phone, tablet and desktop
        run: |
          npx playwright test \
            tests/browser/maintenance-manager-dashboard-critical-spares.spec.ts \
            --project=phone-360 \
            --project=samsung-tablet-portrait \
            --project=samsung-tablet-landscape \
            --project=desktop-1920 \
            --config=playwright.config.ts

      - name: Remove one-use verification machinery
        run: |
          rm -f .github/vor-032-responsive-trigger
          rm .github/workflows/vor-032-responsive-verify.yml

      - name: Commit verified branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "Vorta automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VOR-032: verify responsive dashboard behaviour [skip vor-032 responsive]"
          git push origin "HEAD:${TARGET_BRANCH}"
