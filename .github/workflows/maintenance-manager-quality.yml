name: Apply VOR-027 focused source change

on:
  push:
    branches:
      - vor-027-simplify-shift-handover-scope
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vor-027-simplify-shift-handover-scope
          fetch-depth: 0

      - name: Execute the temporary focused transformation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/vor-027-apply.yml').read_text()
          opening = "          python <<'PY'\n"
          closing = "\n          PY\n\n          git diff --check"
          start = workflow.index(opening) + len(opening)
          end = workflow.index(closing, start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )
          exec(compile(script, 'vor-027-apply.py', 'exec'))
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/maintenance-manager-quality.yml
          git diff --check
          git status --short

      - name: Commit the implementation and restore quality gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "VOR-027: simplify Shift Handover scope and summary"
          git push origin HEAD:vor-027-simplify-shift-handover-scope
