name: Apply VOR-027 focused source change

on:
  push:
    branches:
      - vor-027-simplify-shift-handover-scope
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vor-027-simplify-shift-handover-scope
          fetch-depth: 0

      - name: Apply focused source and test changes
        run: python scripts/apply-vor027-wrapper.py

      - name: Restore the normal quality gate
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/maintenance-manager-quality.yml
          git diff --check
          git status --short

      - name: Commit the implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "VOR-027: simplify Shift Handover scope and summary"
          git push origin HEAD:vor-027-simplify-shift-handover-scope
