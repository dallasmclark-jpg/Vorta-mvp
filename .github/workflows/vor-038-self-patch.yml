name: VOR-038 backend intelligence patch

on:
  push:
    branches:
      - fix/vor-038-ask-vorta-intelligence

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/vor-038-ask-vorta-intelligence
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused backend patch
        run: node scripts/apply-vor-038-intelligence.mjs

      - name: Install dependencies
        run: npm ci --silent

      - name: Type-check application and function
        run: npm run typecheck

      - name: Run VOR-038 contract
        run: node scripts/vor-038-ask-vorta-intelligence-contracts.mjs

      - name: Run full static contract suite
        run: npm run test:contracts

      - name: Commit verified source changes
        run: |
          git config user.name "Vorta CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VOR-038: make Ask Vorta reason across arbitrary questions"
          git push origin HEAD:fix/vor-038-ask-vorta-intelligence
