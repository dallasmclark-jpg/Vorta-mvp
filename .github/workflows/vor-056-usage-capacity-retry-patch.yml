name: VOR-056 usage capacity retry patch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vor-056-backlog-action-plan
    paths:
      - .github/workflows/vor-056-usage-capacity-retry-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out VOR-056 branch
        uses: actions/checkout@v4
        with:
          ref: agent/vor-056-backlog-action-plan
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Add transient platform-capacity retry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          harness_path = Path("scripts/ask-vorta-live-evals.mjs")
          contract_path = Path("scripts/vor-056-backlog-action-plan-contracts.mjs")
          vor49_path = Path("scripts/vor-049-decision-ready-equipment-contracts.mjs")

          harness = harness_path.read_text()
          contract = contract_path.read_text()
          vor49 = vor49_path.read_text()

          if "function isUsageExceeded(" not in harness:
              results_index = harness.index("const results = [];")
              helpers = '''function isUsageExceeded(requestResult) {
            return (
              requestResult.response?.status === 503 &&
              String(requestResult.payload?.error ?? "").trim().toLowerCase() ===
                "usage_exceeded"
            );
          }

          function isRetryableCapacityResponse(requestResult) {
            return requestResult.response?.status === 429 || isUsageExceeded(requestResult);
          }

          '''
              harness = harness[:results_index] + helpers + harness[results_index:]

          if "let blockedByCapacity = false;" not in harness:
              rate_state = "let blockedByRateLimit = false;"
              if rate_state not in harness:
                  raise SystemExit("rate-limit state marker not found")
              harness = harness.replace(
                  rate_state,
                  rate_state + "\nlet blockedByCapacity = false;",
                  1,
              )

          old_condition = "requestResult.response?.status === 429 &&"
          if "isRetryableCapacityResponse(requestResult) &&" not in harness:
              if old_condition not in harness:
                  raise SystemExit("retry condition marker not found")
              harness = harness.replace(
                  old_condition,
                  "isRetryableCapacityResponse(requestResult) &&",
                  1,
              )

          pause_line = "    const pauseMs = retryDelayForRateLimit(requestResult);\n"
          capacity_lines = pause_line + '''    const capacityLabel = isUsageExceeded(requestResult)
              ? "Netlify usage capacity"
              : "Rate limit";
          '''
          if "const capacityLabel = isUsageExceeded(requestResult)" not in harness:
              if pause_line not in harness:
                  raise SystemExit("retry pause marker not found")
              harness = harness.replace(pause_line, capacity_lines, 1)

          old_warning = "`Rate limit reached for ${scenario.id}; waiting ${pauseMs}ms before retry ${rateLimitRetries}/${rateLimitMaxRetries}.`,"
          new_warning = "`${capacityLabel} reached for ${scenario.id}; waiting ${pauseMs}ms before retry ${rateLimitRetries}/${rateLimitMaxRetries}.`,"
          if new_warning not in harness:
              if old_warning not in harness:
                  raise SystemExit("retry warning marker not found")
              harness = harness.replace(old_warning, new_warning, 1)

          if "platform usage capacity exceeded after configured retries" not in harness:
              classification_marker = "  if (response?.status === 429) {"
              if classification_marker not in harness:
                  raise SystemExit("response classification marker not found")
              capacity_classification = '''  if (isUsageExceeded(requestResult)) {
            blockedByCapacity = true;
            failures.push("platform usage capacity exceeded after configured retries");
          } else if (response?.status === 429) {'''
              harness = harness.replace(
                  classification_marker,
                  capacity_classification,
                  1,
              )

          if "blockedByRateLimit || blockedByCapacity" not in harness:
              stop_start = harness.index("  if (blockedByRateLimit) {\n", harness.index("results.push({"))
              stop_end = harness.index("\n  }\n}", stop_start) + len("\n  }")
              stop_block = '''  if (blockedByRateLimit || blockedByCapacity) {
            console.error(
              blockedByCapacity
                ? "Evaluation stopped because Netlify usage capacity remained unavailable after all configured retries."
                : "Evaluation stopped because the authenticated test account reached the production rate limit after all configured retries.",
            );
            break;
          }'''
              harness = harness[:stop_start] + stop_block + harness[stop_end:]

          summary_line = "console.log(JSON.stringify({ scenarioFile, offset, requested: selectedScenarios.length, blockedByRateLimit, results }, null, 2));"
          if "blockedByCapacity, results" not in harness:
              if summary_line not in harness:
                  raise SystemExit("evaluation summary marker not found")
              harness = harness.replace(
                  summary_line,
                  "console.log(JSON.stringify({ scenarioFile, offset, requested: selectedScenarios.length, blockedByRateLimit, blockedByCapacity, results }, null, 2));",
                  1,
              )

          final_exit = "if (blockedByRateLimit) process.exit(3);"
          if "if (blockedByRateLimit || blockedByCapacity) process.exit(3);" not in harness:
              if final_exit not in harness:
                  raise SystemExit("capacity exit marker not found")
              harness = harness.replace(
                  final_exit,
                  "if (blockedByRateLimit || blockedByCapacity) process.exit(3);",
                  1,
              )

          if 'const liveHarness = readFileSync(' not in contract:
              reader_index = contract.index("const centralWorkflow = readFileSync(")
              reader = '''const liveHarness = readFileSync(
            "scripts/ask-vorta-live-evals.mjs",
            "utf8",
          );
          '''
              contract = contract[:reader_index] + reader + contract[reader_index:]

          if "The live evaluator capacity retry is missing" not in contract:
              insertion_index = contract.index("const resetIndex = centralWorkflow.indexOf(")
              capacity_contract = '''for (const marker of [
            "function isUsageExceeded(",
            'requestResult.response?.status === 503',
            '"usage_exceeded"',
            "function isRetryableCapacityResponse(",
            "blockedByCapacity",
            "platform usage capacity exceeded after configured retries",
            "blockedByRateLimit || blockedByCapacity",
          ]) {
            assert.ok(
              liveHarness.includes(marker),
              `The live evaluator capacity retry is missing ${marker}`,
            );
          }
          assert.ok(
            liveHarness.includes(
              'String(requestResult.payload?.error ?? "").trim().toLowerCase()',
            ),
            "Only the exact usage_exceeded platform response may use the 503 retry path",
          );

          '''
              contract = (
                  contract[:insertion_index]
                  + capacity_contract
                  + contract[insertion_index:]
              )

          old_assertion_start = 'assert.match(\n  liveEval,\n  /while \\(\\s*requestResult'
          if "isRetryableCapacityResponse\\(requestResult\\)" not in vor49:
              start = vor49.index(old_assertion_start)
              end_marker = '\n);\nassert.match(liveEval, /retryDelayForRateLimit/);'
              end = vor49.index(end_marker, start) + len('\n);')
              new_assertion = '''assert.match(
            liveEval,
            /while \(\s*isRetryableCapacityResponse\(requestResult\) &&\s*rateLimitRetries < rateLimitMaxRetries/,
          );
          assert.match(
            liveEval,
            /requestResult\.response\?\.status === 429 \|\| isUsageExceeded\(requestResult\)/,
          );'''
              vor49 = vor49[:start] + new_assertion + vor49[end:]

          harness_path.write_text(harness)
          contract_path.write_text(contract)
          vor49_path.write_text(vor49)
          PY

      - name: Run focused VOR-056 contracts
        run: node scripts/vor-056-backlog-action-plan-contracts.mjs

      - name: Run complete canonical validation
        run: npm run build

      - name: Check final diff
        run: |
          git diff --check
          git status --short
          git diff -- scripts/ask-vorta-live-evals.mjs scripts/vor-049-decision-ready-equipment-contracts.mjs scripts/vor-056-backlog-action-plan-contracts.mjs

      - name: Commit verified capacity retry
        run: |
          git config user.name "Ask Vorta CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/ask-vorta-live-evals.mjs
          git add scripts/vor-049-decision-ready-equipment-contracts.mjs
          git add scripts/vor-056-backlog-action-plan-contracts.mjs
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "Retry transient Netlify usage capacity in live evaluations"
          git push origin HEAD:agent/vor-056-backlog-action-plan
