name: VOR-030 apply completed-shift review periods

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/vor-030-shift-based-review-periods
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused VOR-030 changes
        run: python3 scripts/apply-vor-030.py

      - name: Run Shift Handover contracts
        run: node scripts/shift-handover-contracts.mjs

      - name: Run Maintenance Manager TypeScript check
        run: npx tsc -p tsconfig.maintenance.json --noEmit

      - name: Run route smoke tests
        run: npm run test:smoke

      - name: Create production build
        run: npm run build

      - name: Commit validated implementation
        run: |
          rm scripts/apply-vor-030.py
          rm .github/workflows/vor-030-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "VOR-030: use completed shifts in handover review periods"
          git push origin HEAD:feature/vor-030-shift-based-review-periods
