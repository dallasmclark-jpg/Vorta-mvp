name: One-time run VOR-004 final

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and test focused branch
        run: |
          git fetch origin fix/vor-004-dashboard-deep-links
          git checkout fix/vor-004-dashboard-deep-links

          set +e
          python scripts/one_time_vor_004_patch.py > /tmp/vor-004.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            {
              echo "Patch status: $status"
              cat /tmp/vor-004.log
            } > .github/vor-004-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/vor-004-patch-error.txt
            git commit -m "Record VOR-004 patch diagnostic"
            git push origin HEAD:fix/vor-004-dashboard-deep-links
            exit "$status"
          fi

          set +e
          npm ci > /tmp/vor-004-tests.log 2>&1
          test_status=$?
          if [ "$test_status" -eq 0 ]; then node scripts/vor-004-dashboard-deep-links-contract.mjs >> /tmp/vor-004-tests.log 2>&1; test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then npm run typecheck >> /tmp/vor-004-tests.log 2>&1; test_status=$?; fi
          if [ "$test_status" -eq 0 ]; then npm run build >> /tmp/vor-004-tests.log 2>&1; test_status=$?; fi
          set -e

          if [ "$test_status" -ne 0 ]; then
            {
              echo "Test status: $test_status"
              tail -n 260 /tmp/vor-004-tests.log
            } > .github/vor-004-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/vor-004-patch-error.txt
            git commit -m "Record VOR-004 test diagnostic"
            git push origin HEAD:fix/vor-004-dashboard-deep-links
            exit "$test_status"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement VOR-004 dashboard record deep links"
          git push origin HEAD:fix/vor-004-dashboard-deep-links

      - name: Remove one-time runner
        if: always()
        run: |
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/one-time-run-vor-004-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove final VOR-004 runner"
          git push origin main
