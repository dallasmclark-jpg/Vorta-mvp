name: Immediate Netlify production release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/netlify-immediate-release.yml

permissions:
  contents: write

concurrency:
  group: immediate-netlify-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Create real runner push for Netlify
        shell: bash
        run: |
          git rm .github/workflows/netlify-immediate-release.yml
          git rm -f .netlify-deploy-trigger || true
          git config user.name "Vorta Immediate Release"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Deploy Engineer mobile composer and navigation fixes"
          git push origin HEAD:main
