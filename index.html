<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0e14" />
  <title>Vorta | Maintenance Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (() => {
      const storageKey = "vorta:appearance";
      const valid = new Set(["light", "dark", "system"]);
      let preference = "dark";

      try {
        const stored = localStorage.getItem(storageKey);
        if (valid.has(stored)) preference = stored;
      } catch {
        preference = "dark";
      }

      const resolved = preference === "system"
        ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : preference;
      const colour = resolved === "light" ? "#f8fafc" : "#0b0e14";
      const root = document.documentElement;

      root.classList.add(resolved);
      root.dataset.themePreference = preference;
      root.style.backgroundColor = colour;
      root.style.colorScheme = resolved;

      const themeColour = document.querySelector('meta[name="theme-color"]');
      themeColour?.setAttribute("content", colour);
    })();
  </script>
  <link href="tailwind.css" rel="stylesheet" />
  <link href="/src/theme.css" rel="stylesheet" />
  <link href="/src/card-surfaces.css" rel="stylesheet" />
  <link href="/src/tab-states.css" rel="stylesheet" />
</head>
<body style="margin:0">
<style>
  :root{--vls-bg:#f8fafc;--vls-panel:#fff;--vls-border:#cbd5e1;--vls-mark:#0f172a}
  html.dark{--vls-bg:#0b0e14;--vls-panel:#0d1117;--vls-border:#1a2e4a;--vls-mark:#f8fafc}
  html.dark [data-vorta-page-content="true"] span.inline-flex[class*="-500/20"]{background-color:transparent!important}
  #vls{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--vls-bg);z-index:9999}
  #vls-halo{position:absolute;width:155px;height:155px;border-radius:38px;background:radial-gradient(ellipse at center,rgba(59,130,246,.08) 0%,transparent 70%);pointer-events:none;animation:vls-halo 2.4s ease-in-out infinite}
  @keyframes vls-pulse{0%{stroke-dashoffset:341}100%{stroke-dashoffset:-341}}
  @keyframes vls-halo{0%,100%{opacity:.22}50%{opacity:.42}}
  @property --vorta-evidence-pulse-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
  @keyframes vorta-evidence-border-pulse{to{--vorta-evidence-pulse-angle:360deg}}
  @media(prefers-reduced-motion:reduce){#vls-track{animation:none!important}#vls-halo{animation:none!important;opacity:.28}}
  [data-vorta-ask-vorta-spare-disclosures="true"][data-vorta-loading="true"]+[data-vorta-ai-workspace-source-summary="true"]{display:none!important}
  @media(min-width:769px){
    [data-vorta-ai-workspace-conversation="true"]>.flex.justify-start>.w-full.rounded-2xl.border.border-gray-800.bg-gray-900.px-4.py-3.text-slate-200{border:0!important;border-radius:0!important;background:transparent!important;padding:0!important;box-shadow:none!important}
    [data-vorta-ai-live-evidence-activity="true"],
    [data-vorta-ask-vorta-spare-disclosures="true"][data-vorta-loading="true"]>div{position:relative!important;box-sizing:border-box!important;width:min(440px,calc(100vw - 48px))!important;max-width:440px!important;height:44px!important;min-height:44px!important;padding:12px 16px 12px 40px!important;overflow:hidden!important;border:1px solid transparent!important;border-radius:12px!important;background:linear-gradient(#171e29,#171e29) padding-box,conic-gradient(from var(--vorta-evidence-pulse-angle),rgba(26,46,74,.95) 0deg,rgba(26,46,74,.95) 252deg,rgba(59,130,246,.08) 276deg,rgba(59,130,246,.9) 304deg,#93c5fd 322deg,rgba(59,130,246,.24) 344deg,rgba(26,46,74,.95) 360deg) border-box!important;animation:vorta-evidence-border-pulse 2s linear infinite!important;box-shadow:0 0 9px rgba(59,130,246,.07)!important}
    [data-vorta-ai-live-evidence-activity="true"]>.flex.items-center.gap-2.text-sm.font-semibold.text-slate-200,
    [data-vorta-ask-vorta-spare-disclosures="true"][data-vorta-loading="true"]>div>.flex.items-center.gap-2.text-xs.font-semibold.text-slate-400{position:absolute!important;left:14px;top:13px;width:16px;height:18px;margin:0!important;gap:0!important;overflow:hidden;font-size:0!important;line-height:0!important}
    [data-vorta-ai-live-evidence-activity="true"]>.flex.items-center.gap-2.text-sm.font-semibold.text-slate-200 svg,
    [data-vorta-ask-vorta-spare-disclosures="true"][data-vorta-loading="true"]>div>.flex.items-center.gap-2.text-xs.font-semibold.text-slate-400 svg{width:16px!important;height:16px!important;margin:0!important;color:#60a5fa!important}
    [data-vorta-ai-live-evidence-activity="true"]>.flex.items-center.gap-2.text-sm.text-slate-400{margin:0!important;padding:0!important;font-size:13px!important;font-weight:600!important;line-height:18px!important;color:#e2e8f0!important}
    [data-vorta-ai-live-evidence-activity="true"]>.flex.items-center.gap-2.text-sm.text-slate-400>svg{display:none!important}
    [data-vorta-ai-live-evidence-activity="true"] .space-y-1\.5{display:block!important;margin:0!important;padding:0!important}
    [data-vorta-ai-live-evidence-activity="true"] .min-h-7{display:none!important}
    [data-vorta-ai-live-evidence-activity="true"] .min-h-7:last-child{display:block!important;min-height:0!important;margin:0!important;padding:0!important;white-space:nowrap}
    [data-vorta-ai-live-evidence-activity="true"] .min-h-7:last-child>svg{display:none!important}
    [data-vorta-ai-live-evidence-activity="true"] .min-h-7:last-child .min-w-0{display:block!important;min-width:0!important;overflow:hidden!important;white-space:nowrap}
    [data-vorta-ai-live-evidence-activity="true"] .min-h-7:last-child .min-w-0 span:first-child{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px!important;font-weight:600!important;line-height:18px!important;color:#e2e8f0!important}
    [data-vorta-ai-live-evidence-activity="true"] .min-h-7:last-child .min-w-0 .text-xs.text-slate-500{display:none!important}
    [data-vorta-ask-vorta-stock-loading-rail="true"]{display:none!important}
    [data-vorta-ask-vorta-spare-disclosures="true"][data-vorta-loading="true"] p{margin:0!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px!important;font-weight:600!important;line-height:18px!important;color:#e2e8f0!important}
  }
  @media(min-width:769px) and (prefers-reduced-motion:reduce){
    [data-vorta-ai-live-evidence-activity="true"],
    [data-vorta-ask-vorta-spare-disclosures="true"][data-vorta-loading="true"]>div{animation:none!important;background:linear-gradient(#171e29,#171e29) padding-box,linear-gradient(#3b82f6,#3b82f6) border-box!important;box-shadow:none!important}
  }

  /* VOR-097 inline premium portal cascade: kept out of the bundled CSS budget. */
/* Shared Card primitives inherit the Dashboard's restrained navy depth on
   every portal. This deliberately excludes group-only frames. */
html.dark [data-vorta-page-content="true"] [data-vorta-card="true"]:not([data-vorta-group-frame="true"]) {
  border-color: rgba(96, 165, 250, 0.13) !important;
  background-color: #030c1d !important;
  background-image: linear-gradient(
    180deg,
    rgba(8, 28, 52, 0.38) 0%,
    rgba(3, 12, 29, 0) 58%
  ) !important;
  box-shadow: var(--vorta-surface-shadow) !important;
}

/* Legacy primary panels that pre-date the shared Card component should read as
   the same primary surface rather than charcoal or generic slate. */
html.dark [data-vorta-page-content="true"]
  :is([class~="rounded-xl"], [class~="rounded-2xl"])[class*="border"]:is(
    [class*="bg-[#0"],
    [class*="bg-[#1"],
    [class*="bg-slate-9"],
    [class*="bg-gray-9"]
  ):not([class*="border-red"]):not([class*="border-orange"]):not([class*="border-yellow"]):not([class*="border-amber"]):not([class*="border-emerald"]):not([class*="border-green"]),
html.dark [data-vorta-page-content="true"]
  :is([class~="rounded-xl"], [class~="rounded-2xl"])[class*="border"]:not([class*="bg-"]) {
  border-color: rgba(96, 165, 250, 0.13) !important;
  background-color: #030c1d !important;
  background-image: linear-gradient(
    180deg,
    rgba(8, 28, 52, 0.30) 0%,
    rgba(3, 12, 29, 0) 58%
  ) !important;
}

/* Compact neutral detail blocks, filters and metadata panels use the raised
   navy surface. Status/RAG containers are excluded by their semantic borders. */
html.dark [data-vorta-page-content="true"]
  :is([class~="rounded-lg"], [class~="rounded-md"])[class*="border"]:is(
    [class*="bg-[#0"],
    [class*="bg-[#1"],
    [class*="bg-slate-9"],
    [class*="bg-gray-9"]
  ):not([role="tab"]):not([class*="border-red"]):not([class*="border-orange"]):not([class*="border-yellow"]):not([class*="border-amber"]):not([class*="border-emerald"]):not([class*="border-green"]) {
  border-color: rgba(148, 163, 184, 0.10) !important;
  background-color: #07172b !important;
  background-image: none !important;
  box-shadow: var(--vorta-surface-raised-shadow) !important;
}

/* Inputs no longer introduce near-black/grey islands inside navy pages. */
html.dark [data-vorta-page-content="true"]
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="button"]):not([type="submit"]),
html.dark [data-vorta-page-content="true"] textarea,
html.dark [data-vorta-page-content="true"] select {
  border-color: rgba(148, 163, 184, 0.14) !important;
  background-color: #07172b !important;
  color: #cbd5e1 !important;
}

html.dark [data-vorta-page-content="true"]
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="button"]):not([type="submit"]):focus,
html.dark [data-vorta-page-content="true"] textarea:focus,
html.dark [data-vorta-page-content="true"] select:focus {
  border-color: rgba(96, 165, 250, 0.58) !important;
}

/* Tables inherit the same navy hierarchy. Rows stay quiet; hover supplies the
   raised surface rather than a generic grey strip. */
html.dark [data-vorta-page-content="true"] table thead {
  background-color: rgba(7, 23, 43, 0.88) !important;
}

html.dark [data-vorta-page-content="true"] table tbody tr:not([aria-selected="true"]) {
  background-color: transparent !important;
}

html.dark [data-vorta-page-content="true"] table tbody tr:not([aria-selected="true"]):hover {
  background-color: rgba(7, 23, 43, 0.72) !important;
}

/* Shared and legacy slide-over panels are primary Vorta surfaces, not a second
   charcoal design language. */
html.dark [data-vorta-page-content="true"] aside[role="dialog"],
html.dark [data-vorta-page-content="true"]
  div[class*="fixed"][class*="inset-y-0"][class*="right-0"][class*="border-l"]:is(
    [class*="bg-[#0"],
    [class*="bg-[#1"]
  ) {
  border-color: rgba(148, 163, 184, 0.13) !important;
  background-color: #030c1d !important;
}

/* Tooltip and menu chrome follows the same raised navy treatment. */
html.dark [data-vorta-sidebar-tooltip="true"] {
  border-color: rgba(96, 165, 250, 0.16) !important;
  background-color: #07172b !important;
}

html.dark [data-vorta-sidebar-tooltip="true"] > span[aria-hidden="true"] {
  border-color: rgba(96, 165, 250, 0.16) !important;
  background-color: #07172b !important;
}

/* Preserve the Dashboard's deliberate exceptions after the product-wide rules. */
html.dark [data-vorta-dashboard-root="true"] [data-vorta-embedded-ai="true"] > [data-vorta-card="true"] {
  overflow: visible !important;
  border: 0 !important;
  background: transparent !important;
  background-image: none !important;
  box-shadow: none !important;
}

html.dark [data-vorta-dashboard-root="true"] [aria-label="Risk intelligence scope"] [role="tab"],
html.dark [data-vorta-dashboard-root="true"] [aria-label="Risk intelligence scope"] [role="tab"][aria-selected="true"] {
  background: transparent !important;
  box-shadow: none !important;
}

/* The Dashboard command bar is deliberately a quiet intelligence control, not
   a generic raised metadata panel. The #app anchor is deliberate: it gives the
   approved source-of-truth control enough specificity to outrank the legacy
   surface migration without changing component geometry. */
html.dark #app
  [data-vorta-dashboard-root="true"]
  [data-vorta-embedded-ai="true"]
  [class~="bg-[#0f1218]"][class~="border-gray-700"][class~="items-center"] {
  border-color: rgba(96, 165, 250, 0.24) !important;
  background-color: rgba(3, 12, 29, 0.72) !important;
  border-radius: 9999px !important;
  box-shadow: none !important;
}

</style>
<div id="app">
  <div id="vls">
    <div id="vls-halo"></div>
    <svg width="104" height="104" viewBox="0 0 104 104" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:relative;z-index:1">
      <defs>
        <linearGradient id="vls-g" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
          <stop offset="60%" stop-color="#3b82f6" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#93c5fd" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <rect id="vls-panel" x="4" y="4" width="96" height="96" rx="24" ry="24" fill="var(--vls-panel)"/>
      <rect id="vls-border" x="4" y="4" width="96" height="96" rx="24" ry="24" stroke="var(--vls-border)" stroke-width="1.5" fill="none"/>
      <rect id="vls-track" x="4" y="4" width="96" height="96" rx="24" ry="24"
        stroke="url(#vls-g)" stroke-width="2" fill="none" stroke-linecap="round"
        stroke-dasharray="75.02 265.98" stroke-dashoffset="341"
        style="animation:vls-pulse 2s linear infinite;filter:drop-shadow(0 0 4px #3b82f6) drop-shadow(0 0 10px rgba(59,130,246,.5))"/>
      <!-- Official Vorta logomark, scaled to 50×28.2, centred at (52,52) -->
      <svg id="vls-mark" x="27" y="38" width="50" height="28.2" viewBox="0 0 78 44" fill="none">
        <path d="M78 44L48.2658 26.4635C46.7603 25.5598 44 23.8524 44 22H51.0345L78 38.2105V44Z" fill="var(--vls-mark)"/>
        <path d="M78 0L48.2658 17.5365C46.7603 18.4402 44 20.1476 44 22H51.0345L78 5.78947V0Z" fill="var(--vls-mark)"/>
        <path d="M0 44L29.7342 26.4635C31.2397 25.5598 34 23.8524 34 22H26.9655L0 38.2105V44Z" fill="var(--vls-mark)"/>
        <path d="M0 0L29.7342 17.5365C31.2397 18.4402 34 20.1476 34 22H26.9655L0 5.78947V0Z" fill="var(--vls-mark)"/>
      </svg>
    </svg>
  </div>
</div>
<script>
  (() => {
    const recoveryKey = "vorta:stale-build-recovery";
    const recoveryQuery = "vorta_refresh";
    const recoveryWindowMs = 30000;

    const recoverFromStaleBuild = (event) => {
      const now = Date.now();
      const lastAttempt = Number(sessionStorage.getItem(recoveryKey) || "0");

      if (now - lastAttempt < recoveryWindowMs) {
        return;
      }

      event.preventDefault();
      sessionStorage.setItem(recoveryKey, String(now));

      const freshUrl = new URL(window.location.href);
      freshUrl.searchParams.set(recoveryQuery, String(now));
      window.location.replace(freshUrl.toString());
    };

    window.addEventListener("vite:preloadError", recoverFromStaleBuild);

    window.addEventListener("load", () => {
      sessionStorage.removeItem(recoveryKey);

      const cleanUrl = new URL(window.location.href);
      if (cleanUrl.searchParams.has(recoveryQuery)) {
        cleanUrl.searchParams.delete(recoveryQuery);
        window.history.replaceState({}, "", cleanUrl.toString());
      }

      document.documentElement.classList.add("theme-ready");
    });
  })();
</script>
<script type="module" src="./src/lib/maintenanceSessionRecovery.ts"></script>
<script type="module" src="./src/index.tsx"></script>
</body>
</html>
